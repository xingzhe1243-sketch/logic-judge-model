source: 麦肯锡教我的逻辑思维 — 完整知识引擎
description: >-
  McKinsey Logic Engine — 基于《麦肯锡教我的逻辑思维》（李昊轩） 全书12章完整索引： 第一章 什么是逻辑思维         第七章 金字塔结构
core_concepts:
- id: mece
  label: MECE法则：相互独立，完全穷尽
  source: 麦肯锡教我的逻辑思维（第四章第3节）
  summary: Mutually Exclusive, Collectively Exhaustive. 将问题各组成部分全部列出，确保各部分独立且穷尽，排除干扰思维的因素。
  quote: >-
    MECE是英文mutually exclusive collectively exhaustive的缩写，中文意思是'相互独立，完全穷尽'。MECE法则可以帮助人们排除干扰思维的因素，以便人们理清思路，做出正确的判断，采取正确的措施。
- id: pyramid
  label: 金字塔原理：逻辑思考的核心技巧
  source: 麦肯锡教我的逻辑思维（第七章）
  summary: 以核心结论为顶层，逐层展开支撑论据。子结构间存在纵向关系（递进/因果/时间/举例）和横向关系（并列/对比/列举）。
  quote: 金字塔结构是一种逻辑清晰、重点突出的思考结构。它是逻辑思考的核心技巧，能够帮助我们进行有效且高效的沟通。
- id: priority_matrix
  label: 四象限法则：重要性×紧急性优先级矩阵
  source: 麦肯锡教我的逻辑思维（第十章）
  summary: 将事情分为(1)重要且紧急、(2)重要但不紧急、(3)紧急但不重要、(4)既不紧急也不重要四类，优先级逐级下降。
  quote: >-
    在四象限法则中，事情被分为重要且紧急的事，重要但不紧急的事，紧急但不重要的事，既不紧急也不重要的事四类。这四类事情的优先级逐级下降，重要且紧急的事优先级最高，既不紧急也不重要的事优先级最低。
- id: logic_tree
  label: 逻辑树分析法（议题树/假设树/是否树）
  source: 麦肯锡教我的逻辑思维（第九章）
  summary: 以树的结构将问题延伸分解。议题树细分副议题；假设树先假设后证明；是否树做二元判断。遵循MECE法则确保不遗漏不重叠。
  quote: 逻辑树又称问题树、演绎树或分解树等，其表现方式为将一个问题以树的结构进行延伸，去设想可能与其有关的子问题，逐步进行扩展。
- id: seven_s
  label: 7S模型：企业组织七要素
  source: 麦肯锡教我的逻辑思维（第十二章）
  summary: 共同价值观(Shared Value)是核心。硬件三要素：战略、结构、制度；软件四要素：风格、人员、技能、共同价值观。
  quote: >-
    7S模型是由麦肯锡公司开拓的一种模型。这个模型中包含了企业组织七要素：共同价值观（Shared Value）、结构（Structure）、制度（System）、风格（Style）、人员（Stuff）、技能（Skill）和战略（Strategy）。共同价值观是最核心的一个要素，其他的六个要素都要以共同价值观为基础。
- id: eight_step
  label: 问题解决流程：从界定到执行
  source: 麦肯锡教我的逻辑思维（全书综合）
  summary: 界定问题→分解问题(MECE+逻辑树)→设定假设→收集数据→验证假设→导出结论→方案设计→落地执行。
  quote: 麦肯锡人通常采用以下的方式进行逻辑推理。
- id: eighty_twenty
  label: 20/80原则（二八定律/帕累托法则）
  source: 麦肯锡教我的逻辑思维（第三章第4节）
  summary: 80%的价值来自20%的因子。掌控最重要的少数因素是掌控全局的关键。应用于企业管理、人力资源管理、营销学和人生规划。
  quote: 麦肯锡认为，20/80原则对于企业的运营和成长都有着重要意义。它既可以应用于企业管理，也可以应用于人力资源管理，还可以应用于营销学。
- id: five_whys
  label: 追问「为什么」：从问题背后着手问题本身
  source: 麦肯锡教我的逻辑思维（第十一章第3节）
  summary: 第一次问'为什么'得到的原因往往不是真正原因，多次追问才能找到根本原因。养成质疑的习惯，多问几个'为什么'。
  quote: >-
    想要从问题背后着手问题，最关键的是要养成质疑的习惯，多问几个'为什么'。那么很多时候，我们第一次问'为什么'之后，得到的原因往往不是真正的原因，而当我们第二次，甚至许多次问过'为什么'之后，得到的才可能是真正的原因。
- id: reverse_reasoning
  label: 逆向推理：从正确结果反推逻辑正确性
  source: 麦肯锡教我的逻辑思维（第四章第5节）
  summary: 在已知结论为真的情况下逆向推理，验证逻辑本身的正确性。必须满足前提和结论有绝对因果关系且都正确。
  quote: 想要通过逆向推理来证明逻辑的正确性，必须满足两个条件：前提和结论之间有绝对的因果关系，前提和结论都是正确的。
- id: reconstruct_argument
  label: 重构论证：十二字法
  source: 麦肯锡教我的逻辑思维（第一章第4节）
  summary: 规整语言，调整顺序，补充完整。先识别论证中的前提和结论，再有序组织起来进行重构。
  quote: 重构论证的过程其实很简单，只要我们将所有论证的逻辑顺序进行调整，然后将论题放在最后即可，用十二个字去概括，即'规整语言，调整顺序，补充完整'。
- id: three_problem_types
  label: 问题的三种类型：恢复原状/预防隐患/追求理想
  source: 麦肯锡教我的逻辑思维（第三章第2节）
  summary: 恢复原状型——核心'掌握状况'；预防隐患型——核心'诱因分析与预防策略'；追求理想型——核心'选定理想与实施策略'。
  quote: 麦肯锡经过总结，认为问题与现实的不匹配主要有以下三种表现方式。其一为恢复原状型问题；其二为预防隐患型问题；其三为追求理想型问题。
- id: fact_based
  label: 以事实为基础：先看事实是麦肯锡的传统
  source: 麦肯锡教我的逻辑思维（第十一章第1节）
  summary: 即使是资深咨询顾问也不会脱口而出答案，必须先了解问题、搜集资料。事实是指引前进的方向。
  quote: 在麦肯锡人眼中，解决问题时必须要遵循的最重要规则就是"以事实为基础"。对于问题来讲，它的背后就是事实真相。
- id: elevator_test
  label: 电梯测验：30秒法则
  source: 麦肯锡教我的逻辑思维（第二章第3节）
  summary: 在30秒的电梯时间内将方案高度浓缩，清晰表达中心意思。语言的表达能力直接反映一个人的逻辑思维能力。
  quote: 乘坐电梯从你们所在的楼层到达楼下大概有30秒的时间，你需要在这有限的时间内将你们团队的方案高度浓缩，然后将中心意思简单明了地告诉这位首席执行官。
- id: counter_intuitive
  label: 反直觉思考：从问题本身出发
  source: 麦肯锡教我的逻辑思维（第八章）
  summary: 剥开迷惑表象，看到问题根本。风险越高的决定越需要反直觉思考。运气只起辅助作用，真正让问题得以解决的是实力。
  quote: 反直觉思考的根本就是从问题本身出发，而不是从问题的表象出发。当我们过于依赖直觉时，可能会忽略一些问题的根本，做出一些错误的决定。
- id: key_driver
  label: 关键驱动因素：最少力气解决最大难题
  source: 麦肯锡教我的逻辑思维（第五章第1节）
  summary: 关键驱动因素相当于人最脆弱的部位，识别后可用最少力气解决最大难题。不同企业的关键驱动因素各不相同。
  quote: 在大部分的成功商业案例中，关键驱动因素都起着极其重要的作用。因为对于任何一家企业来说，时间和资源都是有限的。

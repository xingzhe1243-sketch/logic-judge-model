source: 21世纪资本论 (Capital in the Twenty-First Century) — Thomas Piketty
description: >-
  基于原文完整提取的核心框架：r>g、资本/收入比、不平等结构、政策方案 Direct citations from the original Chinese edition.
core_concepts:
- id: r_g
  label: r > g（资本主义核心矛盾）
  source: 导言、第十章、结论
  summary: >-
    私人资本收益率r在长期显著高于经济增长率g，是资本主义内在的分化力量。r长期约4%-5%，g长期约1%-1.5%。不等式r>g意味着过去的财富积累比产出和工资增长更快，由此导致财富自动向少数人集中。这在直至一战前的人类历史大多数时候成立，21世纪很可能再次成立。
  quote: >-
    主要的不稳定因素与如下事实相关，即私人资本的收益率r可以在长期显著高于收入和产出增长率g。不等式r>g意味着过去的财富积累比产出和工资增长得要快。这个不等式表达了一个基本的逻辑矛盾。
- id: first_law
  label: 资本主义第一基本定律：α = r × β
  source: 第一章
  summary: >-
    α = r × β，即资本收入占国民收入的比重 = 资本收益率 × 资本/收入比。将资本存量和收入流量联系起来的恒等式。例如若β=600%，r=5%，则α=30%。
  quote: α=r×β是一个纯粹的会计恒等式。根据定义，该等式适用于所有社会的所有历史阶段。
- id: second_law
  label: 资本主义第二基本定律：β = s / g
  source: 第五章
  summary: β = s / g，即资本/收入比长期趋近于储蓄率与经济增长率之比。储蓄率越高或增长率越低，则资本/收入比越高。解释了为何低增长时代资本/收入比会持续上升。
  quote: 资本主义第二基本定律：β=s/g
- id: substitution_elasticity
  label: 资本/劳动替代弹性 > 1
  source: 第六章
  summary: >-
    当替代弹性大于1时，资本/收入比β的长期上升导致资本收入份额α也上升。这意味着资本增殖效应超越数量效应，资本所有者获得的国民收入份额随资本积累而增加。这是21世纪区别于传统农业社会的关键特征。
  quote: 21世纪的资本——劳动划分：弹性大于1
- id: capital_income_ratio
  label: 资本/收入比的U形曲线
  source: 第三至五章
  summary: >-
    欧洲（法、英）的资本/收入比在18-19世纪约600%-700%，1914-1945年因战争冲击暴跌至200%-300%，2010年已恢复至500%-600%，接近一战前水平。呈现显著的U形曲线。
  quote: 简而言之，我们在刚刚过去的一个世纪看到的是令人印象深刻的U形曲线。资本/收入比在1914~1945年下跌了近2/3，在1945~2012年又翻了一番多。
- id: patrimonial_middle
  label: 世袭中产阶层
  source: 第七章、第十章
  summary: >-
    财富分布中中间40%的人口，拥有总财富的25%-35%，虽远不及最富10%（约60%-65%），但远好于最穷50%（约5%）。这是20世纪最重要的财富分配结构性变化，改变了此前「要么极富要么赤贫」的两极格局。
  quote: >-
    我也注意到了"世袭中产阶层"的出现。这个中间阶层要比最穷的一半人富裕些，大致拥有社会总财富的1/4~1/3。毫无疑问，这个中间阶层的出现是影响长期财富分配的最为重要的结构性转变因素。
- id: supermanager
  label: 超级经理人的崛起
  source: 第九章
  summary: >-
    自1980年代以来，美国超高收入激增主要来自大公司高管的薪酬暴增。由于信息不对称，「个人边际生产率」概念难以客观界定，高管实际上参与了自己薪酬的设定。美英社会规范对高额薪酬的容忍度远高于欧洲大陆和日本。
  quote: 绝大部分超高收入人群均是大公司的高管。从个体"生产率"角度为这部分人的高薪寻求客观依据是十分天真的。
- id: kuznets_critique
  label: 库兹涅茨曲线批判
  source: 导言
  summary: >-
    库兹涅茨认为不平等先升后降是经济发展的自然规律。皮凯蒂证明20世纪中期不平等的下降并非自然趋势，而是两次世界大战和大萧条等外生冲击的结果。一旦冲击消退，不平等重新扩大。库兹涅茨理论很大程度上是冷战产物。
  quote: 库兹涅茨曲线很大程度上可以被看作是冷战的产物。
- id: rentier_vs_manager
  label: 食利者社会 vs 经理人社会
  source: 第八章、第十一章
  summary: >-
    食利者社会中前1%主要依靠资本收入，其生活水平远超最高薪劳动者（约25-30倍 vs 10倍）。经理人社会中劳动收入与资本收入大致平衡。20世纪中期后者取代前者，但21世纪食利者特征正在回归。
  quote: >-
    在很大程度上，我们已经从"食利者社会"走向了"经理人社会"，也就是说，从一个由食利者（拥有足够的资本，从而可以靠他们的财富产生的年收入为生的群体）占最高1%的社会，转向一个最高收入层级（包括前1%）主要由那些靠劳动收入为生的高薪个体构成的社会。
- id: labor_inequality
  label: 劳动收入不平等：教育和技术赛跑理论
  source: 第九章
  summary: >-
    该理论解释力不足：报酬激增高度集中在前1%乃至前0.1%，且各国差异巨大（美英远大于欧陆）。技术以连续方式影响所有国家，应导致相似结果，但事实并非如此。社会规范和文化因素比技术更关键。
  quote: >-
    边际生产率理论及教育与技术赛跑理论为工资分配的长期演变提供了一种合理的解释……但某些具体工作职能（尤其是大公司的高管层）变得越来越难以复制……社会规范的解释力随之增强。
- id: inheritance_u
  label: 继承财富的U形回归
  source: 第十一章
  summary: >-
    法国年度继承额占国民收入比重：19世纪和一战前约20%-25%；1950年代因战争冲击跌至4%-5%的历史低点；2010年已恢复至约15%。继承财富正在强势回归，1970年后出生者的继承额已接近19世纪水平。
  quote: 从19世纪至1914年，年度遗产继承额约占国民收入的20%~25%；随后在20世纪50年代下降到了不足5%的水平，但又在2010年恢复到约15%。
- id: lasthignac_dilemma
  label: 拉斯蒂涅困境
  source: 第十一章
  summary: >-
    19世纪，继承前1%的生活水准（低等阶层的25-30倍）远超劳动前1%（约10倍）。20世纪中期劳动前1%（10-12倍）超越继承前1%（5倍）。如今二者再度平衡（12-13倍 vs 11-12倍），拉斯蒂涅的困境重新出现。
  quote: 在19世纪，那些获得继承财富前1%的人群的生活水准要远高于当时工资最高1%的人群。
- id: by_formula
  label: 继承额三要素分解：by = μ × m × β
  source: 第十一章
  summary: >-
    年度继承额（by）= 逝者平均财富与生者之比（μ）× 死亡率（m）× 资本/收入比（β）。μ>100%表明逝者财富高于生者，这是继承财富持续存在的原因。莫迪利亚尼的生命周期储蓄理论（预期μ=0）被数据证伪。
  quote: 一般而言，年度遗产和馈赠额（在此以占国民收入的比重by）是三大因素作用下的结果：
- id: three_wealth_forms
  label: 三种财富形式的历史演变
  source: 第三章、第五章、第十一章
  summary: >-
    18-19世纪以农地（土地资本）为主；20世纪转变为住宅不动产和工业/金融资本（股票、债券、厂房）；当前又增加了人力资本和公共资本。但总量占国民收入的比重并未因形式转变而改变。
  quote: 资本的主要表现形式从以前的土地变成了如今的工业资产、金融资产和房地产。
- id: global_capital_tax
  label: 全球累进资本税
  source: 第十五章、结论
  summary: >-
    对全球范围的个人财富征收年度累进税：100万欧元以下0.1%-0.5%；100万-500万1%；500万-1000万2%；数千万至数十亿5%-10%。目的不是消除资本而是遏制失控的财富集中，需要高水平国际协作。
  quote: 正确的解决方案是征收年度累进资本税。这将能避免无休止螺旋式的不平等，同时保护对新型原始积累的竞争和激励。
- id: public_debt
  label: 公共债务与一次性资本税
  source: 第十六章
  summary: >-
    反对严厉紧缩政策，主张通过渐进一次性资本税削减公共债务。强调欧洲国家私人财富创历史新高（500%-600% GDP），公共债务相比之下并非不可解决。批评欧元区缺乏财政同盟导致南欧国家陷入困境。
  quote: >-
    欧洲国家从未如此富裕。另一方面，真正可耻的是这样巨大的国民财富分配极其不公。私人财富建立在公众贫困的基础上，一个特别不幸的结果是我们现在在债务利息上的支出远超过我们投资于高等教育的费用。
- id: euro_budget
  label: 欧洲预算议会
  source: 第十六章
  summary: 主张建立由各国议员组成的欧洲预算议会，通过民主讨论决定欧元区公共债务合并和赤字水平。认为无国家的货币需要相应的财政主权让渡，否则税收竞次和金融不稳定将延续。
  quote: 对欧元区国家（或至少那些愿意的）而言，克服这些矛盾的唯一途径是合并经营其公共债务。
- id: progressive_income_tax
  label: 累进所得税与最高边际税率
  source: 第十四章
  summary: >-
    20世纪美国曾实行高达82%-91%的最高边际所得税税率（1930-1980年），高税率起到了保护性屏障作用，约束了高管薪酬的爆炸式增长。1980年后税率大幅降低，与超级经理人薪酬飙升同步。
  quote: >-
    英语国家20世纪90年代以来最高边际所得税税率的大幅降低（尽管在过去不久的几十年里，英国和美国也尝试过近乎没收性质的税收制度，但这注定是不合理的）似乎完全改变了高管薪酬的设定方式，因为高管们现在比过去有更强的动机追求薪酬的大幅上涨。
- id: wealth_inequality_global
  label: 21世纪全球贫富差距
  source: 第十二章
  summary: >-
    自2010年以来全球财富不平等程度与欧洲1900-1910年相近：最富0.1%拥有全球财富约20%，最富1%拥有约50%，最富10%拥有80%-90%，下半段人口拥有不足5%。大额财富增速（6%-7%）远超人均财富增速（2.1%）和人均收入增速（1.4%）。
  quote: >-
    全球最富的0.1%人群（即全球45亿成年人口中的450万人）所拥有的平均财富大约是1 000万欧元，约为全球人均财富6万欧元的200倍，这些人拥有的全部财富相当于全球财富总额的20%。而最富有的1%人群（即4
    500万人）所拥有的平均财富是300万欧元（广义来说，这部分群体包括所有个人财富超过100万欧元的人）。这是全球人均财富的50倍，这些人一共掌握着全球财富总额的50%。
- id: endowment_returns
  label: 大学基金会投资回报的规模效应
  source: 第十二章
  summary: >-
    1980-2010年美国大学基金会年均净收益率8.2%。资产越大收益越高：<1亿美元6.2%，>10亿美元8.8%，哈佛/耶鲁/普林斯顿10.2%。规模效应使大资本可比小资本支付更高额管理费聘请顶级投资团队，获得更高回报。
  quote: 管理资产规模越大，收益就越高。
- id: oligarch_vs_international
  label: 寡头两极化而非国际两极化
  source: 第十二章
  summary: >-
    真正的危险不是国家间财富转移（如「中国买下全世界」的担忧是杞人忧天），而是各国国内的寡头两极分化。随着全球经济增速放缓和各国对资本竞争加剧，前1%超级富豪的财富将与大众越拉越大。
  quote: 最大的危险还是在于国内寡头的崛起，即越来越多的发达国家资产将集中在国内富豪手里。
- id: political_economy
  label: 政治经济学方法
  source: 导言、结论
  summary: >-
    皮凯蒂反对「经济科学」的表述，主张「政治经济学」，强调经济学的政治和道德目的。反对过度数学化，主张以历史数据为基础、与其他社会科学紧密合作。方法是「序列数据法」——系统构建横跨数十年至数百年的收入和财富分配数据序列。
  quote: >-
    我不喜欢"经济科学"（economic science）这一表述，为其中的极端傲慢感到震惊，这是因为它暗示经济学获得了比其他社会科学更高的科学地位。我更喜欢"政治经济学"（political economy）这一表述，它可能显得有些过时，不过在我看来传递了经济学和其他社会科学的唯一区别：其政治、规范和道德目的。
- id: balzac_austen
  label: 巴尔扎克与奥斯汀笔下的食利者社会
  source: 第二章、第十一章
  summary: >-
    19世纪小说精确记录了财富分层。巴尔扎克笔下「体面生活」门槛是平均收入的20-30倍；高老头为女儿各备50万法郎嫁妆（年租平均收入50倍）。奥斯汀笔下诺兰庄园年入4000英镑（平均收入的100倍）。这种极端贫富差距被视为「文明的条件」。
  quote: 巴尔扎克和奥斯汀所选择的上流社会门槛是平均收入的20~30倍。

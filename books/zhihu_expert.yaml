# 知乎专家知识域
# 作为智囊团中的"知乎专家"，提供真实世界的经验与洞见
# 数据源: 知乎爬虫自动收集的高赞回答

source: "知乎集体智慧 (Zhihu Crowd Wisdom)"
description: >
  知乎专家知识库 — 从知乎高赞回答中提炼的社会运行规律、经济认知、
  心理洞见、人际智慧与决策策略。覆盖5大领域：社会与权力、
  经济与职场、认知与心理、人际关系、策略与决策。

domains:
  social_power:
    name: "社会与权力"
    description: "社会底层规则、权力运行逻辑、阶层跨越路径、人性真相"
    question_types:
      - "世界的真相/底层规则/潜规则"
      - "人性阴暗面/权力本质"
      - "社会阶层/跨越路径"

  economy_career:
    name: "经济与职场"
    description: "赚钱本质、财富积累、职场晋升、资本逻辑"
    question_types:
      - "赚钱/财富积累/资产配置"
      - "职场晋升/打工困境"
      - "经济规律/资本逻辑"

  cognition_psychology:
    name: "认知与心理"
    description: "认知升级、心理成长、自律本质、深度思考"
    question_types:
      - "认知提升/思维升级"
      - "自律/改变/变强"
      - "焦虑管理/深度思考"

  relationships:
    name: "人际关系"
    description: "社交底层逻辑、识人技巧、情商沟通、亲密关系"
    question_types:
      - "人际本质/社交规则"
      - "识人/情商/说话"
      - "亲密关系/价值观"

  strategy_decision:
    name: "策略与决策"
    description: "选择方法论、长期主义、风险博弈、人生规划"
    question_types:
      - "选择/决策/判断"
      - "长期主义/风险控制"
      - "博弈思维/人生护城河"

usage:
  integration: >
    当分析包含上述domain关键词的文本时，自动查询知乎数据库中的
    高赞回答（赞同数≥100），按相关性排序返回匹配结果。每个回答
    包含作者、问题标题、内容摘要和赞同数，作为经验性参考。
  synthesis: >
    在最终报告中，知乎专家提供的洞见可作为"真实世界经验视角"
    补充到主要分析中，与九本经典的逻辑框架形成互补。

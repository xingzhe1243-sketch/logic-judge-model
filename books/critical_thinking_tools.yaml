source: 批判性思维工具 (Richard Paul & Linda Elder)
description: 思维8元素模型——任何推理都可以用8个元素分析
elements_of_thought:
- '目的: 推理试图达成什么目标？目标是清晰的、公正的吗？'
- '问题: 试图回答的核心问题是什么？问题本身是否合理？'
- '信息: 基于什么数据/事实/经验？信息是否充分相关？'
- '解释: 如何组织信息并得出结论？是否采用了正确的推理方式？'
- '概念: 核心概念/理论是什么？概念定义是否清晰？'
- '假设: 默认的前提假设是什么？假设是否合理？'
- '结果: 如果接受推理，后果是什么？是否考虑了所有后果？'
- '观点: 从什么视角出发？是否考虑了其他视角？'
intellectual_standards:
- '清晰性: 能举例说明吗？能详细阐述吗？'
- '准确性: 这是真的吗？如何验证？'
- '精确性: 能给出更多细节吗？够具体吗？'
- '相关性: 这与问题有关联吗？'
- '深度: 是否处理了问题的复杂性？'
- '广度: 是否考虑了其他视角？'
- '逻辑性: 推理链条是否连贯一致？'
- '重要性: 关注了最重要的问题吗？'
- '公正性: 是否考虑了所有相关方？'
intellectual_traits:
- '思维谦逊: 认识到自己不知道什么'
- '思维勇气: 敢于挑战主流和权威'
- '思维共情: 设身处地理解他人观点'
- '思维诚信: 要求自己与要求他人同一标准'
- '思维坚毅: 不放弃复杂困难的问题'
- '思维自主: 形成自己独立的判断'
- '思维公正: 超越个人利益看问题'
egocentric_thinking:
  description: '自我中心思维: 以自我为中心，无法考虑他人的观点和权利'
  patterns:
  - 我是对的，你是错的
  - 我的利益优先
  - 我的感受最重要
  - 如果我觉得是这样那就是这样
  overcome: '反向思考: 如果别人处在我位置会怎么想？'
sociocentric_thinking:
  description: '社会中心思维: 无意识地接受群体/文化的信念和价值观'
  patterns:
  - 我们 vs 他们
  - 我们的方式是最好的
  - 传统就是正确的
  overcome: 识别文化预设，跳出'理所当然'

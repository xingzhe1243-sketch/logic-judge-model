source: 影响力 (经典版)
description: 'Influence: The Psychology of Persuasion — Robert B. Cialdini'
core_concepts:
- id: weapons_of_influence
  label: 影响力的武器
  source: 第1章 影响力的武器
  summary: >-
    人类行为中存在自动化的响应模式，这些模式可以被触发——就像按下一个按钮。动物和人类都有固定的行为模式，在特定触发特征出现时自动启动。这些自动化模式在大多数情况下是有效的捷径，但也容易被利用。
  quote: >-
    事实上，模式化的自动行为在大部分人类活动中是相当普遍的，因为很多时候，它是最有效的行为方式；另一些时候，它则是必要的。你我生活在一个极端复杂的环境中——说不定是地球有史以来变化最为迅速的了，为了对付它，我们需要捷径。哪怕就是短短的一天当中遇到的每一个人、每一件事，我们也不可能把相关的方方面面都辨识出来，分析出来。我们做不到，因为我们没有足够的时间、精力和能力。相反，我们必须频繁地利用我们的范式、我们的首选经验，根据少数关键特征把事情分类，一碰到这样那样的触发特征，就不假思索地作出反应。
- id: contrast_principle
  label: 对比原理
  source: 第1章 影响力的武器
  summary: 当两件事物一前一后展示时，第二件事物与第一件事物之间的差异会被感知放大。先展示贵的再展示便宜的，便宜的就显得更便宜；先展示差的再展示好的，好的就显得更好。
  quote: >-
    人类在认知方面有个原理，叫"对比原理"。两样东西一前一后地展示出来，我们怎样看待其间的区别，对比原理是有影响的。简单地说，要是第二样东西跟第一样东西有着相当的不同，那么，我们往往会认为两者的区别比实际上更大。
- id: reciprocity
  label: 互惠原理
  source: 第2章 互惠
  summary: 互惠原理认为，我们应该尽量以同样的方式回报他人为我们所做的一切。这个原理如此强大，以至于即使是我们不喜欢的人，只要先给了我们好处，我们也会觉得有义务回报。
  quote: >-
    这条原理说，要是人家给了我们什么好处，我们应当尽量回报。假设有位女性帮了我们的忙，我们应当也帮她一回；倘若有个男的送给我们一份生日礼物，我们应当记得在他生日时献上小小心意；要是有对夫妇邀请我们参加聚会，我们下次务必要记得邀请他们参加我们的。故此，依照互惠原理，我们有义务在将来回报别人的好意、礼物、邀请等。
- id: reciprocal_concession
  label: 互退让步
  source: 第2章 互惠
  summary: 互惠原理的变体：先提出一个大的（对方会拒绝的）要求，再提出真正的小要求，对方会因为感觉你让步了而产生互惠式让步的心理压力，从而更可能答应小要求。
  quote: >-
    这种技巧很简单，一般叫做"拒绝—后撤"术，也叫"留面子"法。假设你想让我答应你的某个请求，为了提高获胜的概率，你可以先向我提一个大些的要求——对这样的要求我保准是要拒绝的，等我真的拒绝这个要求以后，你再提出一个稍小的要求，这个要求才是你真正的目标。倘若你的要求设置巧妙，我会把你的第二个要求看成是一种对我的让步，并有可能感到自己这边也应该让让步，于是就顺从了你的第二个要求。
- id: commitment_consistency
  label: 承诺和一致原理
  source: 第3章 承诺和一致
  summary: 一旦我们做出了一个选择或采取了某个立场，就会遇到来自个人和外部的压力，迫使我们按照这个承诺行事。即使最初的承诺是小事，也会让我们倾向于保持一致。
  quote: >-
    人人都有一种言行一致（同时也显得言行一致）的愿望。一旦我们作出了一个选择，或采取了某种立场，我们立刻就会碰到来自内心和外部的压力，迫使我们按照承诺说的那样去做。在这样的压力之下，我们会想方设法地以行动证明自己先前的决定是正确的。
- id: foot_in_door
  label: 登门槛技巧
  source: 第3章 承诺和一致
  summary: 先让人答应一个小要求，再提出真正的大要求，同意的概率会显著提高。因为答应了小要求后，人们会为了保持一致的自我形象而继续答应相关的大要求。
  quote: >-
    请注意，所有的"登门槛"专家似乎都对同一件事情感到兴奋不已：你可以利用小小的承诺操纵一个人的自我形象；你可以利用它们把人们变成"公仆"，把潜在客户变成"客户"，把战俘变成"合作者"。只要你把一个人的自我形象设置在了你想要的位置上，那么这个人就会自然而然地遵从一整套与这一全新自我形象相一致的要求。
- id: public_commitment
  label: 公开承诺的力量
  source: 第3章 承诺和一致
  summary: 公开作出的承诺比私下的承诺更有约束力。书面承诺比口头承诺更有力，因为它提供了实实在在的证据，而且可以被他人看到。
  quote: >-
    每当一个人当众选择了一种立场，他便会产生维持它的动机，因为这样才能显得前后一致。我在本章前面的部分提到过，前后一致是一种很好的为人特点；不具备这一特点的人，会被视为浮躁、多变、优柔寡断、糊涂、欠缺稳定；具备这一特点的人，则显得理性、自信、可靠、值得信赖。考虑到这样的背景，也就怪不得人们总是避免显得前后不一了。故此，出于观感上的原因，一个立场越是公开，人就越不愿意对其作出改变。
- id: social_proof
  label: 社会认同原理
  source: 第4章 社会认同
  summary: 在判断什么是正确的时，我们会根据别人的意见行事。社会认同原理认为，一种行为在特定情境下越是常见，我们就越倾向于认为它是正确的。这在不确定性和模糊情境中最为有力。
  quote: >-
    社会认同原理。该原理指出，在判断何为正确时，我们会根据别人的意见行事。这一原理尤其适用于我们对正确行为的判断，特定情形下在判断某一行为是否正确时，我们的看法取决于其他人是怎么做的。
- id: pluralistic_ignorance
  label: 多元无知效应
  source: 第4章 社会认同
  summary: 在紧急情况下，每个人都认为别人会去帮助，结果没人帮助。旁观者越多，个人提供帮助的可能性越小。知道这一效应的人会直接指定某人去求助，而不是对着一群人呼喊。
  quote: >-
    除了人为伪造社会证据的情况，还有另一种时候社会认同原理会导向失误。此时，一个纯属无心的失误会像雪球一样越滚越大，逼使我们作出错误的决定。多元无知现象——明明出现了紧急事件，可人人都觉得没什么好惊慌的，就是这种情况下的一个例子。
- id: liking
  label: 喜好原理
  source: 第5章 喜好
  summary: 人们更愿意答应自己喜欢的人的要求。影响喜好的因素包括：外表吸引力、相似性、赞美、接触和合作、关联性。
  quote: >-
    我们大多数人总是更容易答应自己认识和喜欢的人所提出的要求。对于这一点，恐怕不会有人感到吃惊。令人吃惊的地方在于，有些我们完全不认识的人，却想出了上百种方法利用这条简单的原理，让我们顺从他们的要求。
- id: authority
  label: 权威原理
  source: 第6章 权威
  summary: 人们对权威有一种天然的服从倾向。即使权威的象征（如头衔、制服、身份标识）而不是真正的权威，也能引发这种服从。权威意味着权力和专业知识的象征。
  quote: >-
    打从第一次看到罗伯特·扬的桑卡咖啡广告，我就觉得它最有趣的一点在于：它利用了权威原理带来的影响力，却根本不曾拿出一个真正的权威，光是看起来像权威就足够了。这说明，我们对权威人物的下意识反应有一点很重要的特性：一旦处在"按一下就播放"的模式，只要拿出权威的象征就能将我们降服了。
- id: scarcity
  label: 稀缺原理
  source: 第7章 稀缺
  summary: 人们认为难以获得的东西更有价值。机会越少，我们对失去它的恐惧就越强烈，从而越想要它。限量版、限时优惠、独家信息都利用了这一原理。
  quote: >-
    由于稀缺原理在我们确定事物价值时有着强大的影响力，很自然地，顺从专业人士就会搞些类似的小把戏。最直截了当的做法，是所谓的"数量有限"策略：告诉顾客，某种商品供不应求，不见得随时都有。
- id: psychological_reactance
  label: 心理抗拒
  source: 第7章 稀缺
  summary: 当自由受到限制时，人们会产生逆反心理，想要恢复自由，从而更加渴望被限制的东西。青春期叛逆和对被禁信息的好奇心都是心理抗拒的体现。
  quote: >-
    机会越来越少的话，我们的自由也会随之丧失。而我们又痛恨失去本来拥有的自由。保住既得利益的愿望，是心理逆反理论的核心。心理学家杰克·布雷姆（Jack Brehm）提出这个理论，以此解释人类在丧失个人控制权时作出的反应。根据这个理论，只要选择自由受到限制或威胁，保护自由的需求就会使我们想要它们（以及与其相关的商品和服务）的愿望愈发强烈。
- id: instant_influence
  label: 即时影响力
  source: 尾声 即时的影响力
  summary: 在信息爆炸的时代，人们越来越依赖自动化决策捷径。这些捷径在大多数情况下是高效的，但也使我们容易受到精心设计的顺从策略的攻击。
  quote: >-
    在没有意愿、没有时间、没有精力，或没有认知资源对情况进行全面分析的时候，我们最容易使用这些孤立的线索。倘若我们正赶时间、压力大、不确定、不在乎、心烦意乱或心力憔悴，我们往往会把焦点放在一些片面的信息上。在这类环境下作决定，我们通常使用的都是原始而必要的"单一可靠证据"法。这一切带出了一个令人不安的结论：靠着成熟而精密的大脑，我们建立了一个信息繁多的快节奏复杂世界，使得我们不得不越发依赖类似动物（我们早就超越了的动物！）的原始反应方式来应对它。

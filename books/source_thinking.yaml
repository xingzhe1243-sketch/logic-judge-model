source: 源思维 (何艳玲)
description: 洞穿本质的深度思考法 — 从还原事实、辨析因果到锚定切口的深度思考模型
three_layers:
  description: 思维层次的三个递进概念：现象→事实→本质
  phenomenon: '第一层 现象: 事物外在的、表面的、可被直接观察到的表现 (''观其然'')。现象可能是虚假的、误导的。如''小天没有交作业''描述的就是一个现象'
  fact: '第二层 事实: 现象传递的客观信息，对现象进行客观描述和解释的结果 (''是其然'')。一个现象背后的事实有多重可能，需要思考甄别。如小天没交作业可能因为: A.时间不够 B.不会做 C.对老师不满'
  essence: '第三层 本质: 事实的根本属性 (''所以然'')，需要深度思考研判。需要追问为什么: A.为什么时间不够? B.为什么不会做? C.为什么不满?'
  principle: 深度思考是探究事物本质的思维模式。停留在现象层或事实层都是浅层思考。从现象层到事实层再到本质层，才是深度思考的过程
deep_vs_shallow:
  description: 深度思考与浅层思考的根本区别
  shallow_thinking: 单一断定思维主导 — 只有一个假设，没有提供证明材料支持逻辑，只断定没论证，通常是内部归因(将原因归结为很难改变的天性如'懒惰')。如'因为小天懒惰所以没交作业'
  deep_thinking: 多元因果思维驱动 — 提出尽可能多的假设(还原事实)，通过证据验证假设(辨析因果)，找到关键变量和解决方案(锚定切口)
  why_deep_is_hard:
  - 要脱离惯性思维，跳出自己看自己 — 伤脑细胞
  - 跳出自己看自己后，可能意味着要否定自己
  - 要不断进入细节推演，像侦探一样寻找真相 — 非常烧脑
  why_deep_is_worth:
  - 往前走的时候有了地图，不再东一榔头西一棒子
  - 会变得非常坚定，不容易被外界质疑和声音影响
  - 减少随波逐流带来的伤害
core_model:
  description: 源思维三步模型：还原事实→辨析因果→锚定切口，形成从深度思考到有效行动的闭环
  step1_restore_facts:
    title: '环节1: 还原事实'
    description: 透过现象还原事实，是源思维模型的第一步。现象与事实之间存在着巨大鸿沟，现象如同虚幻的影子，事实是隐藏在表象背后的真实本体。还原事实要运用系统2(慢思考)进行深入分析
    sub_steps:
    - '第一步: 识别关键概念 — 找出文本/现象中的核心概念。如''老师说小天不听话''中的关键概念是''不听话'''
    - '第二步: 定义关键概念 — 明确关键概念的准确含义。如''不听话''需要补充参照对象(不听谁的话)，''话''可能指: A.学校制度 B.老师要求 C.老师任何言论'
    - '第三步: 重新表述事实 — 基于定义形成多种可能的事实表述。如''不听话''可能指: A.不遵守学校制度 B.行为不符合班级要求 C.与老师意见不一致'
    definition_importance: 定义是知识的开始(亚里士多德)，也是源思维的开始。精准定义是还原事实的核心，定义问题的精度决定解决问题的效度。重新定义问题也就是在解决问题(如特斯拉重新定义汽车，苹果重新定义手机)
    classification: 归类(概括)是还原事实的核心能力。归类以事物的共性为基础，要舍弃非本质现象抓住核心。概括被誉为思维的第一属性
  step2_causal_analysis:
    title: '环节2: 辨析因果'
    description: '深度思考的核心。通过收集证据、严密推理来验证假设的过程，不满足于表面相关关系，深入挖掘背后的因果关系。可以概括为: 因为X，所以Y'
    causation_conditions:
    - '条件1 — 关联性: X和Y之间存在某种形式的关联'
    - '条件2 — 时间顺序: 原因总是在结果之前发生(但并非所有先后关系都是因果，如冰激凌销量与溺水人数)'
    - '条件3 — 无其他干扰: 需要排除其他可能解释，控制其他可能影响结果的变量'
    two_levels:
    - '第一层: ''这是因为…''(This is because) — 探寻事物的起因，找到影响结果的关键变量'
    - '第二层: ''这意味着什么…''(So this means) — 解读事物的意义，理解关键变量对未来可能产生的影响，找到行动的关键切口'
    induction: '归纳法: 从特殊推导一般的推论方式，从大量个体事件中提炼共性规律。归纳法不能保证绝对正确(如黑天鹅)，但提供有力的参考框架。警惕以偏概全的陷阱'
    deduction: '演绎法(三段论): 从一般推导特殊的证明方式。大前提+小前提→结论。大前提的验证至关重要，因为一旦大前提错误整个演绎过程崩塌。熟练运用三段论分析言论，可提升思维严密性和批判性思维能力'
    syllogism_structure: '三段论结构: 大前提(普遍认可的事实或原则) + 小前提(具体案例) → 结论(逻辑推演结果)'
    key_variable: '关键X: 在众多变量中起决定性作用的因素。深度思考就是在错综复杂的条件中探寻真实的关键变量 — 决定''何以能如此''的最重要条件。找到关键X就找到了解决问题的钥匙'
    sub_steps:
    - '第一步: 提出假设 — 结合经验和知识提出多种假设(能力假设/心态假设/制度假设等)'
    - '第二步: 验证假设 — 通过客观真实的证据来分析验证(实验法/问卷调查/沟通/观察/第三方了解等)'
    - '第三步: 重提假设 — 如果原假设不成立，再次提出新假设，重新收集验证，迭代直至找到真相'
    avoid_scapegoat: '避免替罪羊思维: 寻找事件背后的原因，而不是寻找事件背后的坏人。从寻找''罪魁祸首''转向深入挖掘事件背后的系统性、结构性原因'
  step3_find_cut_point:
    title: '环节3: 锚定切口'
    description: '深度思考必须为实际行动提供明确指引。锚定切口是在浩繁复杂的因果网络中找到能够引发连锁反应、解决问题的关键突破口。这一环节让源思维模型构成闭环: 从深度思考到有效行动的闭环'
    immediate_incentive: '即时激励: 锚定切口的核心。多数人不能深陷困境中涅槃，而是深陷困境中沉沦。需要创造即时激励 — 将长远目标分解成触手可及的小目标，每完成一个就给自己奖励。最重要的即时激励是''能完成'''
    sub_steps:
    - '第一步: 明确方向 — 在辨析因果基础上，找到问题根源后对症下药'
    - '第二步: 制订计划 — 根据方向制订详细或简单的行动计划'
    - '第三步: 即时激励 — 为行动设计即时回报机制，确保可持续执行'
    action_value: 只有行动才能产生价值。从简单开始，选择一个易于实现的行动作为起点。'小步试错，快速迭代'
bad_thinking_habits:
- 未充分还原事实就急于辨析因果 — 导致对问题的理解偏离真相
- 在缺乏深入辨析因果的情况下匆匆得出结论 — 导致以偏概全、一叶障目
- 立场先行、否定异己 — 固守立场排斥其他观点，限制了视野和思想交流
- 用情绪宣泄代替辨析因果 — 情绪主导时无法冷静客观分析问题
scientific_spirit:
  description: 源思维帮助领悟科学精神 — 一种求真精神，强调可证伪性和连续性
  falsifiability: '可证伪性: 一个科学结论必须可以假设出可观测的条件，该条件若不成立则结论为错误'
  continuity: '连续性: 科学结论在时间和空间上保持一致性，条件成立前提下过去现在未来都成立'
thinking_tools:
  thinking_log: '思维日志: 描述重要事件→记录主要行为→记录对方反应→反思可改进之处。是反思过程和结构化表达的有效方式'
  structured_expression: '结构化表达: 明确问题本质和目标→分解为更小的部分(5W1H/鱼骨图)→综合分析(决策树)。源思维就是思考过程的结构化表达'
  innovation_chain: '创新链(MRCCS): M修改(调整优化元素)→R重组(重新设计流程结构)→C改变(融入新功能特性)→C组合(跨界整合)→S代替(探索替代方案)。用于破解两难问题'
  samic_plan: 'SAMIC好计划五要素: S具体性→M可衡量性→A可实现性→M意义性→T时限性'
life_application:
  life_control: 源思维帮助建立生活控制感，明白'做了什么会发生什么，不做什么就不会发生什么'
  dark_time: 源思维帮助创造暗时间 — 走路买菜、坐车等候时都可以深度思考，善于利用暗时间的人比别人多出很多有效时间
  support_forces: '人生支持力(四种大能力): 理想力(通过职业承担社会角色)/规划力(为理想设置阶段目标)/猎知力(基于问题导向的知识系统化)/专业力(在特定领域深耕)'
  correction_forces: '人生纠偏力(四种大能力): 决策力(关键时刻明智选择)/靶向力(聚焦核心精准度)/沟通力(协作交流)/调适力(应对变化)'
ideal_section:
  definition: '理想，不是成为谁，而是为什么而成为谁。理想是通过职业承担特定社会角色。涉及两个维度: ''我做什么''(职业/载体)和''我能承担什么''(社会角色/志向)'
  ideal_key_variable: 生涯管理 — 需要明确目标和愿景、详细时间表、切实可行的行动计划
  ideal_key_cut: 故事清单 — 通过回忆个人经历故事，挖掘内心真正渴望的感觉和情感，找到初心和理想
planning_section:
  definition: '规划力: 为理想设置不同阶段目标的能力。将理想分解为短期、中期和长期目标，设定明确时间节点和行动计划'
  planning_key_variable: '时间管理 — 明确每个时间段的核心任务并持续完成。推荐方法: 艾森豪威尔矩阵/番茄工作法/单点专注/每日三件事/时间追踪'
  planning_key_cut: 愿望清单 — 通过构想未来场景(如AI取代工作后怎么办/不必担忧生计想过什么生活)构建愿望图景
  505133_law: '505133法则: 没有50年洞见要有5年眼光→没有5年眼光要有1年梦想→没有1年梦想要有3个月计划→至少知道自己每天最重要的三件要事'
knowledge_section:
  definition: '猎知力: 基于问题导向的知识系统化能力。像猎人一样主动、目标明确地猎取知识，构建知识体系'
  knowledge_pyramid: '知识金字塔: 数据→信息→知识→能力'
single_cause_warning: '警惕单一断定思维 — 将复杂现象归因于单一因素(如''懒惰'')。单一断定思维的特点是: 只有一个假设、没有提供证明材料、只断定没论证、通常是内部归因'
multi_causal_thinking: 多元因果思维 — 对同一现象提出尽可能多的假设(多元维度)，通过证据验证，找到真正的原因。深度思考往往不会轻易用内在特质标签(如'懒惰')解释行为

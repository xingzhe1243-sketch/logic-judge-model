source: 国富论 (The Wealth of Nations) — 亚当·斯密 完整知识引擎
description: >-
  Adam Smith's The Wealth of Nations — 五篇完整索引 全书五篇结构： 第一篇  论劳动生产力增进的原因并论劳动生产物自然而然地分配给各阶级人民的顺序
core_concepts:
- id: division_of_labor
  label: 分工：劳动生产力增进的根本原因
  source: 国富论（第一篇第一章）
  summary: 劳动生产力上最大的增进及其表现的更大熟练、技巧和判断力，都是分工的结果。以扣针制造业为例，分工可使产量提升数百倍。
  quote: 劳动生产力上最大的增进，以及运用劳动时所表现的更大的熟练、技巧和判断力，似乎都是分工的结果。
- id: three_reasons_division
  label: 分工提高生产力的三大原因
  source: 国富论（第一篇第一章）
  summary: 分工使同数劳动者完成更多工作量：一因技巧业专日进；二因免除工种转换的时间损失；三因机械发明简化劳动。
  quote: >-
    有了分工，同数劳动者就能完成比过去多得多的工作量，其原因有三：第一，劳动者的技巧因业专而日进；第二，由一种工作转到另一种工作，通常须损失不少时间，有了分工，就可以免除这种损失；第三，许多简化劳动和缩减劳动的机械的发明，使一个人能够做许多人的工作。
- id: origin_of_division
  label: 分工的原由：互通有无的倾向
  source: 国富论（第一篇第二章）
  summary: 分工不是人类智慧预谋的结果，而是互通有无、物物交换、互相交易这一人类倾向缓慢而逐渐造成的结果。
  quote: >-
    引出上述许多利益的分工，原不是人类智慧的结果，尽管人类智慧预见到分工会产生普遍富裕并想利用它来实现普遍富裕。它是不以这广大效用为目标的一种人类倾向所缓慢而逐渐造成的结果，这种倾向就是互通有无，物物交换，互相交易。
- id: market_limits_division
  label: 分工受市场范围的限制
  source: 国富论（第一篇第三章）
  summary: 分工起因于交换能力，其程度受交换能力大小即市场广狭的限制。水运开拓的市场远大于陆运，故产业分工改良始于沿海沿河一带。
  quote: 分工起因于交换能力，分工的程度，因此总要受交换能力大小的限制，换言之，要受市场广狭的限制。
- id: origin_of_money
  label: 货币的起源：克服物物交换的不便
  source: 国富论（第一篇第四章）
  summary: 分工确立后，各人为避免物物交换的不便，随身携带某种公认不会拒绝接受的物品作为交换媒介，这种物品逐渐演变为货币。
  quote: >-
    自分工确立以来，各时代各社会中，有思虑的人，为了避免这种不便，除自己劳动生产物外，随时身边带有一定数量的某种物品，这种物品，在他想来，拿去和任何人的生产物交换，都不会见拒绝。
- id: money_as_medium
  label: 货币作为通用媒介
  source: 国富论（第一篇第四章）
  summary: 货币在一切文明国中成为商业上的通用媒介，一切货物通过货币进行买卖和相互交换。
  quote: 货币却就在这情况下，成为一切文明国商业上的通用媒介。通过这媒介，一切货物都能进行买卖，都能相互交换。
- id: use_value_exchange_value
  label: 使用价值与交换价值的区分
  source: 国富论（第一篇第四章）
  summary: 价值有双重含义：使用价值表示特定物品的效用，交换价值表示对他种货物的购买力。二者往往背离——水用途最大却几无交换价值，金刚钻几无使用价值却交换价值极大。
  quote: 价值一词有二个不同的意义。它有时表示特定物品的效用，有时又表示由于占有某物而取得的对他种货物的购买力。前者可叫做使用价值，后者可叫做交换价值。
- id: labor_theory_value
  label: 劳动价值论：劳动是交换价值的真实尺度
  source: 国富论（第一篇第五章）
  summary: 一个人是贫是富取决于他所能支配的劳动量。劳动是衡量一切商品交换价值的真实尺度，是一切商品的真实价格，货币只是名义价格。
  quote: 劳动是衡量一切商品交换价值的真实尺度。
- id: real_vs_nominal_price
  label: 真实价格与名义价格
  source: 国富论（第一篇第五章）
  summary: 劳动的真实价格是报酬劳动的一定数量的生活必需品和便利品；名义价格则是报酬劳动的一定数量的货币。同一名义价格可对应极不相同的真实价格。
  quote: >-
    所以，按照通俗的说法，劳动也象商品一样可以说有真实价格与名义价格。所谓真实价格，就是报酬劳动的一定数量的生活必需品和便利品。所谓名义价格，就是报酬劳动的一定数量的货币。
- id: three_components_price
  label: 商品价格的三组成部分：工资、利润和地租
  source: 国富论（第一篇第六章）
  summary: 一切商品价格归根结底分解为三个部分：劳动工资、资本利润和土地地租。这三者是一切收入和一切可交换价值的三个根本源泉。
  quote: 工资、利润和地租，是一切收入和一切可交换价值的三个根本源泉。
- id: capital_profit
  label: 资本利润与工资的区分
  source: 国富论（第一篇第六章）
  summary: 资本的利润并非监督指挥劳动的工资，二者受完全不同原则的支配。利润与资本大小成比例，而非与劳动的数量、强度与技巧成比例。
  quote: 在商品价格中，资本利润成为一个组成部分，它和劳动工资绝不相同，而且受完全不相同原则的支配。
- id: natural_price
  label: 自然价格（中心价格）
  source: 国富论（第一篇第七章）
  summary: 商品价格如恰等于按自然率支付的地租、工资和利润，即为自然价格。自然价格是中心价格，一切商品价格不断受其吸引。
  quote: 一种商品价格，如果不多不少恰恰等于生产、制造这商品乃至运送这商品到市场所使用的按自然率支付的地租、工资和利润，这商品就可以说是按它的自然价格的价格出售的。
- id: market_price
  label: 市场价格与实际供售量的关系
  source: 国富论（第一篇第七章）
  summary: 商品通常出卖的实际价格叫市场价格，受供售量与有效需求的比例支配。供不应求则市价高于自然价格，供过于求则低于自然价格。
  quote: 商品通常出卖的实际价格，叫做它的市场价格。商品的市场价格，有时高于它的自然价格，有时低于它的自然价格，有时和它的自然价格完全相同。
- id: effectual_demand
  label: 有效需求
  source: 国富论（第一篇第七章）
  summary: 有效需求指愿支付商品自然价格的人的需要，区别于绝对需求。只有有效需求才能使商品的出售得以实现，并支配商品的实际供售量。
  quote: 愿支付商品的自然价格的人，可称为有效需求者，而他们的需求，可称为有效需求。
- id: wages_of_labor
  label: 劳动工资：劳资双方的契约结果
  source: 国富论（第一篇第八章）
  summary: 劳动者的普通工资取决于劳资双方订立的契约，双方利害关系绝不一致。劳动者盼望多得，雇主盼望少给。但在争议中雇主常居于有利地位。
  quote: 劳动者的普通工资，到处都取决于劳资两方所订的契约。这两方的利害关系绝不一致。劳动者盼望多得，雇主盼望少给。劳动者都想为提高工资而结合，雇主却想为减低工资而联合。
- id: rent_of_land
  label: 地租：土地私有后的不劳而获
  source: 国富论（第一篇第六章/第十一章）
  summary: 土地一旦成为私有财产，地主便要求对土地的自然生产物也收取地租。劳动者须将所生产或采集产物的一部分交给地主，构成土地的地租。
  quote: 一国土地，一旦完全成为私有财产，有土地的地主，象一切其他人一样，都想不劳而获，甚至对土地的自然生产物，也要求地租。
- id: capital_accumulation
  label: 资本积累：节俭与奢侈
  source: 国富论（第二篇第三章）
  summary: 资本增加由于节俭，资本减少由于奢侈与妄为。资本与收入的比例支配勤劳与游惰的比例。节俭是社会的恩人，奢侈是公众的敌人。
  quote: 资本增加，由于节俭；资本减少，由于奢侈与妄为。一个人节省了多少收入，就增加了多少资本。
- id: productive_unproductive_labor
  label: 生产性劳动与非生产性劳动
  source: 国富论（第二篇第三章）
  summary: 生产性劳动能增加物的价值（如制造业工人），非生产性劳动不能（如家仆）。君主、官吏、军队等亦属非生产性劳动者，其维持费来自他人劳动产物。
  quote: 有一种劳动，加在物上，能增加物的价值；另一种劳动，却不能够。前者因可生产价值，可称为生产性劳动，后者可称为非生产性劳动。
- id: political_economy_goal
  label: 政治经济学的目标：富国裕民
  source: 国富论（第四篇序论）
  summary: 政治经济学作为政治家或立法家的科学，有两个目标：给人民提供充足的收入或生计，给国家或社会提供充分的收入使公务得以进行。其目的在于富国裕民。
  quote: >-
    被看作政治家或立法家的一门科学的政治经济学，提出两个不同的目标：第一，给人民提供充足的收入或生计，或者更确切地说，使人民能给自己提供这样的收入或生计；第二，给国家或社会提供充分的收入，使公务得以进行。总之，其目的在于富国裕民。
- id: mercantilism
  label: 重商主义：以贸易差额求富国
  source: 国富论（第四篇第一章）
  summary: 重商主义认为金银即财富，主张奖励输出、限制输入以保持有利的贸易差额，是近世最被理解的学说。斯密对此体系进行了系统批判。
  quote: 不同时代不同国民的不同富裕程度，曾产生两种不同的关于富国裕民的政治经济学体系。其一，可称为重商主义；其二，可称为重农主义。
- id: mercantilism_critique
  label: 对重商主义的批判：独占妨害产业
  source: 国富论（第四篇第七章）
  summary: 殖民地贸易的独占，以及重商主义的各种卑劣有害方策，实际上阻抑了包括本国在内的各国产业，牺牲大众利益以促进一小阶级的利益。
  quote: 殖民地贸易的独占，象重商主义其他卑劣有害的方策一样，阻抑其他一切国家的产业，但主要是殖民地的产业，不但没有一点增加，反而减少那为着本国利益而设立的产业。
- id: physiocracy
  label: 重农主义：土地是财富的唯一来源
  source: 国富论（第四篇第九章）
  summary: 重农主义把土地生产物看作各国收入及财富的唯一来源，将社会分为土地所有者、生产阶级（耕作者）和不生产阶级（工匠、商人）。但此学说从未被任何国家采用。
  quote: 把土地生产物看作各国收入及财富的唯一来源或主要来源的学说，从来未被任何国家所采用；现在它只在法国少数博学多能的学者的理论中存在着。
- id: invisible_hand
  label: 看不见的手：自利引导公共利益
  source: 国富论（第四篇第二章）
  summary: 个人只盘算自身利益，但受一只看不见的手的指导，达到并非其本意的目的，往往比真正出于本意更能有效地促进社会利益。
  quote: 在这场合，象在其他许多场合一样，他受着一只看不见的手的指导，去尽力达到一个并非他本意想要达到的目的。
- id: natural_liberty
  label: 自然自由：个人判断优于政治家指导
  source: 国富论（第四篇第二章）
  summary: 每一个人处在他当地的地位，关于资本应投在何种产业能使生产物有最大价值，显然比政治家或立法家判断得更好。
  quote: 关于可以把资本用在什么种类的国内产业上面，其生产物能有最大价值这一问题，每一个人处在他当地的地位，显然能判断得比政洽家或立法家好得多。
- id: sovereign_duties
  label: 君主的义务：国防、司法与公共工程
  source: 国富论（第五篇第一章）
  summary: 君主的三项义务：保护社会不受其他独立社会的侵略（国防费）；保护社会成员不受他人欺侮压迫（司法费）；建立并维持公共工程和公共机关。
  quote: 君主的义务，首在保护本国社会的安全，使之不受其他独立社会的暴行与侵略。而此种义务的完成，又只有借助于兵力。
- id: taxation_principles
  label: 赋税四大原则：平等、确定、便利、经济
  source: 国富论（第五篇第二章）
  summary: 赋税四原则：一国国民按各自能力比例纳税（平等）；纳税额、日期和方法应确定（确定）；应于最便利纳税者的时间征收（便利）；征收费用应尽可能少（经济）。
  quote: 一国国民，都须在可能范围内，按照各自能力的比例，即按照各自在国家保护下享得的收入的比例，缴纳国赋，维持政府。
- id: public_debt
  label: 公债论：政府举债与财富的影响
  source: 国富论（第五篇第三章）
  summary: 近代各国政府以收入的一部分作为担保来举债，这种债务对社会土地和劳动的年产物产生了深刻影响。
  quote: 什么使几乎所有近代各国政府都把收入的一部分，作为担保来举债，而这种债务，对于真实财富，换言之，对于社会的土地和劳动的年产物，有什么影响。

source: 丑陋的中国人 (柏杨) — 酱缸文化分析体系
description: 'All citations from: 《丑陋的中国人》柏杨 著 1984年爱荷华大学讲辞 / 1981年纽约孔子大厦讲辞 / 1981年斯坦福大学讲辞'
core_concepts:
- id: pickle_jar_culture
  label: 酱缸文化 (Pickle Jar Culture)
  source: 《中国人与酱缸》1981年纽约孔子大厦讲辞
  summary: >-
    柏杨的核心概念。任何一个民族的文化都像长江大河，但时间久了，污秽肮脏的东西沉淀，使水不能流动，变成一潭死水，愈沉愈多，愈久愈腐，就成了一个酱缸，一个污泥坑，发酸发臭。中国文化被封建政体和儒家学派群策群力，连推带打，活生生地塞到酱缸里。外来的东西一到中国就变质。酱缸文化使中国人丧失了消化吸收的能力。
  quote: >-
    任何一个民族的文化，都像长江大河，滔滔不绝地流下去，但因为时间久了，长江大河里的许多污秽肮脏的东西，像死鱼、死猫、死耗子，开始沉淀，使这个水不能流动，变成一潭死水，愈沉愈多，愈久愈腐，就成了一个酱缸，一个污泥坑，发酸发臭。
- id: internal_strife
  label: 窝里斗 (Internal Strife)
  source: 《丑陋的中国人》1984年爱荷华大学讲辞
  summary: >-
    柏杨认为中国人最拿手的是内斗。有中国人的地方就有内斗。中国人永远不团结，似乎缺少团结的细胞。每个中国人都是一条龙，但三个中国人加在一起就成了一条虫。中国人不但不团结，反而有不团结的充分理由。三个中国人有三个意见，决定之后是三个方向。凡是整中国人最厉害的不是外国人，而是中国人自己。
  quote: >-
    每一个中国人都是一条龙，中国入讲起话来头头是道。上可以把太阳一口气吹灭，下可以治国平天下。中国人在单独一个位置上。譬如在研究室里，在考场上，在不需要有人际关系的情况下，他可以有了不起的发展。但是三个中国人加在一起，三巨条龙加在一起。就成了一条猪、一条虫，甚至连虱都不如。因为中国人最拿手的是内斗。有中国人的地方就有内斗，中国人永远不团结，似乎中国人身上缺少团结的细胞，
- id: never_admit_fault
  label: 死不认错 (Never Admit Fault)
  source: 《丑陋的中国人》1984年爱荷华大学讲辞
  summary: >-
    中国人不习惯认错，反而有一万个理由掩盖自己的错误。丧失了认错的能力。为了掩饰一个错，中国人不得不制造更多的错，来证明第一个错并不是错。因此中国人喜欢讲大话、空话、假话、谎话、毒话。这种行为使中国人的心灵完全封闭，不能开阔。
  quote: >-
    中国人不习惯认错，反而有一万个理由。掩盖自己的错误。……不能够认错是因为中国人丧失了认错的能力。我们虽然不认错，错还是存在，并不是不认错就没有错。为了掩饰一个错，中国人就不得不用很大的力气，再制造更多的错，来证明第一个错并不是错。所以说，中国人喜欢讲大话。喜欢讲空话，喜欢讲假话，喜欢讲谎话，更喜欢讲毒话。
- id: dirty_messy_loud
  label: 脏、乱、吵 (Dirty, Messy, Loud)
  source: 《丑陋的中国人》1984年爱荷华大学讲辞
  summary: >-
    柏杨认为中国人最明显的特征之一是脏、乱、吵。厨房脏乱，家庭脏乱。中国人嗓门之大天下无双，因为没有安全感，觉得声音大就是理大。这三点足使中国人的形象受到破坏，使内心不能平安。
  quote: 最明显的特徵之一就是脏、乱、吵。台北曾经一度反脏乱。结果反了几天也不再反了。我们的厨房脏乱。我们的家庭脏乱。有很多地方，中国人一去，别人就搬走了。
- id: lack_of_tolerance
  label: 缺少包容性 (Lack of Tolerance)
  source: 《丑陋的中国人》1984年爱荷华大学讲辞
  summary: >-
    中国人缺少海洋般的包容性。狭窄的心胸造成两个极端，绝对的自卑和绝对的自傲，却没有自尊。自卑时成了奴才，自傲时成了主人。变成人格分裂的奇异动物。中国人很难有平等观念——你如果不是我的主人，我便是你的主人。
  quote: >-
    没有包容性的性格，如此这般狭窄的心胸，造成中国人两个极端，不够平衡。一方面是绝对的自卑，一方面是绝对的自傲。自卑的时候，成了奴才；自傲的时候，成了主人！独独的，没有自尊。……变成了一种人格分裂的奇异动物。
- id: officialdom_culture
  label: 官场文化 (Officialdom Culture)
  source: 《人生文学与历史》1981年斯坦福大学讲辞
  summary: >-
    中国官场是一个看不见摸不着的蛛网。官僚效忠的对象不是国家也不是领袖，而只是给他官做的人。王朝政府可变，官场不变。官场有特殊的行为标准和价值观念。一个人官性太兴旺的时候，人性就消灭了。科举制度是造成官场的根源——日本吸收了中国全部文化却独独没有吸收科举。
  quote: >-
    中国"官僚"这个字，不能用Bureaucrats来翻译。中国官僚有他的特征，效忠的对象绝对不是国家，也绝对不是领袖，他只效忠于给他官做的人。王朝政府可变，官场不变。
- id: buy_watermelon_learning
  label: 买西瓜学与难得糊涂学 (Watermelon Buying & Feigned Foolishness)
  source: 《买西瓜学》《难得糊涂学》
  summary: >-
    柏杨通过寓言揭示了官场中听话比能干更重要的荒谬逻辑。'买西瓜学'教人无条件执行错误命令以显示忠诚；'难得糊涂学'教人有聪明而装糊涂。两者都是升官固位的绝技，也是反淘汰的酱缸文化的表现。郑板桥说：'聪明难，糊涂难，由聪明而糊涂更难。'
  quote: 他能干固然能干，但他有脑筋，能判断，而有脑筋能判断，就是一种危险。想到这里，打了一个冷颤。好啦，不用多久，就有一个人抓住你的小辫子一摔，你就尊嘴啃地。
- id: admire_foreign_not_slave
  label: 崇洋但不媚外 (Admire Abroad, Not Fawn)
  source: 《崇洋，但不媚外》
  summary: >-
    柏杨区分'崇洋'与'媚外'：崇洋是学习别人的优点，媚外是丧失自尊。中国人日常生活中从汽车到电灯到电话全都是崇洋的产物，但并不等于媚外。面对彬彬有礼的洋大人，不自惭形秽反而横眉竖目，才是真正的'不忘本'误区。日本明治维新就是靠崇洋崛起的。
  quote: >-
    "崇洋"与"媚外"相距十万八千里，风马牛互不相及，经过如此这般的硬生生粘在一起，动不动就掏将出来"猛批"，灾难遂无远弗届。不过受伤害的并不是被詈为"崇洋媚外"之辈，而是因怕"媚外"而不敢"崇洋"的人民。柏老的意思不是说根本没有人崇洋媚外，这种动物可多得要几箩筐有几箩筐。而只是说，更多的朋友，却是"崇洋"而并不"媚外"。
- id: fear_and_reverence
  label: 起敬起畏的哲学 (Philosophy of Fear and Reverence)
  source: 《起敬起畏的哲学》
  summary: >-
    以权势崇拜为基石的五千年传统文化，使人与人之间只有'起敬起畏'的感情，而很少'爱'的感情。'仁'只是书上的概念，行为上极其稀薄。廷杖制度和君父观念的结合使中国人的自尊几乎泯灭，人格几乎摧残殆尽。这种哲学使皇帝和臣民之间的距离一天一天拉大。
  quote: >-
    以权势崇拜为基石的五千年传统文化，使人与人之间，只有"起敬起畏"的感情，而很少"爱"的感情。写到这里，准有人号曰："我们有'仁'呀！"提到"仁"，话就得分两方面说，一方面是，有"仁"固然有"仁"，但也只是书上有"仁"，行为上"仁"的成分实在稀薄
- id: neurotic_fear
  label: 神经质的恐惧 (Neurotic Fear)
  source: 《丑陋的中国人》1984年爱荷华大学讲辞
  summary: >-
    中国人遇事总说'算了，算了'四个字，不知害死了多少中国人。不晓得什么是自己的权利，也不晓得保护自己的权利。这种神经质的恐惧是培养暴君暴官最好的温床。中国传统文化一再强调明哲保身，暴君暴官最喜欢人民明哲保身。
  quote: >-
    每个人都恐惧的不得了。不晓得什么是自己的权利，也不晓得保护自己的权利，每遇到一件事情发生，总是一句话：'算了，算了。'……这种神经质的恐惧，是培养暴君、暴官最好的温床，所以中国的暴君、暴官，永远不会绝迹。
- id: i_am_exception
  label: 只我例外 (I Am The Exception)
  source: 《只我例外》
  summary: >-
    民主政治的精义是'我不例外'——大家都不准闯红灯，我自己也不闯。但这到了中国就成了'只我例外'——我反对别人闯红灯，自己却可以闯。面子是神经衰弱和牢不可破自私的产物，处处都要'只我例外'。
  quote: >-
    民主政治的精义是"我不例外"，大家都不准闯红灯，我自己也不闯。大家都不准随地吐痰，我自己就不吐一口。人人赞成法制，我就不要求特权。既然建立了制度，我就不破坏它。可是这玩意一到了中国，就成了"只我例外"，我反对闯红灯，只是反对别人闯，我自己却可以闯那么一闯。
- id: lack_of_spirit
  label: 缺少敢讲敢想的灵性 (Lack of Intellectual Spirit)
  source: 《缺少敢讲敢想的灵性》
  summary: >-
    柏杨认为中国文化被儒家控制后，知识分子的想像力和思考力被扼杀僵化。东汉的'师承'制度使人不能超出老师告诉他的范围。中国传统文化中什么都有，独缺灵性。几千年来，所有读书人都在注解孔丘的学说，没有自己独立的意见。
  quote: >-
    中国文化在春秋战国时代，是最灿烂的时代。但是从那个时代之後，中国文化就被儒家所控制。到了东汉，政府有个规定，每一个知识分子的发言、辩论、写文章，都不能超出他老师告诉他的范围，这叫做「师承」。如果超出师承，不但学说不能成立，而且还违犯法条。这样下来之後，把中国知识分子的想像力和思考力，全都扼杀、僵化。
- id: no_right_wrong_only_success
  label: 不讲是非，只讲'正路' (No Right/Wrong, Only Success)
  source: 《不讲是非，只讲'正路'》
  summary: >-
    势利眼主义最大的特征是不讲是非，而只以势利为是非。在酱缸文化中，只有富贵功名才是'正路'。中国人对英雄的内心评价是'不肯正干''不走正路'。六君子殉难在势利眼看来最可惜的是'富贵功名化为乌有'。
  quote: 在酱缸文化中，只有富贵功名才是"正路"，凡是不能猎取富贵功名的行为，全是"不肯正干"，全是"不走正路"。
- id: loose_sand
  label: 一盘散沙 (Loose Sand / Lack of Unity)
  source: 《一盘散沙》
  summary: >-
    孙中山先生感叹中国人是一盘散沙。用中国的一个沙粒跟洋大人的一个沙粒较量，不弱于洋大人，但用一堆沙粒跟洋大人一堆沙粒做成的水泥较量，水泥坚硬如铁。中国人聪明但严重缺乏合作精神。
  quote: >-
    中国人是聪明的，但这聪明却有一个严重的大前提，那就是必须"一对一"，在个别的较量中，一个中国人对一个洋大人，中国人是聪明的，好比说吴清源先生和林海峰，单枪独马，就杀得七进七出。可是一旦进入群体的较量，两个中国人对两个洋大人，或两个以上的中国人对两个以上的洋大人，中国人就吃不住兼顶不过。
- id: spring_autumn_blame_virtuous
  label: 《春秋》责备贤者 (Blame the Virtuous)
  source: 《〈春秋〉责备贤者》
  summary: >-
    柏杨批评儒家'责备贤者'的传统——对恶棍连咳嗽都不敢，对贤者却挑剔个没完。这种'责人无已时'的绝症逼得人们感觉做好人比当恶棍困难得多。中国社会赞扬的话总是等人死了才说，对活人的赞扬几乎绝迹。
  quote: >-
    对恶棍连咳嗽一声都不敢（往自己脸上贴金的懦夫不好意思说"不敢"，只好说"不屑"），对"贤者"却挑剔个没完。人是一种会犯错的动物，也是一种会做出不可告人之事的动物，努力挑剔的结果，每一个人都成了虎豹豺狼。于是乎，存心坏蛋到底的朋友有福啦，永没有人责备他，不但没有人责备他，遇到"德之贼也"，还原谅他，猛劝责备他的人适可而止哩。而力争上游的朋友，反而永远受不完的抨击。这种"责人无已时"的毒牙，只有一个后果：逼得人们感觉到，做好人要比当恶棍困难得多。
- id: false_arrogance
  label: 虚骄之气 (False Arrogance)
  source: 《虚骄之气》
  summary: >-
    中国人往往以五千年文化自傲，却看不到自己的落后。虚骄之气最大的坏处是给自己打一堵墙，把自己孤立在水桶里。虚骄只是晕晕乎乎的自满——自我陶醉，自我意淫。使我们产生一种错觉，认为我们绝不会亡。
  quote: 虚骄之气最大的坏处是自己给自己打堵墙，把自己孤立在水桶里。
- id: dinosaur_personality
  label: 恐龙型人物 (Dinosaur Personalities)
  source: 《恐龙型人物》
  summary: >-
    中国人是天下最容易膨胀的民族，器小易盈。一个人只要有一点成就就自我膨胀——开飞机就觉得可以直起直落，开汽车就觉得可以不用方向盘。沾沾自喜和浮夸肤浅使不能再吸收任何新的东西。
  quote: 中国人是天下最容易膨胀的民族，为什麽容易膨胀？因为中国人「器小易盈」，见识太少，心胸太窄，稍微有一点气候，就认为天地虽大，已装他不下。
- id: lack_of_civility
  label: 礼义之邦名实不符 (Discrepancy Between Claim and Reality)
  source: 《到底是什么邦》《三句话》《不会笑的动物》
  summary: >-
    仅看纸上作业，中国是礼义之邦。但在行为上却退到蛮荒。中国人丧失了说'对不起'和'谢谢你'的能力。不会笑。排队秩序显示文明程度——中国人的排队上车争先恐后，一盘散沙。中国社会在行为层面是蛮荒之邦。
  quote: 仅看纸上作业，中国是礼义之邦。但在行为上，我们却倒退到蛮荒。如果不能实践礼义，再写三千万本书，再写三千万篇文章，蛮荒仍是蛮荒。
- id: inform_and_harm
  label: 中国人整中国人 (Chinese Preying on Chinese)
  source: 《丑陋的中国人》1984年爱荷华大学讲辞
  summary: >-
    凡是整中国人最厉害的不是外国人，而是中国人。凡是出卖中国人的也不是外国人，而是中国人。在马来西亚有人告发老朋友，在美国有中国人告发非法移民，在职场中国上司先开除中国下属。
  quote: 凡是整中国人最厉害的人不是外国人，而是中国人。凡是出卖中国人的：也不是外国人，而是中国人。凡是陷害中国人的，不是外国人，而是中国人。
- id: way_out_connoisseur
  label: '出路：成为鉴赏家 (The Way Out: Become Connoisseurs)'
  source: 《丑陋的中国人》1984年爱荷华大学讲辞 结尾
  summary: >-
    柏杨认为中国人要改变丑陋形象，每个人都要把自己培养成鉴赏家——能辨别好坏真伪。有鉴赏能力的社会才能提高人们分辨是非的能力。最终要活得有尊严，以诚实做基础，远离'谎言文化'。
  quote: 如果我们每一个人都成为一个好的鉴赏家，我们就能鉴赏自己，鉴赏朋友，鉴赏国家领导人物。这是中国人目前应该走的一条路，也是唯一的一条路。

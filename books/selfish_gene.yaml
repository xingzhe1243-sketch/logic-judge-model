source: 自私的基因（The Selfish Gene）—— 引擎模块
description: 作者：理查德·道金斯 (Richard Dawkins) 版本：40周年增订版 集成：规则解剖模型 - 书籍分析引擎
core_concepts:
- id: gene_centered_view
  definition: 自然选择的基本单位是基因，而不是物种、群体或个体。基因为了自身复制而建造生存机器（个体）。
  quote: 成功基因的一个突出特性就是其无情的自私性。这种基因的自私性通常会导致个体行为的自私性。（第1章）
  chapter: 1
- id: selfish_gene
  definition: 基因的行为表现如同追求自身最大化复制，这是一种比喻性的'自私'。
  quote: 基因为了更有效地达到其自私的目的，在某些特殊情况下，也会滋长一种有限的利他主义。（第1章）
  chapter: 1
- id: survival_machine
  definition: 一切生物都是基因建造的生存机器，包括动物、植物、细菌和病毒。我们都是同一种复制因子DNA的生存机器。
  quote: 我们是生存机器，但这里的"我们"并不单指人，它包括一切动物、植物、细菌和病毒。
  chapter: 3
- id: replicator
  definition: 能够自我复制的分子，是自然选择的基本实体。现代复制因子是DNA分子。
  quote: 能够生存下来的复制因子都是那些为自己构造了生存机器以安居其中的复制因子。
  chapter: 2
- id: kin_selection
  definition: 通过帮助有亲缘关系的亲属来增加自身基因在基因库中频率的选择机制。
  quote: >-
    同胞兄弟姐妹、父母和子女十分特殊（½），同卵孪生兄弟姐妹（1）就和自己完全一样。叔（伯）父和叔（伯）母、侄子或外甥和侄女或外甥女、祖父母和孙子孙女、异父或异母兄弟和异父或异母姐妹的亲缘关系是¼。
  chapter: 6
- id: hamilton_rule
  definition: 利他行为进化的条件：利他者的成本C < 受益者的收益B × 亲缘度系数r。
  quote: 如果一个利他性的基因能够在种群中扩散开来，那么必然满足以下条件，即利他者的成本C要小于受益者获得的价值B与两者之间的亲缘度系数r之积。（40周年增订版序言）
- id: evolutionarily_stable_strategy
  definition: 种群中大部分成员采用的策略，任何偏离该策略的个体都不可能获得更高收益。
  quote: 凡是种群的大部分成员采用某种策略，而这种策略的好处是其他策略所不及的，这种策略就是进化稳定策略或称ESS。（第5章）
  chapter: 5
- id: meme
  definition: 文化复制因子，通过模仿从一个大脑传播到另一个大脑的单位。曲调、概念、时装等都是觅母。
  quote: >-
    曲调、概念、妙句、时装、制锅或建造拱廊的方式等都是觅母。正如基因通过精子或卵子从一个个体转移到另一个个体，从而在基因库中进行繁殖一样，觅母通过广义上可以称为模仿的过程从一个大脑转移到另一个大脑，从而在觅母库中进行繁殖。
  chapter: 11
- id: reciprocal_altruism
  definition: 个体之间相互帮助、延迟回报的利他行为，需要个体能够相互识别和记忆。
  quote: 延迟的相互利他行为在其个体能够相互识别并记忆的物种中是可以进化的。（第10章，引用威廉斯）
  chapter: 10
- id: tit_for_tat
  definition: 阿克塞尔罗德计算机竞赛中获胜的策略：第一回合合作，之后复制对手上一步的行动。
  quote: 赢家策略的两个特点：善良与宽容。这几乎是一个乌托邦式的结论：善良与宽容能得到好报。（第12章）
  chapter: 12
- id: extended_phenotype
  definition: 基因的表型影响不限于其所在的身体，而是延伸到身体之外的世界，包括工具、建筑和对其他生物的控制。
  quote: 在传统的定义里，基因的表型可见诸其对身体的作用，但我们将看到，基因的表型需要从其对整个世界的作用这一角度去思考。
  chapter: 13
- id: parental_investment
  definition: 亲代对子代个体进行的任何形式的投资，增加了该个体生存的机会，但以牺牲对其他个体的投资能力为代价。
  quote: 亲代投资的定义是："亲代对子代个体进行的任何形式的投资，从而增加了该个体生存的机会（因而得以成功繁殖），但以牺牲亲代对子代其他个体进行投资的能力为代价。"
  chapter: 8
- id: parent_offspring_conflict
  definition: 由于亲代与子代之间的遗传利益不一致（子代更重视自身，亲代要求平均分配）而产生的冲突。
  quote: >-
    从遗传学的角度上看，他和他母亲都希望为他兄弟姐妹的利益出力，但他与自己的关系比与兄弟姐妹中任何一个的关系密切两倍，因此他会希望母亲在他身上的投资多一些。（第8章）
  chapter: 8
- id: sexual_conflict
  definition: 由于配子大小的根本不对称（精子小且多，卵子大且少），雌雄两性在繁殖策略上存在根本利益冲突。
  quote: 雌性个体受剥削，而这种剥削行为在进化上的主要基础是卵子比精子大。（第9章）
  chapter: 9
- id: meiotic_drive
  definition: 基因在减数分裂中操纵分配过程，使自己更多地进入配子，偏离正常的50%-50%分配。
  quote: 如果存在一个基因，它并不作用于那些类似于眼睛颜色或头发之类明显的形状，而作用于减数分裂本身...这种基因确实存在，名为分离变相因子。（第13章）
  chapter: 13
- id: life_dinner_principle
  definition: 在进化军备竞赛中，失败的代价不对等。捕食者失败只是损失一顿晚餐，被捕食者失败则损失生命。
  quote: 兔子跑得比狐狸快，因为狐狸奔跑是为了晚餐，而兔子奔跑是为了活命。（第13章）
  chapter: 13
- id: prisoners_dilemma
  definition: 一种博弈模型，个体理性导致集体非理性，双方背叛的结果劣于双方合作的结果。
  quote: 无论你选择哪张牌，我最好的选择是永远背叛。
  chapter: 12
- id: carrier_vs_replicator
  definition: 复制因子是自然选择的基础单位（基因），载体是传播复制因子的工具（身体）。两者分饰不同角色。
  quote: 基因与个体生物在达尔文主义的戏剧里并不主演着对手戏，它们分别以复制因子与载体的角色饰演着不同角色，互相补充，同等重要。（第13章）
  chapter: 13

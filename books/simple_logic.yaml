source: 简单的逻辑学 (D.Q. McInerny)
description: 逻辑学基础——逻辑基本定律、思维准备、非逻辑思维根源
basic_mental_preparation:
- '专注: 注意力是逻辑思考的起点'
- '事实与观点: 区分客观事实和主观判断'
- '观念与对象一致: 我们的观念要与事实对象相符'
- '避免术语不清: 使用准确的术语表达'
- '避免闪避式语言: 用模糊语言回避真实想法'
logic_basics:
- '命题: 逻辑的基本单位，是''真''或''假''的陈敝'
- '三段论: 从两个前提推出结论'
- '演绎论证: 从一般到特殊，保真推理'
- '归纳论证: 从特殊到一般，概率推理'
- '类比论证: 从相似性推导，最弱的论证形式'
non_logical_roots:
- '怀疑论: 彻底否认一切真理的可能性'
- '玩世不恭: 否定别人论证的真实性'
- '先验观念: 拒绝任何相反证据'
- '情绪干扰: 用情绪替代逻辑分析'
- '推理与论证混淆: 推理=得出结论的过程; 论证=用理由说服他人'
- '避免用''暗示''做论证: 暗示不是明确的逻辑关系'
argument_types:
  演绎: '从一般到特殊: 凡人皆死，苏格拉底是人，所以苏格拉底必死'
  归纳: '从特殊到一般: 观察100只天鹅都是白色，所以天鹅是白色的'
  类比: '从相似到相似: A和B有共同特征C，A有特征D，所以B也有D(最弱)'
fallacies_extended:
  前提谬误: 前提本身不真实或不可靠
  推理谬误: 前提正确但推理形式无效
  否定前件: 如果p则q, 非p, 所以非q(无效)
  肯定后件: 如果p则q, q, 所以p(无效)

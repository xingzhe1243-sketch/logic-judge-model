source: 终身成长：重新定义成功的思维模式
description: 'Mindset: The New Psychology of Success — Carol S. Dweck'
core_concepts:
- id: fixed_vs_growth
  label: 固定型思维 vs 成长型思维
  source: 第1章 思维模式
  summary: >-
    固定型思维认为人的能力是固定不变的，需要不断证明自己；成长型思维认为能力可以通过学习和发展来改变，关注成长而非证明。这两种思维模式塑造了人们对挑战、努力、批评和他人成功的截然不同的反应。
  quote: >-
    但是，世界上还存在另一种思维模式。在这种思维模式中，这些品质不是你非要打且不得不打的牌，你不需要总在担心自己手里只有对十的时候去说服大家和自己，你手里的是一副同花顺。在这种思维模式影响下，你需要打的牌不过是你成长的起始点。这种成长型思维模式建立在这样一种理念上：你的基本能力是可以通过你的努力来培养的。即使人们在先天的才能和资质、兴趣或者性情方面有着各种各样的不同，每个人都可以通过努力和个人经历来改变和成长。
- id: two_mindsets_contrast
  label: 两种思维模式的对比
  source: 第1章 思维模式
  summary: >-
    固定型思维者：逃避挑战、轻易放弃、视努力为无意义、忽视批评、被他人的成功威胁。成长型思维者：拥抱挑战、在挫折中坚持、视努力为成长途径、从批评中学习、从他人成功中汲取灵感。
  quote: >-
    进入一种思维模式，就如同进入一个新世界。在其中一个个人能力固定的世界里，成功需要你证明自己的聪明和天赋，证明你自己的价值；而在另一个能力可以改变的世界里，则需要你提高自己，去学习新知识，发展自己的才能。
- id: mindset_origins
  label: 思维模式的起源
  source: 第1章 思维模式
  summary: 思维模式的形成源于童年时期接收到的评价信息。对孩子智力或天分的夸奖会塑造固定型思维；对孩子努力和策略的赞赏则会促进成长型思维的形成。
  quote: >-
    事实上，人们说的每一句话、做的每一个行动都会传递出一条信息。这些信息告诉孩子们——或者学生们、运动员们——如何看待自己。这条信息可能是固定型思维模式的：你的能力永远不会变，而我正在对你的能力进行评判。也可能是成长型思维模式的：你是一个不断成长的人，我对你的成长很感兴趣。
- id: challenges_and_effort
  label: 挑战与努力
  source: 第2章 思维模式解析
  summary: >-
    固定型思维者害怕挑战，因为失败会否定他们的价值；成长型思维者拥抱挑战，将其视为成长的机会。固定型思维者认为努力是能力不足的表现，而成长型思维者认为努力是成长的必经之路。
  quote: >-
    在前一个世界里，努力是一件坏事。努力，和失败一样，意味着你不够聪明，不够有天赋。如果你足够聪明，根本就不需要努力。而在后一个世界里，努力可以让你变得更聪明，更有才能。
- id: criticism_and_feedback
  label: 批评与反馈
  source: 第2章 思维模式解析
  summary: 固定型思维者对批评敏感，将其视为对自身价值的否定；成长型思维者则能从批评中汲取有用信息来改进自己。
  quote: >-
    固定型思维模式者只会对反映其能力高低的反馈展现出兴趣。他们的脑波显示，他们在被告知自己的答案是对是错的时候注意力非常集中，但他们在得到可以帮助他们学习的信息时没有展现出一丝兴趣。即使他们自己的答案错了，对正确答案也毫不关心。只有具备成长型思维模式的人才高度关注可以提高他们知识水平的信息。对他们来说，学习才是第一要务。
- id: success_of_others
  label: 对他人的成功态度
  source: 第2章 思维模式解析
  summary: 固定型思维者被他人的成功威胁，因为这意味着自己被超越；成长型思维者从他人成功中获得启发和借鉴。
  quote: >-
    一群大学生在一次糟糕的考试后，获得了一个去看其他人试卷的机会。成长型思维模式者选择去看那些考得比他们好很多的人的卷子。和往常一样，他们希望改正自己的不足。但是具有固定型思维模式的学生选择去看那些考得非常差的，这就是他们让自己感觉好起来的方法。
- id: academic_achievement
  label: 学业成就与思维模式
  source: 第3章 关于能力和成就的真相
  summary: 成长型思维的学生成绩显著优于固定型思维的学生，尤其在面对挑战和困难时。成长型思维的干预能够提振原本表现不佳的学生的成绩。
  quote: >-
    确实不是这样的。在我们的研究里，只有具有固定型思维模式的学生会出现成绩下滑的情况。他们的成绩出现了突然的下降，并在接下来的两年里越来越差。而具有成长型思维模式的学生们在后来的两年里成绩逐步提高。
- id: sports_mindset
  label: 体育中的思维模式
  source: 第4章 体育：冠军的思维模式
  summary: 迈克尔·乔丹等顶级运动员的成功源于成长型思维。固定型思维者相信天赋决定一切，而成型思维者相信训练和努力可以突破天赋限制。
  quote: >-
    大家都知道，迈克尔·乔丹在高中时被校队淘汰了，现在我们会嘲笑当年踢他出校队的教练。他没有进入他想要效力的北卡罗来纳州立大学。这些人是不是太蠢了？最初可以选择他的两家 NBA 球队也没有签下他。多么愚蠢的错误！那是因为现在我们知道他是有史以来最棒的篮球运动员，于是认为在当初这一点应该也是显而易见的。现在，我们看着他的时候，看到的是了不起的篮球巨星迈克尔·乔丹，但在当初，他只是普通的小球员迈克尔·乔丹。
- id: business_leadership
  label: 商业思维与领导力
  source: 第5章 商业：思维模式和领导力
  summary: 固定型思维的领导者（如艾柯卡）关注个人权威和完美形象，压制异议；成长型思维的领导者（如韦尔奇）鼓励员工发展、重视团队协作和诚实反馈。
  quote: >-
    沃伦·本尼斯（Warren Bennis）说过，有太多领导者带着公司做这做那，最终却走进了死胡同，但这些成长型思维模式的领导者不是这样的。他们不谈特权，而专注于带领公司奋斗的历程。这是一场包罗万象、充满欢乐的学习历程。
- id: relationship_mindset
  label: 人际关系中的思维模式
  source: 第6章 人际关系：关于相处的思维模式
  summary: 固定型思维者认为关系应该是完美无缺的，出现问题意味着关系或自己有根本缺陷；成长型思维者认为关系需要经营和努力，问题和冲突是改善的机会。
  quote: >-
    但固定型思维模式者不相信这点。你还记不记得固定型思维模式者认为，如果你有能力，就不需要努力？他们在恋爱关系方面也持有同样的看法：如果你们适合在一起，一切都应该会自然地得到解决。所有人际关系专家都不同意这个观点。著名的婚姻专家艾伦·贝克说过，对两性关系来说，最具毁灭性的想法之一就是：'如果我们需要努力，这说明我们的关系里存在非常严重的问题。'
- id: parenting_mindset
  label: 父母与教师的思维模式传播
  source: 第7章 父母、老师与教练：思维模式的传播
  summary: 表扬孩子的智力和天赋（你真聪明）会塑造固定型思维，让孩子回避挑战；表扬孩子的努力和策略（你的方法很有效）会塑造成长型思维，让孩子拥抱挑战。
  quote: >-
    父母们认为，通过表扬孩子的头脑和天赋——他们可以给予孩子们持久的自信心——就像送给孩子一份礼物一样，但事实上这行不通，还起到了反效果。这种做法会让孩子在遇到困难，或者任何事出现问题的时候，立即对自己产生怀疑。如果父母真想送给孩子一份礼物，最好的就是教会他们热爱挑战，从错误中吸取教训，享受努力的过程，不断学习。
- id: changing_mindset
  label: 思维模式的改变
  source: 第8章 改变思维模式
  summary: 思维模式是可以改变的。通过了解两种思维模式的存在及其影响，观察自己的固定型思维触发点，用成长型思维去回应，逐步培养成长型思维模式。
  quote: >-
    成长型思维模式是建立在相信变化的基础之上的，而我这项工作中让我最开心的就是可以看到人们发生变化。没有什么比看到人们找到正确方法去做自己真正重视的事更开心的了。这一章是关于成年人和儿童找到运用自己能力的途径的。我们大家都可以做到这一点。
- id: praise_and_labels
  label: 赞美与标签的危害
  source: 第7章 父母、老师与教练
  summary: 对孩子的天赋和智力进行表扬会让他们陷入固定型思维，导致他们回避挑战、害怕失败。正确的表扬方式是指出他们的努力、策略和进步。
  quote: >-
    我记得，人们经常称赞我聪明，而不会称赞我所付出的努力，慢慢地，我确实发现自己越来越害怕挑战。更令人吃惊的是，这种对挑战的恐惧逐步蔓延，超越了学术领域甚至体育领域，逐步蔓延到了情感领域。这成了我最严重的学习障碍——将自己的表现看作自己性格的体现，如果在某件事上，我不能在短时间内有所成就，我就会选择逃避或者表现得不屑。
- id: brain_plasticity
  label: 大脑的可塑性
  source: 第8章 改变思维模式
  summary: 科学研究表明，大脑像肌肉一样可以训练和成长。每次学习新东西时，大脑神经元之间会建立新的连接，变得更强大。这一发现为成长型思维提供了神经科学基础。
  quote: >-
    你学习新事物时，大脑里那些微小的连接就会增加，变得更强壮。你越挑战自己的思维去进行学习，你的大脑细胞就会越多。这样，以前你觉得很难甚至无法完成的事情——比如学习一门新语言或者做代数题——看上去就会变得简单。因为你的大脑变得更强、更聪明了。
- id: effort_strategy_perseverance
  label: 努力、策略与坚持不懈
  source: 常见误解澄清
  summary: 成长型思维不仅仅关乎表扬努力。关键在于：表扬有效的策略、不懈的坚持、从失败中学到的东西。只有当努力配合正确的策略和持续的坚持时，才能带来真正的成长。
  quote: >-
    有些人认为，成长型思维模式等同于告诉孩子他们可以做任何事。我很多次听到教育者说：'我总是保持成长型思维模式。我经常告诉我的学生们：你可以做任何事！'很少有人能像我一样相信孩子们拥有的潜能，但是我并不是简单地告诉孩子们'你可以做任何事'，而是帮助他们获取技能和资源，通过努力达到他们的目标。否则，'你可以做任何事'这只是一句空洞的安慰，这是将责任完全抛给学生们，让他们觉得，如果他们没有达到目标，就是个失败者。
- id: fixed_triggers
  label: 固定型思维的触发点
  source: 第8章 改变思维模式
  summary: 每个人体内都有一部分固定型思维，会在特定情境中被触发：面对挑战时、遇到批评时、看到他人成功时。识别这些触发点是改变的第一步。
  quote: >-
    尽管为简单起见，我似乎将人们说成一部分人拥有成长型思维模式，另一部分人拥有固定型思维模式，但事实上，我们都同时拥有两种思维模式。我们没必要否认这一点。有时我们处在一种思维模式中，有时我们处在另一种思维模式中。所以，我们的任务就变成了去弄明白是什么触发了我们的固定型思维模式。是什么样的事件和情景让我们认为自己（或其他人）的能力是固定的？是什么样的事件和情景让我们认为评判比发展更重要？
- id: growth_journey
  label: 通往成长型思维的旅程
  source: 第8章 改变思维模式
  summary: 改变思维模式是一个持续的过程，不是一次性的事件。接受自己的固定型思维部分，有意识地选择成长型思维，将其融入日常生活，最终形成新的思维习惯。
  quote: >-
    成长型思维模式是建立在相信变化的基础之上的，而我这项工作中让我最开心的就是可以看到人们发生变化。没有什么比看到人们找到正确方法去做自己真正重视的事更开心的了。在最后一章关于自我改变的讨论中，我会谈到这些问题。在这里，我想强调的是，这个过程是一段很长的旅程，需要我们严格遵守要求并坚持不懈地进行。

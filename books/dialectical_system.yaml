source: 世界的逻辑 (David Harvey)
description: 辩证系统分析——资本循环、剥夺性积累、空间修复、不平衡发展
dialectical_principles:
- '整体关联: 事物是相互联系的，变化会影响整体'
- '历史过程: 事物在发展过程中理解，静态分析不够'
- '内在矛盾: 矛盾是事物发展的动力而非缺陷'
- '量变到质变: 渐进积累导致结构性转变'
- '否定之否定: 发展是螺旋式上升而非线性'
capital_circulation:
  primary: '初级循环: 资本投入生产和消费领域'
  secondary: '次级循环: 资本投入建成环境(房地产/基础设施)'
  tertiary: '三级循环: 资本投入科技研发和社会支出'
spatial_fix: '空间修复: 资本通过地理扩张和空间重组缓解过度积累危机'
accumulation_by_dispossession: '剥夺性积累: 通过私有化/市场化/金融化将公共资源转化为资本积累'
uneven_development: '不平衡发展: 资本流动导致区域发展差异，中心-边缘结构'
analytical_dimensions:
- 涉及资本/经济维度 — 检查:谁拥有资源?资本循环是否顺畅?
- 涉及权力/制度维度 — 检查:谁受益?谁受损?现存安排服务于谁?
- 涉及空间/全球维度 — 可能包含不平衡发展的逻辑，检查中心和边缘关系
- 涉及自然资源维度 — 检查:是否涉及剥夺性积累?公共资源被私有化?
- 涉及技术/时空压缩维度 — 新技术是否加速了资本周转?是否改变了时空感知?
- 涉及危机/虚拟资本维度 — 金融资本是否脱离实际生产?泡沫根源何在?

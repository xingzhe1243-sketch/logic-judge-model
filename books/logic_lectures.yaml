source: 逻辑学十五讲 — 陈波《逻辑学十五讲》(北京大学出版社,2008)
description: >-
  完整知识模块：涵盖全部15讲内容 Fifteen Lectures on Logic (Chen Bo, Peking University Press, 2008) Full knowledge module
  covering all 15 lectures.
core_concepts:
- id: aristotle_syllogism
  label: 亚里士多德三段论
  source: 逻辑学十五讲·第一讲
  summary: >-
    亚里士多德在《前分析篇》中系统阐述了三段论理论，区分了三段论的格与式，讨论了必须遵守的规则。其基本形式为：所有M是P，所有S是M，所以所有S是P。三段论由三个直言命题构成，其中两个是前提，一个是结论。
  quote: >-
    在《前分析篇》中，他系统地阐述了他的推理理论，主要是以直言命题作前提和结论的三段论，以及以模态命题作前提和结论的三段论，区分了它们的格与式，讨论了它们必须遵守的规则，以此区分有效的三段论式和无效的三段论式。
- id: aristotle_ten_categories
  label: 亚里士多德十范畴
  source: 逻辑学十五讲·第一讲
  summary: 亚里士多德在《范畴篇》中提出了十范畴：实体、性质、关系、地点、时间、姿势、具有、活动、遭受。这些范畴既是对外部存在的分类，也是对命题的主谓词的分类。
  quote: >-
    在《范畴篇》中，他提出了著名的"十范畴"：实体、性质、关系、地点、时间、姿势、具有、活动、遭受，认为这些范畴既是对外部存在的分类，也是对命题的主谓词的分类，由此开创了对命题的主谓式逻辑分析。
- id: mill_five_methods
  label: 密尔五法（求因果五法）
  source: 逻辑学十五讲·第一讲/第七讲
  summary: >-
    密尔在《逻辑体系——演绎和归纳》(1843)中系统阐述了寻求因果联系的5种方法：求同法（契合法）、求异法（差异法）、求同求异并用法、共变法和剩余法，通称'密尔五法'。这是在继承培根三表法和排斥法基础上形成的。
  quote: 密尔在继承和改进培根的三表法和排斥法的基础上，系统性地阐述了寻求现象之间因果联系的5种方法：求同法、求异法、求同求异并用法、共变法和剩余法，通称'密尔五法'。
- id: leibniz_universal_characteristic
  label: 莱布尼茨普遍语言与理性演算
  source: 逻辑学十五讲·第一讲
  summary: >-
    莱布尼茨在博士论文《论组合术》中提出把推理化归于计算的理想，需要两件事：发明一套普遍语言（符号化语言），构造一套理性演算。他把矛盾律和充足理由律作为人类思维的两个根本原则，提出了'可能世界'观念。
  quote: 莱布尼茨就提出了这样的思想：把所有推理化归于计算，使推理的错误成为计算的错误，以至于哲学争论也可以通过计算来解决。
- id: frege_concept_script
  label: 弗雷格概念文字与逻辑主义
  source: 逻辑学十五讲·第一讲
  summary: >-
    弗雷格在《概念文字》(1879)中创立了一套符号语言，建立了集命题逻辑、一阶谓词逻辑和高阶逻辑于一身的现代逻辑系统。他最先阐述了逻辑主义纲领，即数学的可靠性基础在于逻辑。提出了'概念是其值为真值的函数'的重要论断。
  quote: >-
    把数学上的函数概念从各个方面加以推广，阐述了"概念是其值为真值的函数"的重要论断，提出了组合性原则和外延论题，创立了一套特别的、有些笨重的符号语言（概念文字），建立了一个集命题逻辑、不带等词的一阶谓词逻辑、带等词的一阶谓词逻辑和高阶逻辑于一身的现代逻辑系统，使莱布尼茨的"把所有推理化归为计算"的理想部分地得到实现。
- id: godel_incompleteness
  label: 哥德尔不完全性定理
  source: 逻辑学十五讲·第一讲
  summary: >-
    哥德尔在1931年证明：如果一个包括初等数论的形式系统是协调的，则它是不完全的，即在本系统中必定存在不可证明的真命题；此类系统的协调性在本系统中不能证明，更不能用有穷方法证明。这是对希尔伯特计划的重大冲击。
  quote: 如果一个包括初等数论的形式系统是协调的，则它是不完全的，即在本系统中必定存在不可证明的真命题；此类系统的协调性在本系统中不能证明，更不能用有穷方法证明。
- id: kripke_possible_worlds
  label: 克里普克可能世界语义学
  source: 逻辑学十五讲·第一讲
  summary: >-
    克里普克在中学时期所写论文中为模态逻辑创立了语义理论，即'克里普克语义学'或'可能世界语义学'。由于这一语义理论的创立，模态逻辑成为一个成熟的逻辑分支。他还提出了历史的因果命名理论和严格指示词概念。
  quote: 克里普克为当时处于激烈争论中的模态逻辑创立了一种语义理论，后来被称为'克里普克语义学'，亦称'可能世界语义学'。
- id: world_logic_three_sources
  label: 世界逻辑三大源流
  source: 逻辑学十五讲·第一讲
  summary: >-
    世界逻辑发展有三大源流：古希腊逻辑（亚里士多德三段论为代表）、中国先秦逻辑（《墨经》名辞说辩为代表）、古印度逻辑（正理论和因明为代表）。唯有古希腊逻辑有相对完整的历史，成为世界逻辑发展的主流。
  quote: >-
    公认的看法是，世界逻辑的发展有三大源流：肇始于古希腊的西方逻辑，以亚里士多德的三段论为代表；中国先秦时期的逻辑，以名、辞、说、辩为主要内容……古印度是佛教的发源地，其逻辑学理论也带有佛学特色。
- id: logos_meaning
  label: 逻各斯（Logos）
  source: 逻辑学十五讲·第二讲
  summary: >-
    逻辑最早可追溯到希腊词'逻各斯'（logos），基本词义是言辞、理性、秩序、规律，核心含义是'秩序'和'规律'。赫拉克利特最早将这一概念引入哲学，说明万物的生灭变化具有一定的尺度。
  quote: 不过，"逻各斯"的基本词义是言辞、理性、秩序、规律，其中核心含义又是"秩序"和"规律"，其他含义都是由此派生出来的。
- id: four_basic_laws
  label: 逻辑四基本规律
  source: 逻辑学十五讲·第二讲
  summary: >-
    同一律（A是A，思维须保持确定与同一）、矛盾律（并非A且非A，两矛盾命题不能同真）、排中律（A或非A，两矛盾命题不能同假）、充足理由律（从A推出B需充分理由）。它们保证思维的确定性、一致性、明确性和论证性。
  quote: 逻辑基本规律是正确思维的根本假定，也是理性的交谈能够进行下去的必要条件。这样的规律有四条：同一律、矛盾律、排中律和充足理由律。
- id: validity_reliability
  label: 推理有效性与可靠性
  source: 逻辑学十五讲·第二讲
  summary: >-
    有效性（保真性）是推理形式的特性：一个正确的推理必须确保从真前提只会得到真结论。可靠性（健全性）指推理要得出真实结论必须满足两个条件：一是前提真实，二是推理形式有效。
  quote: 推理形式的有效性亦称"保真性"，指一个正确的推理必须确保从真前提只会得到真结论。
- id: bivalence_principle
  label: 二值原则
  source: 逻辑学十五讲·第二讲
  summary: 任一命题必定或者为真或者为假，非真即假，非假即真。这是由矛盾律和排中律共同推导出来的。一般使用的逻辑都建立在这个原则之上，因此叫'二值逻辑'。
  quote: 在一对相互矛盾的命题中间，必定是肯定一个否定另一个；或者说，任一命题必定或者为真或者为假，非真即假，非假即真。这就是所谓的'二值原则'。
- id: intension_extension
  label: 词项的内涵与外延
  source: 逻辑学十五讲·第三讲
  summary: >-
    词项的内涵是该词项所表达的概念，即所指对象具有的特有属性或区别性特征。词项的外延是该词项所指的对象集合或类别。二者存在反比关系：内涵越多，外延越小；内涵越少，外延越大。
  quote: 词项的内涵就是该词项所表达的概念，也就是该词项所指称的那个或那些对象所具有的并且被人们认识到的事物的特有属性或区别性特征。
- id: definition_rules
  label: 定义的五条规则
  source: 逻辑学十五讲·第三讲
  summary: >-
    （1）定义必须揭示被定义对象的特有属性或区别性特征。（2）定义项和被定义项的外延必须相等，否则犯'定义过窄'或'定义过宽'错误。（3）定义不能恶性循环。（4）定义不可用含混、隐晦或比喻性词语。（5）除非必要，定义不能用否定形式或负概念。
  quote: 定义的目的就是通过揭示概念的内涵和外延，明确概念的适用范围，并因此判定该概念的某一次具体使用是否适当。
- id: euler_diagram
  label: 欧拉图与词项外延关系
  source: 逻辑学十五讲·第三讲
  summary: >-
    欧拉图使用圆圈来表示非空非全的类或集合之间的关系。任意两个词项的外延之间有且仅有五种关系：全同关系、包含关系、包含于关系、交叉关系和全异关系（全异又分为矛盾关系和反对关系）。
  quote: 欧拉图使用圆圈来表示非空非全的类或集合之间的关系。依照这种方法，任意两个词项的外延之间有且仅有五种关系。
- id: hypothetical_proposition
  label: 假言命题与假言推理
  source: 逻辑学十五讲·第四讲
  summary: >-
    假言命题断定事物情况之间的条件关系，分为充分条件（如果p则q）、必要条件（只有p才q）和充分必要条件（p当且仅当q）。充分条件假言推理有效式：肯定前件式和否定后件式。必要条件假言推理有效式：否定前件式和肯定后件式。
  quote: 假言命题是断定事物情况之间的条件关系的复合命题。条件关系分为三种：充分条件、必要条件和充分必要条件。
- id: dilemma_reasoning
  label: 二难推理（假言选言推理）
  source: 逻辑学十五讲·第四讲
  summary: >-
    二难推理的简单构成式：(p→r)∧(q→r)∧(p∨q)→r。复杂构成式：(p→q)∧(r→s)∧(p∨r)→q∨s。经典例子：普罗泰戈拉与欧提勒士的'半费之讼'、'上帝举石'悖论、苏格拉底劝婚推理等。
  quote: 二难推理亦称"假言选言推理"，有多种形式。
- id: disjunctive_syllogism
  label: 选言命题与选言推理
  source: 逻辑学十五讲·第四讲
  summary: >-
    选言命题分为相容（p或q，各选言支可同真）和不相容（要么p要么q，各选言支不能同真）。相容选言推理有效式：否定肯定式。不相容选言推理有效式：否定肯定式和肯定否定式。
  quote: 选言命题分为相容选言命题和不相容选言命题两类。
- id: categorical_proposition
  label: 直言命题（性质命题）
  source: 逻辑学十五讲·第五讲
  summary: >-
    直言命题是一个主谓式命题，断定了某个数量的对象具有或不具有某种性质。分为全称肯定(A:所有S是P)、全称否定(E:所有S不是P)、特称肯定(I:有些S是P)、特称否定(O:有些S不是P)。单称命题常被当作全称命题的特例。
  quote: 直言命题是一个主谓式命题，它断定了某个数量的对象具有或者不具有某种性质，因此也叫做'性质命题'。
- id: square_of_opposition
  label: 对当方阵（逻辑方阵）
  source: 逻辑学十五讲·第五讲
  summary: >-
    A、E、I、O四种直言命题之间的真假关系：反对关系(A与E，不同真可同假)、矛盾关系(A与O、E与I，必一真一假)、差等关系(A与I、E与O，全称真则特称真)、下反对关系(I与O，可同真不同假)。
  quote: 可以把A、E、I、O之间的真假关系概括为四类，即反对关系、矛盾关系、差等关系和下反对关系。
- id: syllogism_rules
  label: 三段论一般规则与有效式
  source: 逻辑学十五讲·第五讲
  summary: >-
    三段论七条一般规则：(1)只有三个不同词项；(2)中项至少周延一次；(3)前提不周延的项结论中不得周延；(4)两否定前提不得结论；(5)前提有一否定则结论否定；(6)两特称前提不得结论；(7)前提有一特称则结论特称。有效式共24个。
  quote: 一个三段论要成为有效推理，就必须遵守一些推演规则。
- id: distribution
  label: 词项周延性规则
  source: 逻辑学十五讲·第五讲
  summary: >-
    在直言命题中，若断定了一个词项的全部外延，则称它是周延的，否则是不周延的。（1）全称命题主项周延；（2）特称命题主项不周延；（3）肯定命题谓项不周延；（4）否定命题谓项周延。
  quote: 主项或谓项的周延性是由直言命题的形式决定的，是直言命题的形式性质，周延性是一个只与直言命题的形式有关、而与主项和谓项所反映的对象的实际情况无关的概念。
- id: immediate_inference
  label: 直接推理：换质法与换位法
  source: 逻辑学十五讲·第五讲
  summary: >-
    换质法：改变命题的质（肯定↔否定），将谓项改为其矛盾概念。换位法：交换主谓项位置，保持质的相同，在前提中不周延的项在结论中不得周延。有效形式：SAP↔SEP, SEP↔SAP; SAP→PIS,
    SEP→PES, SIP→PIS。
  quote: 命题变形推理是由一个直言命题出发，通过改变它的形状，得到一个新的直言命题的推理。主要包括换质法、换位法和换质位法，以及这些方法的连续运用。
- id: predicate_logic
  label: 谓词逻辑（量化逻辑）
  source: 逻辑学十五讲·第六讲
  summary: >-
    把命题分析为个体词、谓词、量词和联结词。全称量词∀表示'所有'，存在量词∃表示'有些'。直言命题在谓词逻辑中符号化为：SAP→∀x(S(x)→P(x))，SIP→∃x(S(x)∧P(x))。可以处理关系命题及其推理。
  quote: 我们需要另外的分析命题和推理的方法，即把命题或推理分析为包含个体词、谓词、量词和联结词等成分，以便能够刻画关系命题及其推理。
- id: binary_relations
  label: 二元关系的逻辑性质
  source: 逻辑学十五讲·第六讲
  summary: >-
    （1）自返性：∀xR(x,x)，如'等于'。（2）对称性：∀x∀y(R(x,y)→R(y,x))，如'同学'。（3）传递性：∀x∀y∀z(R(x,y)∧R(y,z)→R(x,z))，如'大于'。偏序关系满足非自返性、非对称性和传递性。
  quote: 不同的关系有不同的逻辑性质。这里主要考虑二元关系的逻辑性质，即关系的自返性、对称性和传递性。
- id: inductive_generalization
  label: 简单枚举法与科学归纳法
  source: 逻辑学十五讲·第七讲
  summary: >-
    简单枚举法：考察部分对象都具有某种属性且无反例，推出所有对象都具有该属性。科学归纳法：在观察基础上加上科学研究，弄清S和P之间有必然联系，从而作出归纳概括。完全归纳法：穷尽考察一类所有对象，前提真则结论真。
  quote: 简单枚举法的内容是：在一类事物中，根据已观察到的那部分对象都具有某种属性，并且没有遇到任何反例，从而推出该类所有对象都具有该种属性的结论。
- id: agreement_method
  label: 求同法（契合法）
  source: 逻辑学十五讲·第七讲
  summary: >-
    考察被研究现象出现的若干场合，找出此现象的先行现象。那些保持不变的、总与被研究现象共同出现的先行现象，就有可能与被研究现象有因果关系。公式：场合1有A、B、C和a，场合2有A、B、D和a，场合3有A、C、E和a，所以A可能是a的原因。
  quote: >-
    求同法亦称契合法，是指这样一组操作：考察被研究现象出现的若干场合，找出此现象的先行现象……在这些场合中保持不变的、总与被研究现象共同出现的那个先行现象，就有可能与被研究现象有因果关系。
- id: difference_method
  label: 求异法（差异法）
  source: 逻辑学十五讲·第七讲
  summary: >-
    考察被研究现象出现和不出现的两种场合，在被研究现象出现时出现、不出现时不出现的那个先行现象，则可能与被研究现象有因果联系。公式：场合1有A、B、C和a，场合2有B、C但无a，所以A可能是a的原因。求异法在科学实验中常被采用。
  quote: 求异法亦称差异法，是指这样一组操作：考察被研究现象出现和不出现的两种场合……
- id: joint_method
  label: 求同求异并用法（契合差异并用法）
  source: 逻辑学十五讲·第七讲
  summary: >-
    先在正面场合求同（被研究现象出现的几个场合中只有一个共同先行情况），再在反面场合求同（被研究现象不出现的几个场合中都没有这个先行情况），最后在正反场合之间求异。此法可靠性比单独使用求同法或求异法更高。
  quote: 求同求异并用法不是求同法和求异法的相继运用，它是吸收了求同法和求异法的某些特点而形成的一种独立的方法。
- id: concomitant_variation
  label: 共变法
  source: 逻辑学十五讲·第七讲
  summary: >-
    每当某一现象发生一定程度的变化时，另一现象也随之发生一定程度的变化，则这两个现象之间可能有因果联系。公式：有A1则有a1，有A2则有a2，有A3则有a3，所以A是a的原因。许多仪表如体温表、气压表等都是根据共变法的道理制成。
  quote: 共变法的思路，即每当某一现象发生一定程度的变化时，另一现象也随之发生一定程度的变化，则这两个现象之间（可能）有因果联系。
- id: residue_method
  label: 剩余法
  source: 逻辑学十五讲·第七讲
  summary: >-
    如果已知某一复杂现象是另一复杂现象的原因，同时又知前一现象中的某一部分是后一现象中的某一部分的原因，那么前一现象的其余部分与后一现象的其余部分有因果联系。应用实例：居里夫人发现镭、海王星的发现。
  quote: 剩余法一般被用来判明事物的复杂的因果联系，而且必须在判明了被研究对象的全部原因中的一部分原因的基础上才能使用。
- id: hume_problem
  label: 休谟问题（归纳问题）
  source: 逻辑学十五讲·第七讲
  summary: >-
    休谟从经验论立场出发对因果关系的客观性和归纳合理性提出根本性质疑：（1）归纳推理不能得到演绎主义证成，从有限事例跳到全称结论无演绎保证；（2）归纳有效性不能归纳地证明，否则循环；（3）自然齐一律和普遍因果律无客观真理性。休谟说：'习惯是人生的最大指导。'
  quote: 休谟从经验论立场出发，对因果关系的客观性提出了根本性质疑，其中隐含着对归纳合理性的根本性质疑。
- id: formal_system
  label: 形式系统与形式化方法
  source: 逻辑学十五讲·第八讲
  summary: >-
    形式系统由形式语言（初始符号+形成规则）和演绎结构（公理+变形规则）构成。形式化包括符号化但不等于符号化，包括公理化但不等于公理化。命题演算P有10条公理和MP规则（分离规则）。
  quote: 形式化是构造形式系统的程序，具体包括以下步骤：（1）给出初始符号；（2）给出形成规则；（3）给出公理；（4）给出变形规则。
- id: metalogic
  label: 元逻辑研究
  source: 逻辑学十五讲·第八讲
  summary: >-
    以形式系统为对象的理论称为元理论，以逻辑形式系统为对象的元理论称为元逻辑。研究形式系统的一致性（可靠性）、完全性、可判定性、独立性、范畴性等性质。哥德尔不完全性定理、丘奇—图林不可判定性定理和塔斯基真概念不可定义性定理为三大局限性定理。
  quote: 形式系统一经构造完成之后，本身立刻就成为研究的对象，成为对象理论。以形式系统为对象的理论称为元理论。
- id: propositional_calculus
  label: 命题演算P
  source: 逻辑学十五讲·第八讲
  summary: >-
    命题演算P的10条公理模式：A1 A→(B→A); A2 (A→(B→C))→((A→B)→(A→C)); A3 A∧B→A; A4 A∧B→B; A5 A→(B→A∧B); A6 A→A∨B;
    A7 B→A∨B; A8 (A→C)→((B→C)→(A∨B→C)); A9 (A→B)→((A→B)→A); A10 A→A。变形规则：MP（分离规则）。
  quote: P中的一个证明是L1的一个有穷非空的公式序列A1，A2…An，使得对于每一i（1≤i≤n），Ai或者是P的公理，或者是由序列前面的公式经使用P的变形规则而得到。
- id: deviant_logic
  label: 变异逻辑
  source: 逻辑学十五讲·第九讲
  summary: >-
    通过修改经典逻辑的某个或某些假定或预设所得的逻辑系统。经典逻辑预设：外延原则、二值原则、由假得全原则、实无穷抽象法、存在假定。变异逻辑包括：多值逻辑（去掉二值原则）、相干逻辑（挑战实质蕴涵）、直觉主义逻辑（挑战实无穷假定和二值原则）、次协调逻辑（挑战由假得全原则）。
  quote: >-
    "变异逻辑"就是通过修改经典逻辑的某个或某些假定或预设所得到的逻辑系统，与标准的逻辑系统（即一些命题逻辑和谓词逻辑的系统）相比，它们是一些供选择的另类的逻辑系统（alternative systems）。
- id: many_valued_logic
  label: 乌卡谢维奇三值逻辑
  source: 逻辑学十五讲·第九讲
  summary: >-
    由波兰逻辑学家乌卡谢维奇开创，源于对亚里士多德'海战问题'的思考：未来偶然性命题既不真也不假，而是'可能的'。三个真值：T(真)、F(假)、I(不定)。经典逻辑中的排中律(A∨A)和矛盾律(A∧A)在三值逻辑中不再普遍成立。
  quote: 所以，所考虑的这个命题目前既不真也不假，必定具有不同于"0"或"假"和"1"或"真"的第三值。
- id: modal_logic
  label: 模态逻辑与可能世界语义学
  source: 逻辑学十五讲·第一讲/第十讲
  summary: >-
    模态逻辑研究'必然'、'可能'等模态词的逻辑性质。克里普克创立的可能世界语义学使模态逻辑成为成熟的逻辑分支。还包括道义逻辑（义务、允许、禁止）、时态逻辑（过去、现在、将来）、认知逻辑（知道、相信）等广义模态逻辑。
  quote: 由于这一语义理论的创立，模态逻辑成为一个成熟的逻辑分支，甚至在当代逻辑学科体系中取得了某种'新经典逻辑'的地位。
- id: fallacies
  label: 谬误与诡辩
  source: 逻辑学十五讲·第十三讲
  summary: >-
    谬误分为三大类：（1）歧义性谬误——偷换概念、混淆概念等；（2）假设性谬误——窃取论题（循环论证）、复杂问语等；（3）关联性谬误——诉诸人身、诉诸权威、诉诸情感、诉诸无知等。鲁迅在《论辩的魂灵》中揭露了多种诡辩手法。
  quote: 我们把非形式谬误分为"歧义性谬误"、"假设性谬误"和"关联性谬误"三大类，它们是下面讨论的重点。
- id: paradoxes
  label: 悖论
  source: 逻辑学十五讲·第十四讲
  summary: >-
    悖论是从看似合理的命题出发，通过看似有效的推理步骤，推出逻辑矛盾的情况。常见悖论：说谎者悖论（'这句话是假的'）、罗素悖论（'所有不是自身元素的集合'）、半费之讼悖论等。悖论产生涉及自我指涉和恶性循环。
  quote: '"悖论"是两个英语词paradox和antinomy、特别是前者的中译，从字面上说，悖论是指荒谬的理论，或自相矛盾的命题。'
- id: chinese_logic
  label: 中国先秦逻辑（墨经逻辑）
  source: 逻辑学十五讲·第十五讲
  summary: >-
    中国先秦逻辑以名、辞、说、辩为主要内容，以《墨经》的逻辑学为主要代表。墨家把'故'分为'大故'（有之必然，无之必不然，即充分必要条件）和'小故'（有之不必然，无之必不然，即必要条件）。《墨经》说：'夫辞以故生。立辞而不明于其所生，妄也。'
  quote: 《墨经》中也说："夫辞以故生。立辞而不明于其所生，妄也。"（《大取》）即是说，论断凭借理由而产生，提出论断而不明确它赖以产生的理由，就是虚妄的。

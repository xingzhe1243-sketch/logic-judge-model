source: 亲密关系（第6版）— Rowland S. Miller
description: 社会心理学精品译丛：人际关系科学的完整框架 Chinese translation from EPUB source.
core_concepts:
- id: six_features
  label: 亲密关系的六个特征
  source: 第1章 人际关系的构成
  summary: >-
    亲密关系与泛泛之交在六个方面存在程度差异：了解（彼此广泛而私密的认知）、关心（从对方身上感受到关爱）、相互依赖性（彼此需要的程度和影响对方的程度）、相互一致性（认同双方在生活上的融合，自称'我们'而非'我'）、信任（期望对方会善待和尊重自己）、承诺（希望关系持续并为此投入时间和精力）。最令人满意的亲密关系应当包括全部六个特征。
  quote: >-
    亲密关系和泛泛之交至少在六个方面存在程度差异：了解（knowledge）、关心（care）、相互依赖性（interdependence）、相互一致性（mutuality）、信任（trust）以及承诺（commitment）。
- id: need_to_belong
  label: 归属需要
  source: 第1章 人际关系的构成
  summary: >-
    归属需要是人类与生俱来的、与他人建立亲密关系的强烈内驱力。这种需要使我们与亲密之人的正常社会交往变得必不可少。如果归属需要得不到满足，就会出现各种问题：身心健康受损、适应能力下降。人类是非常社会化的动物，剥夺与他人的紧密接触会令人极度痛苦。
  quote: 在亲密关系中包含有人的归属需要（need to belong），如果这种需要得不到满足，就会发生各种各样的问题。
- id: attraction_basics
  label: 吸引力的基础
  source: 第3章 吸引力
  summary: >-
    人与人之间产生吸引力最基本的假设是他人的出现具有奖赏意义。奖赏分为直接奖赏（他人提供的愉悦、赞许、物质利益）和间接利益（仅与他人有关的特征，如相似性、熟悉感）。吸引力还取决于我们自己的需要、偏好、愿望以及所处的情境。影响吸引力的关键因素包括临近性（空间距离近）、熟识度（重复接触的曝光效应）、长相吸引力、相似性（态度、价值观的相似）以及相互喜欢（得知对方喜欢自己）。
  quote: 人与人之间产生吸引力最基本的假设是：他人的出现对于我们有奖赏意义（Clore & Byrne，1974）。
- id: mere_exposure
  label: 曝光效应
  source: 第3章 吸引力
  summary: >-
    重复地接触他人（即使只是看到照片）通常能增加我们对他们的喜欢程度，而不会导致厌烦。这就是曝光效应。在一项经典研究中，大学学期内出现在课堂上次数越多的女生，在学期末被真正的学生评价为越有吸引力。临近之所以能增加吸引力，很大程度上是通过曝光效应实现的——更多接触带来更多熟悉，更多熟悉带来更多喜欢。
  quote: >-
    重复地接触他人（甚至只要看到他人照片）通常能增加我们对他们的喜欢程度，而不会导致厌烦，此即曝光效应（mere exposure effect） [1] （Zajonc，2001）。
- id: similarity_attraction
  label: 相似性吸引
  source: 第3章 吸引力
  summary: >-
    人们倾向于喜欢与自己相似的人——态度、价值观、性格、兴趣等方面的相似性都会增加吸引力。「相像」这一原则被称为匹配。不仅实际的相似性重要，知觉到的相似性也有影响。人们还倾向于喜欢那些他们认为会喜欢自己的人，相互喜欢的双向吸引力是关系建立的重要动力。
  quote: 人际吸引最基本的原则之一就是相像律：同性相吸（相类似的人彼此吸引对方）。
- id: first_impression
  label: 第一印象与首因效应
  source: 第4章 社会认知
  summary: >-
    第一印象形成极快（只需1/25秒就能判断面部表情，十分之一秒就能判断长相吸引力和可信度），且极为持久。首因效应使最先获得的信息深刻影响整体印象。第一印象一旦形成，就会影响人们对后来所获信息的解释——人们倾向于选择性地注意和解释那些符合先入之见的信息。即使第一印象是错的，也仍会相当顽固地持续存在。
  quote: 第一印象很重要。第一次与人短暂的谋面后，对别人所形成的印象深刻而持久，初期的认知在数月之后还影响着人们的判断。
- id: relationship_beliefs
  label: 关系信念与归因模式
  source: 第4章 社会认知
  summary: >-
    人们对亲密关系所持的信念深刻影响关系的质量。适应不良的信念包括：争论是破坏性的（认为恩爱的伴侣不应有分歧）、心有灵犀是必要的（伴侣应该不需要沟通就了解彼此）、伴侣是不会改变的（一旦关系变坏就无法挽回）。幸福的伴侣倾向于做出增进关系的归因——将伴侣的正面行为归因为内在特质，将负面行为归因为外部情境。
  quote: >-
    认知决定了人们的感受和行动。如果人们的判断一直能保持正确，则没有什么不良后果。然而，解释某一事件通常有各种合理的理由（正如上面的例子所示），即使我们信心十足地自以为掌握了事实的真相，仍会犯错误。
- id: interpersonal_gap
  label: 人际隔阂
  source: 第5章 沟通
  summary: >-
    人际隔阂是沟通中普遍存在的问题：信息传递者的意图和接受者实际接受到的信息之间存在差异。传递者以为自己清楚地表达了意图，但接受者的解码可能完全不同。更令人警觉的是，人际隔阂更可能出现在亲密关系之中而非陌生人之间——我们不会想到伴侣也会误解自己，因而不像与陌生人相处那样努力检查彼此是否达成共识。
  quote: >-
    我们常常认定自己发出的信息会产生我们所期望的作用，但我们却很少真正能确知它的效果。我们常常认识不到（Keysar & Henly，2002），传递者的意图和对接受者产生的影响并不相同，这就是我们所面临的人际隔阂（interpersonal
    gap）。
- id: communication_skills
  label: 有效沟通的核心技能
  source: 第5章 沟通
  summary: >-
    良好沟通是亲密关系幸福的关键。有效沟通包括：精确表述（使用'我陈述'而非'你陈述'，如'我感到被忽视'而非'你总是忽略我'）、积极倾听（复述和知觉检验——'你似乎感到不满，对吗？'）、守礼而镇定（在愤怒升级前暂停，深呼吸）、尊重和确认对方感受（即使不同意，也要承认对方的情绪是合理的）。沟通质量比沟通频率更能预测关系满意度。
  quote: 沟通在亲密关系中极其重要，也比我们通常所认识到的要复杂得多。
- id: social_exchange
  label: 社会交换与相互依赖理论
  source: 第6章 相互依赖
  summary: >-
    相互依赖理论认为人们就像购物一样在人际商厦里浏览，寻求以最小代价获取最大奖赏价值的人际交往。满意度取决于交往结果与比较水平（CL，即我们认为自己应当得到的结果值）的差值：结果-CL=满意度。而依赖程度取决于当前关系结果与替代选择（CL_alt）的比较：如果替代选择更好，即使满意也可能离开；如果替代选择更差，即使不满意也可能留下。投入模型进一步指出，投入（时间、金钱、情感、自我身份）越大，承诺越强。
  quote: >-
    相互依赖理论认为，人们就像购物那样在人际商厦里浏览。所有人都在寻找最合意的商品。我们在寻求以最小代价获取能提供最大奖赏价值的人际交往，我们只会与那些能提供足够利益的伴侣维持亲密关系（Rusbult
    et al.，2001）。
- id: friendship
  label: 友谊的本质与属性
  source: 第7章 友谊
  summary: >-
    友谊被定义为一种自发的人际关系，通常表现出亲密和扶助，双方彼此欣赏并企求对方的陪伴。核心属性包括：温情（彼此欣赏、信任、尊重、能做真实的自己）、共同参与和分享（自我表露、情感支持、遵守平等规范）、彼此相伴（分享兴趣、参与活动）。友谊与爱情的区别在于：爱情包含性的欲望、排他性愿望和更强烈的着迷，以及更严厉的行为标准。但深厚的友谊同样具有奖赏价值。
  quote: 故而有学者把友谊（friendship）定义为“一种自发的人际关系，通常表现出亲密和扶助，双方彼此欣赏，并企求对方的陪伴”（Fehr，1996，p7）。
- id: love_triangle
  label: 爱情三角理论
  source: 第8章 爱情
  summary: >-
    斯腾伯格认为各种爱情都能由三个成分组合而成：亲密（热情、理解、沟通、支持——情感性）、激情（性的唤醒和欲望——动机性）、承诺（投身爱情和维护爱情的决心——认知性）。三成分组合形成七种爱情类型：喜欢（仅亲密）、迷恋（仅激情）、空爱（仅承诺）、浪漫之爱（亲密+激情）、伴侣之爱（亲密+承诺）、愚昧之爱（激情+承诺）、圆满之爱（三者兼备）。伴侣之爱比浪漫之爱更稳定长久。
  quote: >-
    各种不同的爱情都能由三个构成成分组合而成（Sternberg，1987，2006）。爱情的第一个成分是亲密（intimacy），包括热情、理解、沟通、支持和分享等爱情关系中常见的特征。第二个成分是激情（passion），其主要特征为性的唤醒和欲望。爱情的最后一个成分是承诺（commitment），指投身于爱情和努力维护爱情的决心。
- id: companionate_love
  label: 伴侣之爱与浪漫之爱
  source: 第8章 爱情
  summary: >-
    浪漫之爱（亲密+激情）往往随时间减弱，这几乎是必然的规律。但伴侣之爱（亲密+承诺）可以持续增强。由浪漫之爱转向伴侣之爱是健康关系的发展轨迹——激情消退后，深厚、关爱的友谊成为关系的基石。那些在长期关系中仍然幸福的人，并非仍然保持着热恋期的激情强度，而是发展出了更丰富、更深刻的亲密感和承诺感。
  quote: 在幸福的亲密关系之中，如果激情减少，就会出现深厚、关爱的友谊，此类友谊丰富而热情，足以满足双方。
- id: sex_and_relationship
  label: 性行为与关系满意度
  source: 第9章 性爱
  summary: >-
    人类的性行为与亲密关系的质量和健康状态紧密相连。性满足和关系满意度之间存在双向影响：幸福的伴侣有更满意的性生活，而满意的性生活又促进关系幸福。性的频率不如性的质量重要。男性和女性在性态度上存在差异——男性更可能接受没有爱情的随意性行为，而女性更看重承诺背景下的性行为。性生活频率与关系满意度之间存在倒U型关系：太少或太多都可能有问题。
  quote: 亲密的爱情关系往往包含了性的成分，而且我们的性行为和性满足常常取决于爱情关系的性质和健康状态。
- id: relational_value
  label: 关系价值与感情创伤
  source: 第10章 压力与紧张
  summary: >-
    关系价值是指他人认为与我们的亲密关系珍贵、重要或亲近的程度。当我们感知到的关系价值低于期望时就会感到苦恼。感情创伤、伴侣排斥、嫉妒、说谎和背叛是亲密关系中的常见压力和紧张来源。值得注意的是，他人温和的拒绝带来的感受通常和彻底排斥一样糟糕——从矛盾情感转向任何程度的拒绝都足以使自尊降至最低点。关系贬值（接纳程度下降）比持续的排斥更令人痛苦。
  quote: 负面事件的出现，表明我们得不到伴侣的爱慕和尊敬。
- id: jealousy_betrayal
  label: 嫉妒、说谎与背叛
  source: 第10章 压力与紧张
  summary: >-
    嫉妒是对感知到的威胁的反应——当我们珍视的关系受到真实或想象的竞争对手威胁时产生。性嫉妒在男女两性中有不同表现：男性更关注性的不忠（进化上担心父系不确定性），女性更关注情感的不忠（担心资源被转移）。说谎在亲密关系中非常普遍——几乎每个人迟早都会对亲密伴侣说谎，但大多是小谎。背叛则更加严重，损害关系的基础信任。宽恕是应对背叛的关键能力，但需要真诚的道歉和悔意。
  quote: >-
    几乎每个人迟早都会对亲密伴侣说谎（DePaulo et al.，2006）。甚至各种直接的背叛都惊人地普遍，并且很难避免（Baxter et al.，1997）。
- id: conflict_nature
  label: 冲突的性质与不可避免性
  source: 第11章 冲突
  summary: >-
    只要个体的动机、目标、信念、观点或行为妨碍别人或与别人矛盾，就会发生人际冲突。冲突不可避免有两个原因：一是任何两个人在情绪和偏好上都会存在差别；二是亲密关系中交织着对立统一的辩证动机（自主vs联系、开放vs封闭、稳定vs变化、聚合vs分离）。冲突的频率很高——青少年每天平均经历7次意见分歧，配偶每两周报告7次难忘的意见差异。冲突本身不是问题，应对方式才是关键。
  quote: >-
    无论两个人彼此多么关心，彼此多么般配，总会发生分歧和争执（Canary，2003）。并且他们越是相互依赖——待在一起的时间越长，要协调的活动和任务种类越广泛——冲突就越可能发生（Miller，1997b）。在亲密关系中冲突是不可避免的。
- id: conflict_resolution
  label: 建设性冲突处理
  source: 第11章 冲突
  summary: >-
    建设性地处理冲突是关系健康的关键。有效的策略包括：保持冷静（在情绪升级前暂停、深呼吸）、使用温和的沟通方式（而非批评和指责）、积极倾听（复述对方的观点以确保理解）、尊重对方的立场（即使不同意）、寻找共同利益点而非坚持立场。破坏性的冲突模式包括：要求-退缩模式（一方批评指责，另一方回避退缩）、相互升级的敌对交换。戈特曼的研究指出，幸福的夫妻在冲突中仍然保持至少5：1的积极与消极互动比例。
  quote: 久而久之，伴侣双方应对突的方式要么促进、要么侵蚀他们彼此的爱恋和尊重。
- id: power_in_relationships
  label: 亲密关系中的权力
  source: 第12章 权力和暴力
  summary: >-
    社交权力是影响他人行为并抵制他人影响自己的能力。权力的基础是对有价值资源的控制。较小利益原则指出：对于继续和维持亲密关系利益较小的一方拥有更多的权力。替代选择的易得性也会影响权力平衡——依赖较少、选择更多的人拥有更大的权力。理想的关系是平等的伴侣关系，权力由双方共享。但现实中的权力分配往往不平等，这可能导致满意度下降和关系质量降低。
  quote: >-
    较小利益原则（principle of lesser interest）认为：在任何伴侣关系中对于继续和维持亲密关系利益较小的一方在伴侣关系中拥有更多的权力（Waller & Hill，1951）。
- id: intimate_violence
  label: 亲密关系暴力
  source: 第12章 权力和暴力
  summary: >-
    亲密关系暴力是一个严重但普遍存在的社会问题。暴力分为情境性伴侣暴力（在冲突中偶发升级为肢体冲突）和严重恐怖主义暴力（一方系统性地使用暴力控制对方）。暴力往往与权力不平衡、低自尊、童年经历和特定人格特质有关。暴力循环包括紧张期、爆发期和蜜月期。受害者往往难以离开，原因包括恐惧、经济依赖、自我怀疑以及暴力循环中的短暂平和期带来的希望。
  quote: 22%的女性和7%的男性曾经遭到自己的亲密伴侣暴力攻击。
- id: divorce_trends
  label: 离婚率的变化与原因
  source: 第13章 亲密关系的解体与消亡
  summary: >-
    美国离婚率约50%，婚姻平均时长仅约18年。离婚率增加的原因包括：对婚姻的期望过高（强调个人实现和浪漫激情而非实际功能）、女性进入劳动力市场（减少经济依赖、增加冲突和替代选择机会）、性别角色变化、同居增加、社会对离婚的接受度提高。但离婚率数据具有一定误导性——并非所有人的离婚风险相同：受过大学教育且25岁后结婚的人群离婚率远低于平均水平。
  quote: >-
    我们因为爱恋和激情而结婚，并认为它们不会改变，我们还期望自己的配偶能成为精神伴侣，永远不会让我们失望。但这些要求太高，可能是无法达到的高标准，的确，最近的文化和历史表明“只要爱情匹配和一生亲密的理想占据人们的头脑，人们就会开始要求离婚的权利”（Coontz，2005，p.8）。
- id: relationship_deterioration
  label: 关系恶化的阶段
  source: 第13章 亲密关系的解体与消亡
  summary: >-
    亲密关系的解体通常经历可识别的阶段：最初的不满和失望开始积累；伴侣开始注意到替代选择；开始与伴侣保持距离、减少沟通；关系被重新定义或正式结束；分手后进行后遗症的调整和个人的重建。不是所有关系都按这一线性顺序发展，但大多数关系恶化涉及这些要素。分手后的痛苦程度取决于依恋类型、关系投入程度和替代选择质量等因素。
  quote: 关系失败的理由成千上万，任何伴侣关系的恶化都可能牵涉到独特的事件和过程。
- id: relationship_maintenance
  label: 关系维持机制
  source: 第14章 亲密关系的维持和修复
  summary: >-
    忠诚于伴侣关系的人会采取多种机制维持关系。认知维持机制包括：认知上的相互依赖（用'我们'而非'我'来思考）、积极错觉（以最好眼光看待伴侣，将过失视为无心之失）、感知到的优越感（认为自己的关系比大多数人的更好）、对替代选择的无视（有意识地不去注意其他可能的伴侣）。行为维持机制包括：乐于做出牺牲、顺应伴侣的挑衅（抑制以牙还牙的冲动）、宽恕、共同参与新奇刺激的活动以保持关系活力。
  quote: >-
    忠诚的伴侣会以积极错觉（positive illusion）来看待彼此，彼此理想化并尽可能以最好的眼光来看待他们的亲密关系（Conley et al., 2009；Luo et al.，2010）。
- id: relationship_intervention
  label: 关系修复与干预
  source: 第14章 亲密关系的维持和修复
  summary: >-
    当亲密关系出现严重问题时，专业的干预手段能够帮助修复。基于研究的干预方法包括：夫妻沟通训练（学习和练习建设性沟通技巧）、冲突管理教育（认识和控制破坏性互动模式）、积极行为激活（增加日常的积极互动和欣赏表达）、归因再训练（帮助伴侣更多做出增进关系的归因而非破坏性归因）。最重要的是，知识就是力量——更好地理解亲密关系后，人们就能做好充分准备防止问题并克服困难。
  quote: >-
    有许多理由使我们坚信，只要具备智慧和一起努力，我们就能和爱侣幸福到老。的确，我就坚决主张“知识就是力量”：更好地理解了亲密关系之后，人们就能充分地做好准备，防止某些问题并轻松地克服其他难题。

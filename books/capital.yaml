source: 资本论 (Das Kapital) — Karl Marx
description: 三卷全集完整核心框架：政治经济学批判体系 Direct citations from the original Chinese edition.
core_concepts:
- id: shangpin_baiwujiao
  label: 商品拜物教
  source: 第一卷 第一章 第四节
  summary: >-
    商品形式把生产者之间的社会关系扭曲为物与物之间的关系。商品的神秘性质来源于劳动产品的商品形式本身——人们在市场上交换商品时实际上是在交换各自的劳动，但这种社会关系被物的关系所掩盖，导致人们误以为价值是商品与生俱来的自然属性，而非社会劳动的结晶。
  quote: 商品世界的这种拜物教性质，像以上分析已经表明的，是来源于生产商品的劳动所特有的社会性质。
- id: use_exchange_value
  label: 使用价值与交换价值
  source: 第一卷 第一章 第一节
  summary: >-
    使用价值是商品满足人的某种需要的属性，构成财富的物质内容，具有质的差别。交换价值（价值）是商品中凝结的无差别人类劳动，表现为不同商品相交换的量的比例，只具有量的差别。使用价值是交换价值的物质承担者。
  quote: >-
    商品首先是一个外界的对象，一个靠自己的属性来满足人的某种需要的物。……物的有用性使物成为使用价值。……交换价值首先表现为一种使用价值同另一种使用价值相交换的量的关系或比例。……作为使用价值，商品首先有质的差别；作为交换价值，商品只能有量的差别，因而不包含任何一个使用价值的原子。
- id: abstract_concrete_labor
  label: 抽象劳动与具体劳动
  source: 第一卷 第一章 第二节
  summary: >-
    具体劳动是在特定目的和形式下进行的劳动，创造商品的使用价值，体现劳动的质。抽象劳动是撇开具体形式的人类劳动力的一般耗费，形成商品的价值，体现劳动的量。劳动的二重性是理解政治经济学的枢纽。
  quote: >-
    一切劳动，一方面是人类劳动力在生理学意义上的耗费；就相同的或抽象的人类劳动这个属性来说，它形成商品价值。一切劳动，另一方面是人类劳动力在特殊的有一定目的的形式上的耗费；就具体的有用的劳动这个属性来说，它生产使用价值。
- id: value_form
  label: 价值形式与货币起源
  source: 第一卷 第一章 第三节
  summary: >-
    价值形式经历了四个发展阶段：简单的价值形式、扩大的价值形式、一般价值形式和货币形式。货币是固定充当一般等价物的特殊商品，是商品交换发展到一定阶段的必然产物。货币的职能包括价值尺度、流通手段、贮藏手段、支付手段和世界货币。
  quote: 货币结晶是交换过程的必然产物。……金银天然不是货币，但货币天然是金银。……作为价值尺度并因而以自身或通过代表作为流通手段来执行职能的商品，是货币。
- id: labor_power
  label: 劳动力商品化
  source: 第一卷 第四章 第三节
  summary: >-
    劳动力成为商品需要两个条件：第一，劳动者具有人身自由，可以自由支配自己的劳动力；第二，劳动者除了自己的劳动力以外一无所有。劳动力商品具有独特的使用价值——它的使用即劳动不仅能创造价值，而且能创造大于自身价值的价值（剩余价值），这是资本增殖的秘密。
  quote: >-
    可见，货币占有者要把货币转化为资本，就必须在商品市场上找到自由的工人。这里所说的自由，具有双重意义：一方面，工人是自由人，能够把自己的劳动力当作自己的商品来支配，另一方面，他没有别的商品可以出卖，自由得一无所有，没有任何实现自己的劳动力所必需的东西。
- id: surplus_value
  label: 剩余价值理论
  source: 第一卷 第五章、第十四章
  summary: >-
    剩余价值是由雇佣工人创造的、被资本家无偿占有的超过劳动力价值的价值。马克思通过区分劳动和劳动力，解决了古典经济学的难题：劳动力成为商品，其使用价值创造的价值大于自身价值。剩余价值是资本主义剥削的秘密。
  quote: >-
    把工作日延长，使之超出工人只生产自己劳动力价值的等价物的那个点，并由资本占有这部分剩余劳动，这就是绝对剩余价值的生产。……就相对剩余价值的生产来说，工作日一开始就分成必要劳动和剩余劳动这两个部分。为了延长剩余劳动，就要通过以较少的时间生产出工资的等价物的各种方法来缩短必要劳动。
- id: constant_variable_capital
  label: 不变资本与可变资本
  source: 第一卷 第六章
  summary: >-
    不变资本（c）是购买生产资料的资本，其价值在生产过程中被转移到新产品中，不改变自身的价值量。可变资本（v）是购买劳动力的资本，它在生产过程中能创造大于自身的新价值，产生剩余价值。这一区分揭示了剩余价值的真正来源是可变资本购买的劳动力，而非全部资本。
  quote: >-
    变为生产资料即原料、辅助材料、劳动资料的那部分资本，在生产过程中并不改变自己的价值量。因此，我把它称为不变资本部分，或简称为不变资本。相反，变为劳动力的那部分资本，在生产过程中改变自己的价值。它再生产自身的等价物和一个超过这个等价物而形成的余额，剩余价值。……我把它称为可变资本部分，或简称为可变资本。
- id: absolute_relative_surplus
  label: 绝对剩余价值与相对剩余价值
  source: 第一卷 第五章、第十四章
  summary: >-
    绝对剩余价值通过延长工作日来增加剩余劳动时间；相对剩余价值通过提高劳动生产率来缩短必要劳动时间，从而相对延长剩余劳动时间。前者只与工作日长度有关，后者要求劳动技术过程和社会组织的彻底革命。
  quote: >-
    把工作日延长，使之超出工人只生产自己劳动力价值的等价物的那个点，并由资本占有这部分剩余劳动，这就是绝对剩余价值的生产。……就相对剩余价值的生产来说，工作日一开始就分成必要劳动和剩余劳动这两个部分。为了延长剩余劳动，就要通过以较少的时间生产出工资的等价物的各种方法来缩短必要劳动。
- id: wage_essence
  label: 工资的本质
  source: 第一卷 第十七章
  summary: >-
    工资的本质是劳动力价值或价格的转化形式，而非「劳动的价值」。劳动是价值的实体和尺度，本身没有价值。工资形式掩盖了资本主义剥削——它将工作日分为必要劳动和剩余劳动的事实隐藏起来，使全部劳动都表现为有酬劳动。
  quote: >-
    在资产阶级社会的表面上，工人的工资表现为劳动的价格。……但什么是商品的价值呢？这就是耗费在商品生产上的社会劳动的对象形式。……「劳动的价值」这个用语，价值概念不但完全消失，而且转化为它的反面。这是一个虚幻的用语，就像土地的价值一样。……工资的形式消灭了工作日分为必要劳动和剩余劳动、分为有酬劳动和无酬劳动的一切痕迹。全部劳动都表现为有酬劳动。
- id: capital_accumulation
  label: 资本积累
  source: 第一卷 第二十二章
  summary: >-
    资本积累是把剩余价值转化为资本，即剩余价值的资本化。资本积累的实质是：资本家利用无偿占有的剩余价值来扩大生产规模，从而进一步无偿占有更多的剩余价值。追加资本从一开始就是由无酬的他人劳动产生的。
  quote: >-
    把剩余价值当作资本使用，或者说，把剩余价值再转化为资本，叫作资本积累。……2000镑追加资本……它一开始就没有一个价值原子不是由无酬的他人劳动产生的。……对过去无酬劳动的所有权，成为现今以日益扩大的规模占有活的无酬劳动的惟一条件。
- id: simple_expanded_reproduction
  label: 简单再生产与扩大再生产
  source: 第一卷 第二十一章、第二十二章
  summary: >-
    简单再生产是在原有规模上重复的生产过程，剩余价值全部被资本家消费掉。扩大再生产是在扩大的规模上进行的再生产，剩余价值的一部分转化为追加资本。即使是简单再生产也揭示出：经过一定时期后，任何资本都会转化为资本化的剩余价值；资本主义生产过程不仅生产商品和剩余价值，而且生产和再生产资本关系本身。
  quote: >-
    如果这种收入只是充当资本家的消费基金，或者说，它周期地获得，也周期地消费掉，那么，在其他条件不变的情况下，这就是简单再生产。……资本主义生产过程在本身的进行中，再生产出劳动力和劳动条件的分离。这样，它就再生产出剥削工人的条件，并使之永久化。
- id: organic_composition
  label: 资本有机构成
  source: 第一卷 第二十三章 第一节
  summary: >-
    资本有机构成由资本技术构成决定并反映其变化的资本价值构成（不变资本与可变资本的比例）。随着资本主义发展和劳动生产率的提高，资本有机构成有不断提高的趋势——不变资本相对增长，可变资本相对减少，意味着同量资本雇用的劳动力相对减少。
  quote: >-
    我把由资本技术构成决定并且反映技术构成变化的资本价值构成，叫作资本的有机构成。……资本的不变部分比可变部分日益相对增长的这一规律，在每一步上都由商品价格的比较分析所证实。
- id: relative_overpopulation
  label: 相对过剩人口（产业后备军）
  source: 第一卷 第二十三章 第三节
  summary: >-
    相对过剩人口是相对于资本增殖需要而言多余的工人人口。它的形成是由于资本有机构成提高，可变资本相对减少，导致对劳动力的需求相对下降。产业后备军不仅是资本积累的必然产物，也是资本积累的杠杆和资本主义生产方式存在的条件。
  quote: >-
    资本主义积累不断地并且同它的能力和规模成比例地生产出相对的，即超过资本增殖的平均需要的，因而是过剩的或追加的工人人口。……过剩的工人人口是积累或资本主义基础上的财富发展的必然产物，但是这种过剩人口反过来又成为资本主义积累的杠杆，甚至成为资本主义生产方式存在的—个条件。
- id: general_law_accumulation
  label: 资本主义积累的一般规律
  source: 第一卷 第二十三章 第四节
  summary: >-
    资本积累越增长，财富在一极（资本家阶级）积累的同时，贫困、劳动折磨、受奴役、无知和道德堕落在另一极（工人阶级）也同步积累。产业后备军越大，工人阶级中需要救济的贫苦阶层也越大。这揭示了资本主义生产方式中财富与贫困的对抗性矛盾。
  quote: >-
    社会的财富即执行职能的资本越大，它的增长的规模和能力越大，从而无产阶级的绝对数量和他们的劳动生产力越大，产业后备军也就越大。……这就是资本主义积累的绝对的、一般的规律。……在一极是财富的积累，同时在另一极，即在把自己的产品作为资本来生产的阶级方面，是贫困、劳动折磨、受奴役、无知、粗野和道德堕落的积累。
- id: primitive_accumulation
  label: 原始积累
  source: 第一卷 第二十四章
  summary: >-
    原始积累是劳动者与生产资料分离的历史过程，是资本主义生产方式的前史。征服、奴役、劫掠、杀戮等暴力手段起着决定性作用，而非政治经济学所美化的「勤劳节俭」。对农民土地的剥夺是全部过程的基础。
  quote: >-
    这种原始积累在政治经济学中所起的作用，同原罪在神学中所起的作用几乎是一样的。……在真正的历史上，征服、奴役、劫掠、杀戮，总之，暴力起着巨大的作用。……所谓原始积累只不过是生产者和生产资料分离的历史过程。这个过程所以表现为「原始的」，因为它形成资本及与之相适应的生产方式的前史。
- id: historical_tendency
  label: 资本主义积累的历史趋势
  source: 第一卷 第二十四章 第七节
  summary: >-
    资本主义私有制否定了以个人劳动为基础的私有制；而随着资本集中和生产社会化的发展，资本主义私有制又因与生产的社会化不相容而被自身否定——这是「否定的否定」。最终将在协作和共同占有的基础上重新建立个人所有制。
  quote: >-
    从资本主义生产方式产生的资本主义占有方式，从而资本主义的私有制，是对个人的、以自己劳动为基础的私有制的第一个否定。但资本主义生产由于自然过程的必然性，造成了对自身的否定。这是否定的否定。………资本主义私有制的丧钟就要响了。剥夺者就要被剥夺了。
- id: capital_cycle
  label: 资本循环
  source: 第二卷 第一篇 第一章
  summary: >-
    产业资本依次经过购买、生产、销售三个阶段，相应采取货币资本、生产资本、商品资本三种职能形式，最后回到出发点的运动过程。货币资本循环的公式是：G—W…P…W′—G′。
  quote: 资本的循环过程经过三个阶段……货币资本循环的公式是：G—W…P…W′—G′。在这个公式中，虚线表示流通过程的中断，W′和G′表示由剩余价值增大了的W和G。
- id: capital_turnover
  label: 资本周转
  source: 第二卷 第二篇
  summary: >-
    资本周转是资本循环的周期性重复。周转时间由生产时间和流通时间构成。周转速度越快，预付可变资本的周转次数越多，同量可变资本在一年内推动的劳动力和生产的剩余价值就越多，年剩余价值率也就越高。
  quote: >-
    循环是作为周期的循环，也就是作为周转来考察的。这里一方面指出了，资本的不同组成部分（固定资本和流动资本）怎样在不同的时间以不同的方式完成各种形式的循环；另一方面又研究了决定劳动期间和流通期间长短不同的各种情况。
- id: social_reproduction
  label: 社会总资本再生产
  source: 第二卷 第三篇
  summary: >-
    社会总资本再生产的核心问题是社会总产品的实现问题——社会总产品的各个部分如何在价值上得到补偿、在实物上得到替换。马克思将社会生产划分为两大部类（生产资料和消费资料），指出两大部类之间必须保持一定的比例关系。简单再生产的平衡条件是：I(v+m)=IIc。
  quote: 社会年产品是由两个部类构成的；第一部类包括生产资料，第二部类包括消费资料。二者必须分别加以论述。
- id: profit_rate
  label: 利润与利润率
  source: 第三卷 第一篇
  summary: >-
    剩余价值作为全部预付资本的观念上的产物，取得了利润这个转化形式。利润率是剩余价值与总资本的比率，总是低于剩余价值率。利润形式掩盖了剩余价值的真正来源。商品价值公式由W=c+v+m转化为W=k+m（成本价格+剩余价值）。
  quote: 剩余价值，作为全部预付资本的这样一种观念上的产物，取得了利润这个转化形式。
- id: average_profit_production_price
  label: 利润率平均化与生产价格
  source: 第三卷 第二篇 第九章
  summary: >-
    不同生产部门的不同利润率通过竞争而平均化为一般利润率。生产价格=成本价格+平均利润。在资本主义发达阶段，商品不再按价值出售，而是按生产价格出售。生产价格是价值的转化形式，全社会商品的生产价格总额等于价值总额。
  quote: >-
    求出不同生产部门的不同利润率的平均数，把这个平均数加到不同生产部门的成本价格上，由此形成的价格，就是生产价格。……因此，商品的生产价格，等于商品的成本价格加上依照一般利润率按百分比计算应加到这个成本价格上的利润，或者说，等于商品的成本价格加上平均利润。
- id: falling_rate_profit
  label: 利润率下降趋势规律
  source: 第三卷 第三篇 第十三章
  summary: >-
    随着资本主义发展和社会劳动生产率的提高，资本有机构成不断提高，一般利润率呈下降趋势。但这不意味着利润量减少——资本总量的增长可以抵消利润率的下降，使利润量绝对增加。这个规律揭示了资本主义生产方式的历史局限性。
  quote: 因此，一般利润率日益下降的趋势，只是劳动的社会生产力的日益发展在资本主义生产方式下所特有的表现。
- id: differential_absolute_rent
  label: 级差地租与绝对地租
  source: 第三卷 第六篇
  summary: >-
    级差地租是由于土地的自然肥力和位置的差异以及在同一土地上连续投资的劳动生产率不同而产生的超额利润转化为地租。绝对地租源于土地私有权的垄断——使农产品能够按照高于生产价格的价值出售，其差额转化为地租。
  quote: >-
    级差地租是由投在最坏的无租土地上的资本的收益和投在较好土地上的资本的收益之间的差额决定的。……绝对地租来源于土地所有权的垄断，它使农产品可以按高于生产价格的价值出售，从而形成超额利润转化为地租。
- id: trinity_formula
  label: 三位一体公式
  source: 第三卷 第七篇 第四十八章
  summary: >-
    资本—利润（企业主收入加上利息），土地—地租，劳动—工资，是庸俗经济学的核心教条。马克思批判指出，这一公式掩盖了利润和地租都来源于雇佣工人的无酬劳动这一事实，把社会关系物化为了自然关系，是资本主义生产关系的最彻底的拜物教化。
  quote: >-
    资本—利润（企业主收入加上利息），土地—地租，劳动—工资，这就是把社会生产过程的一切秘密都包括在内的三位一体的公式。……在这个公式中，资本、土地和劳动分别表现为利润（利息）、地租和工资的源泉。……这是一个着了魔的、颠倒的、倒立着的世界。在这个世界里，资本先生和土地太太，作为社会的人物，同时又直接作为单纯的物，在兴妖作怪。
- id: working_day
  label: 工作日与阶级斗争
  source: 第一卷 第八章
  summary: >-
    工作日斗争是工人阶级与资产阶级围绕劳动时间界限进行的阶级斗争。资本家追求工作日的无限延长以榨取更多绝对剩余价值，工人则要求将工作日限制在正常范围以保护自身健康。这场斗争体现了工人阶级从「自在阶级」向「自为阶级」的转变。
  quote: >-
    资本家要坚持他作为买者的权利，他尽量延长工作日，如果可能，就把一个工作日变成两个工作日。另一方面，这个已经卖出的商品的独特性质给它的买者规定了一个消费的界限，并且工人也要坚持他作为卖者的权利，他要求把工作日限制在一定的正常量内。于是这里出现了二律背反，权利同权利相对抗，而这两种权利都同样是商品交换规律所承认的。在平等的权利之间，力量就起决定作用。
- id: cooperation_division_machinery
  label: 协作、分工与机器大工业
  source: 第一卷 第十一至十三章
  summary: >-
    协作是许多人在同一生产过程中有计划地协同劳动，创造超越个人力量之和的「集体力」。工场手工业以分工为基础，将劳动分解为局部操作，为机器大工业准备了物质条件。机器大工业以机器代替手工工具，以自然科学的应用代替经验成规，使工人成为机器的附属品，加深了资本对劳动的统治。
  quote: >-
    许多人在同一生产过程中，或在不同的但互相联系的生产过程中，有计划地一起协同劳动，这种劳动形式叫作协作。……工场手工业通过手工业活动的分解，劳动工具的分化，以及局部工人的形成及其组合，为机器大工业创造了物质前提。……作为工业革命起点的机器，是用一个机构代替只使用一个工具的工人。
- id: economic_crisis
  label: 经济危机
  source: 第三卷 第三篇及第一卷相关论述
  summary: >-
    资本主义经济危机的根本原因是生产社会化与资本主义私有制之间的基本矛盾。一方面资本主义有无限扩大生产的趋势，另一方面劳动者的购买力因受剥削而有限，相对缩小，导致生产过剩。危机是这种矛盾的强制性解决。
  quote: 一切现实的危机的最后原因，总是群众的贫穷和他们的消费受到限制，而与此相对比的是，资本主义生产竭力发展生产力，好像只有社会的绝对的消费能力才是生产力发展的界限。

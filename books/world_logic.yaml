source: 世界的逻辑（大卫·哈维）— 完整知识引擎模块
description: 基于《世界的逻辑：如何让我们生活的世界更理性、更可控》逐章提取
core_concepts:
- id: dialectics
  label: 辩证分析
  source: 世界的逻辑 — 第一章/第七章
  summary: >-
    基于过程的辩证法，反对笛卡儿式割裂法。辩证思考关注过程、流程和关系，其次才是具体元素和结构。事物内部的矛盾和冲突推动变化，辩证法可在过程流动中找出产生巨大变革的特殊「时刻」。
  quote: 辩证思考最关注的是对过程、流程以及关系的理解，其次才是对具体元素、事物、结构和有组织系统的分析。后者无法独立支持、支撑甚至产生这些具体事物的流程。
- id: contradiction_types
  label: 矛盾类型（结构性 vs 偶发性）
  source: 世界的逻辑 — 第三章
  summary: >-
    结构性矛盾源于资本积累的内在逻辑（如过度积累趋势），是制度必然产生的。偶发性矛盾是在特定条件下产生的冲突，可局部解决。危机分为局部危机、轮换危机（领域/地理转换）和全球危机。
  quote: >-
    局部危机，即影响具体的行业地区或若干中介机构……轮换危机，即要求对资本流进行重大重组或重构……全球危机，即对资本主义系统内所有行业、领域和地区都能产生程度不一的影响。
- id: time_space_compression
  label: 时空压缩
  source: 世界的逻辑 — 第二章/第五章
  summary: >-
    资本流通使得时间成为人类社会的基本维度。马克思'用时间消灭空间'意味着资本力求超越一切空间界限，通过交通和通信技术的改善缩短空间距离。但空间障碍越小，资本对空间差异越敏感，各地越有动机打造差异来吸引资本。
  quote: >-
    资本一方面要力求摧毁交往即交换的一切地方限制，夺得整个地球作为它的市场，另一方面，它又力求用时间去消灭空间……资本越发展，从而资本借以流通的市场……越扩大，资本同时也就越是力求在空间上更加扩大市场，力求用时间去更多地消灭空间。
- id: capital_circuits
  label: 资本三级循环
  source: 世界的逻辑 — 第三章
  summary: >-
    第一循环：生产过程中的资本流通，包括绝对/相对剩余价值生产。第二循环：资本流入固定资本和消费资金（建筑环境、基础设施等长期投资）。第三循环：科技投资和劳动力再生产相关的社会投资（教育、医疗等）。过度积累在第一循环产生，可暂时通过转入第二、三循环缓解。
  quote: 资本的第二循环……固定资产和消费资金的资本流入……第一循环中常常出现的资本过度积累有了解决之道，一种可行但临时的方法就是将过剩资本投入到第二循环。
- id: uneven_development
  label: 不平衡地理发展
  source: 世界的逻辑 — 第二章/第九章
  summary: >-
    资本主义始终处于生产集中与空间分散两股力量的张力之下。资本积累既要求生产集中在城市中心以降低周转时间，又要求地理扩张以寻找新市场和新资源。资本总是创造出自己的物质景观，但某时刻的景观总会在未来被摧毁。
  quote: >-
    资本总是会创造出自己的物质景观，但由于资本总是要通过地理扩张和时间重配来解决经常出现的过度积累问题，某一时刻的景观总是会在未来某一时刻被摧毁。这就是资本主义物理和社会景观发展过程中的创造性破坏历史烙印。
- id: accumulation_by_dispossession
  label: 掠夺式积累
  source: 世界的逻辑 — 第九章
  summary: >-
    哈维的核心概念。指资本主义通过暴力、欺诈和掠夺手段进行的持续积累，并非仅限原始积累阶段。包括土地商品化和私有化、公共资产侵吞、金融投机、知识产权垄断、生物剽窃等。在扩大再生产出现过度积累危机时更为明显。
  quote: >-
    马克思所描述的所有特征在资本主义历史地理中依然存在……信贷系统和金融资本始终是掠夺、欺诈和盗窃的重要工具。此外还有股票推销、庞氏骗局、借助通胀消灭结构资产价值、通过并购侵夺资产等。
- id: right_to_the_city
  label: 城市权利
  source: 世界的逻辑 — 第十章/第十一章
  summary: >-
    城市权利不是排他权利，而是集体权利。涵盖所有参与城市日常生产的工人——建筑工人、护工、教师、维修工人、司机、餐饮工作者等。城市生产者必须重新夺回他们对自己集体创造的城市的权利。
  quote: >-
    城市权利并不是排他权利，而是集体权利……城市生产者必须站起来并重新夺回他们对自己集体创造的城市的权利。城市生活的变革以及对城市化生产过程中剥削关系的消灭或许是走向反对资本主义转型的唯一道路。
- id: spatio_temporal_fix
  label: 时空修复
  source: 世界的逻辑 — 第九章
  summary: >-
    在某地理范围内的过剩资本和劳动力可通过(1)对长期资本项目投资进行时间再配置、(2)地理扩张进行空间再配置、或(3)两者结合来吸收。但时空办法内在矛盾：资本在某时点创造的物质景观终会被摧毁以为新积累开辟空间。
  quote: >-
    某特定地理范围的过度积累意味着形成了过剩劳动力（失业率上升）和过剩资本……这些过剩可通过如下方式被吸收：（1）通过对长期资本项目开展投资来进行时间再配置……（2）空间再配置……（3）将前面两种调整综合运用。
- id: militant_particularism
  label: 斗争特殊主义
  source: 世界的逻辑 — 第八章
  summary: >-
    雷蒙德·威廉斯概念，哈维用于分析工人运动。工人运动最初为捍卫具体场所的特殊利益而斗争，但其主张可普遍化为争取普遍利益的运动。但难点在于从本地经验到普遍意义的扩展存在障碍，容易陷入保守。
  quote: >-
    工人阶级自我组织的独特和非凡特点就是要以特殊方式将具体斗争与一般斗争相联系。作为工人运动，最初其主张好像总是为了捍卫和增进特殊利益，但一旦综合起来看，这些运动又完全是在争取普遍利益。
- id: cartesian_critique
  label: 笛卡儿思想批判
  source: 世界的逻辑 — 引言/第七章
  summary: >-
    哈维批判将自然与文化人为割裂的笛卡儿式僵化方法。这种形而上学割裂法将「社会」和「自然」视为两个封闭系统，从根本上既是反生态的，也是许多生态问题的根源。辩证本体论强调过程、关系和变化是常态。
  quote: 两派观点都以笛卡儿式的僵化方法将自然与文化人为割裂，但在现实世界的土地和街巷中却不可能找到自然与文化的分界点。这种形而上学的割裂法就是重大的错误。
- id: financial_crisis_urban_roots
  label: 金融危机的城市根源
  source: 世界的逻辑 — 第十章
  summary: >-
    房地产市场崩盘是2008年危机的核心。资本第二循环（建筑环境投资）中的过度积累、虚拟资本膨胀、住房抵押贷款证券化和掠夺性贷款实践，使危机从美国城市房地产蔓延至全球。中国的大规模城市化成为全球经济的暂时稳定器。
  quote: >-
    房地产市场和建筑环境投资是当代经济的重要组成部分，而在此过程中形成的高额债务对全球资本主义体系的稳定都构成了重大威胁。正如我在本文中所指出的，中国对建筑环境的投资是自2008年以来全球资本主义体系的重要稳定器。
- id: eco_social_politics
  label: 生态-社会项目的统一
  source: 世界的逻辑 — 第七章
  summary: >-
    所有生态项目都是政治经济项目，反之亦然。货币在环境问题上具有根本缺陷——货币是天生的平等派，将丰富多彩的使用价值还原为统一货币标准。可持续性对不同人意味着不同的事。
  quote: 所有生态项目（观点）都是政治经济项目（观点），反之亦然。有关生态问题的讨论从来不能完全独立于社会条件，正如社会政治问题也从来都与自然生态相关。
- id: seven_activity_spheres
  label: 七大活动层面分析框架
  source: 世界的逻辑 — 第十一章
  summary: >-
    哈维提出资本主义演化中的7个活动层面：技术和组织形式、社会关系、制度和体制安排、生产和劳动过程、自然关系、日常生活和人类物种的再生产、对世界的思想观念。各层面共同演化、相互交织，没有一个居支配地位。
  quote: 技术揭示出人对自然的能动关系、人的生活的直接生产过程，以及人的社会生活条件和由此产生的精神观念的直接生产过程。
- id: urban_entrepreneurialism
  label: 城市治理企业主义
  source: 世界的逻辑 — 第六章
  summary: >-
    20世纪70年代以来，城市治理从管理主义转向企业主义。公私合作成为核心模式，城市间竞争加剧，各城市为吸引资本而打造有利的商业氛围。但这一转变扩大了贫富分化，公共部门承担风险而私人享受利益。
  quote: >-
    城市治理企业主义的兴起与20世纪70年代初以来资本主义发展形式和方式的变化并没有任何矛盾之处。事实上，城市政治的变迁以及企业主义的兴起大大推动了资本积累方式的转变。

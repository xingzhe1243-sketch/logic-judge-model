source: 论证是一门学问 (Anthony Weston, 第5版)
description: 论证规则大全——50条规则覆盖举例/类比/权威/因果/演绎/扩展/议论写作/口头论证/公共辩论
general_rules:
- '规则1: 区分前提和结论 — 用''因为''标记前提，''所以''标记结论'
- '规则2: 呈现观点自然有序 — 把结论放在开头或结尾'
- '规则3: 从可靠前提出发 — 前提要真实可接受'
- '规则4: 具体简明 — 避免抽象模糊的语言'
- '规则5: 立足实据 — 避免诱导性/情感化语言'
- '规则6: 用词前后一致 — 同一术语在全文中保持含义稳定'
argument_types:
  举例论证:
    description: 用具体例子支持概括性结论
    rules:
    - '规则7: 在有争议的概括中给出不止一个例子'
    - '规则8: 例子要具有代表性'
    - '规则9: 考察反面例证的强度'
    - '规则10: 用例子推翻有争议的概括(一个反例就够了)'
  类比论证:
    description: 通过相似性推导
    rules:
    - '规则11: 类比需要真正可比 — 共享特性的重要性要足够大'
    - '规则12: 检查反面的重要差异特征'
  诉诸权威:
    description: 引用权威意见
    rules:
    - '规则13: 引用权威前先确认权威在相关领域'
    - '规则14: 权威意见须有共识而非一家之言'
    - '规则15: 权威也难免犯错 — 权威意见不是最终结论'
    - '规则16: 诉诸权威不是诉诸''大家''(公众意见)'
  因果论证:
    description: 建立因果关系
    rules:
    - '规则17: 解释因果关系需要先解释关联机制'
    - '规则18: 因果论证始于关联 — 建立可靠的相关性'
    - '规则19: 一种关联有多种解释 — 考虑替代原因'
    - '规则20: 寻求最有可能的解释 — Occam''s Razor'
    - '规则21: 情况有时很复杂 — 避免过度简化'
  演绎论证:
    description: 三段论推理
    rules:
    - '规则22: 肯定前件有效: 如果p则q, p, 所以q'
    - '规则23: 肯定后件无效: 如果p则q, q, 所以p(无效)'
    - '规则24: 否定后件有效: 如果p则q, 非q, 所以非p'
    - '规则25: 选言三段论: p或q, 非p, 所以q'
    - '规则26: 条件证明: 要证明如果p则q, 先假设p再推导q'
    - '规则27: 归谬法: 要证明p假, 假设p真推出矛盾'
    - '规则28: 多步论证: 复杂论证由多个简单步骤构成'
  扩展论证:
    description: 构建复杂论证结构
    rules:
    - '规则29: 将论证分环节呈现'
    - '规则30: 探讨各环节间的逻辑关系'
    - '规则31: 对关键前提给出专门论证'
    - '规则32: 考虑反驳意见'
    - '规则33: 就''弱''的环节多做说明'
  议论写作:
    description: 论证性写作技巧
    rules:
    - '规则34: 开篇点题 — 在开头给出结论或主张'
    - '规则35: 主张要明确可操作'
    - '规则36: 论证结构遵循''观点→论证→总结'''
    - '规则37: 处理反对意见 — 驳论增强说服力'
    - '规则38: 避免过分含糊或夸张 — 限定表述'
    - '规则39: 行文简洁 — 删掉不必要的内容'
  口头论证:
    description: 口头表达中的论证
    rules:
    - '规则40: 口头论证要有明确结构 — 结论先行'
    - '规则41: 用连接词标记论证结构(因为/所以/第一/第二)'
    - '规则42: 口头论证要简洁 — 句式短而清晰'
    - '规则43: 语速/停顿/重复帮助听众跟上'
    - '规则44: 视觉辅助工具增强论证清晰度'
  公共辩论:
    description: 辩论场景中的论证
    rules:
    - '规则45: 阐明分歧点 — 找出真正的争议核心'
    - '规则46: 论证是对话不是对抗 — 聚焦观点而非人身'
    - '规则47: 承认对方合理之处 — 增强论证可信度'
    - '规则48: 寻求共识 — 从共同基础出发'
    - '规则49: 保持礼貌 — 理性讨论的环境至关重要'
    - '规则50: 允许反思空间 — 观点可能随论证而改变'
appendices:
  common_fallacies:
  - '诉诸无知: 无法证伪所以真'
  - '诉诸怜悯: 用同情代替逻辑'
  - '诉诸群众: 多数人的意见不等于真理'
  - '以偏概全: 样本不具有代表性'
  - '忽略替代解释: 只考虑一种可能性'
  - '诱导性语言: 暗示性标签预设立场'
  - '循环论证: 前提包含待证明的结论'
  - '肯定后件: 逻辑形式无效'
  - '否定前件: 逻辑形式无效'
  definition_methods:
    词典定义: 查阅词典的通用定义
    操作性定义: 根据可观察可测量的操作来定义
    分类式定义: 按大类+属差的方式定义

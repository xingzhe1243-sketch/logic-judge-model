source: 明智行动的艺术 + 清醒思考的艺术
description: >-
  Die Kunst des Klugen Handelns + Die Kunst des Klaren Denkens — Rolf Dobelli Two books combined: - 明智行动的艺术
  (52 chapters on action errors)
core_concepts:
- id: survivorship_bias
  label: 幸存偏误
  source: 清醒思考的艺术 第1章 幸存偏误
  summary: 由于日常生活中更容易看到成功、看不到失败，人们会系统性地高估成功的希望。每位成功的作家背后都有100个作品卖不出去的作家，但我们总是听到成功者的故事。
  quote: >-
    幸存偏误是指：由于日常生活中更容易看到成功、看不到失败，你会系统性地高估成功的希望。不了解现实的你（与雷托一样）对成功抱有一种幻想，认识不到成功的概率有多微弱。每位成功的作家背后都有100个作品卖不出去的作家，每个作品卖不出去的作家背后又有100个找不到出版社的作者，每个找不到出版社的作者背后又有数百个抽屉里沉睡着刚动笔的手稿的写作爱好者。
- id: swimmers_body_illusion
  label: 游泳选手身材错觉
  source: 清醒思考的艺术 第2章 游泳选手身材错觉
  summary: 人们常将选择标准与结果混淆。职业游泳者体形完美，不是因为锻炼充分，而是因为他们拥有这样的身材才成为出色的游泳选手。美丽是一种选择标准，而不是结果。
  quote: >-
    职业游泳者体形完美，并不是因为他们锻炼充分。实际情况正好相反：他们之所以成为出色的游泳选手，是因为他们拥有这样的身材。他们的身躯是一种选择标准，而不是他们运动的结果。
- id: overconfidence_effect
  label: 过度自信效应
  source: 清醒思考的艺术 第3章 过度自信效应
  summary: 人们会系统性地高估自己的学识和预测能力——而且高估得很厉害。过度自信令你忽视你真正知道的东西与你已知的东西之间的区别。对专家的影响比对非专家的影响还严重。
  quote: >-
    我们总是系统性地高估我们的学识和预测能力——而且高估得很厉害。对于过度自信效应，重要的不是单个估计是否正确。过度自信会令你忽视你真正知道的东西与你已知的东西之间的区别。真正令人吃惊的是：过度自信效应对专家的影响比对非专家的影响还严重，一位经济学教授在预测油价的5年走势时会与非经济学家一样出错。
- id: herd_mentality
  label: 从众心理
  source: 清醒思考的艺术 第4章 从众心理
  summary: >-
    只要别人做什么我也跟着做什么，我的行为就是正确的。越多的人认为一个想法正确，这个想法就更加正确——这当然是荒谬的。从众心理源于进化生存机制，但今天常常导致非理性行为。
  quote: >-
    从众心理（有时被含糊地称为随大溜）是指：只要别人做什么我也跟着做什么，我的行为就是正确的。换言之，越多的人认为一个想法正确，这个想法就更加正确——这当然是荒谬的。
- id: sunk_cost
  label: 纠缠于沉没成本
  source: 清醒思考的艺术 第5章 纠缠于沉没成本
  summary: 人们会因为已经投入的时间、金钱、能量而难以放手，即使客观来看坚持下去毫无意义。理性的决定意味着忽视已经投入的成本。
  quote: >-
    在我们已经投入特别多的时间、金钱、能量、爱等因素之后，沉没成本令人难以放手、难以释怀。于是已经投资的钱就成了继续做下去的理由，即使客观来看坚持下去毫无意义。投资越多，沉没成本就越大，将项目继续做下去的理由就越充分。
- id: confirmation_bias
  label: 确认偏误
  source: 清醒思考的艺术 第7章 确认偏误之一
  summary: 确认偏误是所有思维错误之父——它倾向于这样诠释新信息，让它们与我们现有的理论、世界观和信念相兼容。我们过滤掉与现有观点相矛盾的新信息，只看到想看到的证据。
  quote: >-
    确认偏误是所有思维错误之父——它倾向于这样诠释新信息，让它们与我们现有的理论、世界观和信念相兼容。换句话说：我们过滤掉与我们的现有观点相矛盾（因此被称作反驳证据，不过它缺少合适的德语表达）的新信息。
- id: authority_bias
  label: 权威偏误
  source: 清醒思考的艺术 第9章 权威偏误
  summary: >-
    面对权威，人们会降低独立思考的能力。即使权威显然出错，我们也会服从。米尔格拉姆实验证明了权威对行为的强大影响——半数以上受试者会将电压升到最高，纯粹是在服从权威。
  quote: 面对专家意见时我们往往会比面对其他意见粗心许多。还有，我们会服从权威，哪怕是在理性或道德上毫无意义的地方。这就是权威偏误。
- id: contrast_effect
  label: 对比效应
  source: 清醒思考的艺术 第10章 对比效应
  summary: 当我们同时面对某种难看、便宜、小的东西时，就会判断出另一种东西更漂亮、更贵、更大。我们很难作出绝对的判断。对比效应是最常见的思维错误之一。
  quote: 当我们同时面对某种难看、便宜、小的东西时，我们就会判断出另一种东西更漂亮、更贵、更大。我们很难作出绝对的判断。
- id: availability_bias
  label: 现成偏误
  source: 清醒思考的艺术 第11章 现成偏误
  summary: 我们依据现成的例子来想象世界，高估了壮观、华丽或大声事件的概率，低估了无声、无形事件的概率。宁可用一张错误的地图，也不愿没有地图。
  quote: 现成偏误是指：我们依据现成的例子来想象世界。这当然是愚蠢的，因为外界现实中的某种东西不会因为我们更容易想到而出现得更频繁。
- id: story_bias
  label: 故事偏误
  source: 清醒思考的艺术 第13章 故事偏误
  summary: 我们用故事扭曲和简化现实，排斥不适合编进故事的一切。我们喜欢听故事，不喜欢听抽象事实。这导致为了不重要的方面，重要方面被忽视了。
  quote: 故事偏误是指：用故事扭曲和简化现实，它们排斥不合适编进故事的一切。
- id: hindsight_bias
  label: 事后诸葛亮偏误
  source: 清醒思考的艺术 第14章 事后诸葛亮偏误
  summary: 事后回顾时一切都显得是可以理解的、不可避免的。这让我们相信自己是很好的预言家，而事实却不是这样。它会误导我们作出错误的决定。
  quote: 事后诸葛亮偏误绝对是最顽固的思维错误之一，可以恰如其分地称为"我早知道现象"，即事后回顾时一切都显得是可以理解的、不可避免的。
- id: drivers_knowledge
  label: 司机的知识
  source: 清醒思考的艺术 第15章 司机的知识
  summary: 芒格区分了两种知识：真知识来自投入大量时间和思考的人；司机知识来自那些装得好像知道的人。真正有知识的人知道能力范围的界线，而司机只会高谈阔论。
  quote: >-
    查理·芒格是全球最优秀的投资家之一，普朗克的故事我就是从他那里听来的。他认为知识有两种：一种是真知识，来自那些投入大量时间和思考以获得知识的人们；另一种就是司机的知识，按芒格故事里的意思，司机是指那些装得好像他们知道的人。
- id: incentive_superresponse
  label: 激励过敏倾向
  source: 清醒思考的艺术 第17章 激励过敏倾向
  summary: 人们会对激励做出反应，但往往是对激励本身做出反应，而不是对激励背后的目的。一旦有激励加入或改变，人们就会迅速而剧烈地改变自己的行为。
  quote: >-
    人们会对激励机制做出反应。这不奇怪。人都会做对自己有益的事情。令人吃惊的是两个次要方面：第一，一旦有激励加入游戏或改变了激励，人们就会迅速而剧烈地改变自己的行为；第二，人们是对激励做出反应，而不是对激励背后的目的做出反应。
- id: regression_to_mean
  label: 回归均值
  source: 清醒思考的艺术 第18章 回归均值
  summary: 极端成绩与不太极端的成绩总是来回交替。剧烈的背痛很有可能不用治疗也会减弱；高尔夫球成绩不用额外上课也会重新变好。人们经常错误地将自然回归归功于干预措施。
  quote: 假定你正在经历一次破纪录的严寒，接下来的几天气温就极有可能回升——朝着月度均值的方向。每逢酷暑、干旱和雨季时也是这样，气候会围绕一个均值波动。
- id: outcome_bias
  label: 结果偏误
  source: 清醒思考的艺术 第20章 结果偏误
  summary: 我们倾向于以结果判断决定——而不是当时作决定的过程。结果差并不一定意味着当时所作的决定不对，反之亦然。切勿以结果判断决定。
  quote: 猴子的故事说明了结果偏误：我们倾向于以结果判断决定——而不是当时作决定的过程。这种思维错误又名史学家错误。
- id: halo_effect
  label: 光环效应
  source: 清醒思考的艺术 第39章 光环效应
  summary: 我们让某一个方面照花了眼睛，并由此推及全貌。漂亮的人被认为更可爱、更诚实、更聪颖。光环效应是广告业的核心工具，也是无意识的认知偏误。
  quote: 光环效应是指：我们让某一个方面照花了眼睛，并由此推及全貌。
- id: alternative_paths
  label: 替代途径
  source: 清醒思考的艺术 第40章 替代途径
  summary: >-
    替代途径是指所有同样可能发生但没有发生的事情。我们容易忽视风险背后的替代途径，导致对成功的误判。通过冒险途径获得的1000万欧元，价值远不及通过辛苦劳动挣到的1000万欧元。
  quote: >-
    替代途径是无形的，因此我们很少会想到它们。任何玩垃圾债券、期权和信用违约互换，挣到数百万欧元的人，都不该忘记，他同时有一堆危险的替代途径，它们会直接将他拖进毁灭。
- id: fundamental_attribution_error
  label: 基本特征谬误
  source: 清醒思考的艺术 第37章 基本特征谬误
  summary: 系统性地高估人的影响，在解释某些东西时低估情境因素。我们将战争的罪责推给个人，在企业老板身上寻找业务好坏的原因，而忽视了更大的系统因素。
  quote: 基本特征谬误是指，系统性地高估人的影响，在解释某些东西时低估情境因素。
- id: endowment_effect
  label: 禀赋效应
  source: 清醒思考的艺术 第23章 禀赋效应
  summary: 我们感觉我们拥有的东西比我们没有拥有的更有价值。当我们出售某物时，我们要求的钱多于我们自己愿意为它支付的钱。这导致我们死抱着某种东西不放。
  quote: 禀赋效应。我们感觉我们拥有的东西比我们没有拥有的更有价值。换句话说：当我们出售某物时，我们要求的钱多于我们自己愿意为它支付的钱。
- id: framing
  label: 框架效应
  source: 清醒思考的艺术 第43章 框架效应
  summary: 同样的事情可以有多种表达方式，视表达方式的不同，我们会对同样的事情做出不同的反应。通过改变措辞，人们可以改变对同一事实的判断。
  quote: 框架效应是指：视表达方式的不同，我们会对同样的事情做出不同的反应。
- id: action_bias
  label: 行动偏误
  source: 清醒思考的艺术 第44章 行动偏误
  summary: 即使毫无用处，也要采取行动。在不明情形下我们会产生要做点什么的冲动，社会更喜欢下意识的行动，而不喜欢有意义的等待。在投资时，行动与成绩没有相互关系。
  quote: 行动偏误：即使毫无用处，也要采取行动。
- id: because_justification
  label: 用理由辩护
  source: 明智行动的艺术 第1章 用理由辩护
  summary: 人类对"因为"是上瘾的，我们需要这个词，即使它后面跟着的内容并非无懈可击。只要有"因为"这个简单的词就够了——理由是否充分并不那么重要。
  quote: 如果我们给自己的行为一个理由，就会得到更多的理解和支持。令人吃惊的是，理由是否充分并不那么重要，只要有"因为"这个简单的词就够了。
- id: decision_fatigue
  label: 选择疲劳症
  source: 明智行动的艺术 第2章 选择疲劳症
  summary: 作决定是会令人疲惫的。意志力就像电池，在一段时间之后它需要充电。选择疲劳之后，人们会对冲动消费更没有抵抗力，决策质量显著下降。
  quote: >-
    作决定是会令人疲惫的。每个为笔记本电脑进行上网配置的人，或组织过类似团体旅行等集体活动的人都会了解这种感觉：在所有的比较、权衡和决定之后人会感到精疲力竭。科学上称之为"选择疲劳症"。
- id: motivation_crowding
  label: 激励排挤效应
  source: 明智行动的艺术 第5章 激励排挤效应
  summary: 当人们不是为了挣钱去做一件事时，付钱给他们会破坏其做事的意愿。金钱上的激励会排挤掉非金钱意义上的动力。幼儿园对晚接家长收费后，晚接现象反而增加了。
  quote: 科学上称这种现象为"激励排挤效应"。当人们不是为了挣钱去做一件事时，付钱给他们会破坏其做事的意愿，换句话说就是金钱上的激励会排挤掉非金钱意义上的动力。
- id: effort_justification
  label: 劳力辩证现象
  source: 明智行动的艺术 第10章 劳力辩证现象
  summary: 你在一件事上投入了很多精力，便会对其结果期望过高。入会测试越残酷，申请人形成的自豪感就越强。自己组装的宜家家具会比昂贵设计师作品更有价值感。
  quote: '"劳力辩证现象"的受害者。这一现象是说，你在一件事上投入了很多精力，便会对其结果期望过高。'
- id: default_effect
  label: 默认效应
  source: 明智行动的艺术 第32章 默认效应
  summary: 标准的设置（即默认设置）是有吸引力的，是令人感到舒服的。人们有极为明显的倾向去牢牢抓住现有事物，即使这会带来不利的影响。
  quote: >-
    标准的设置（即默认设置）是有吸引力的，是令人感到舒服的。这就是我对餐厅自酿酒和苹果手机功能的态度。大多数人都会习惯于标准的内容，比如汽车买家会选择默认的颜色——如果每本宣传手册、每段视频和每个广告都是煤灰色，那么决定买这一默认色的汽车买家会占大多数。
- id: black_swan
  label: 黑天鹅效应
  source: 明智行动的艺术 第26章 黑天鹅效应
  summary: 黑天鹅是指会给生活、财务或企业带来意想不到的巨大影响的事情。因为大脑是为适应石器时代生活而进化的，而现代生活中黑天鹅事件频繁出现，我们却难以预见。
  quote: '"黑天鹅"指的是会给你的生活（或者财务状况、健康）或给一个企业等带来意想不到的巨大影响的事情。"黑天鹅"有积极的影响，也有消极的影响。'
- id: planning_fallacy
  label: 计划谬误
  source: 明智行动的艺术 第44章 计划谬误
  summary: 人们总是系统性地高估完成任务的速度。尽管有过去的经验，仍然相信这次可以例外。更细致的计划反而会使问题更严重，因为对意外情况的考虑会更少。
  quote: 尽管你知道之前的大多假设都太过乐观，而你却依然严肃地相信，今天可以例外地完成清单上的任务。诺贝尔奖得主丹尼尔·卡尼曼将这种现象称为"计划谬误"。
- id: man_with_hammer
  label: 专业偏见
  source: 明智行动的艺术 第45章 专业偏见
  summary: 如果你唯一的工具就是把锤子，那么你会把所有问题都看成钉子。人们经过培训成为某个领域的专家后，就会到处将所有遇到的问题用这个领域的思维模式来解决。
  quote: 马克·吐温曾说："如果你唯一的工具就是把锤子，那么你会把所有问题都看成钉子。"这句话是对"专业偏见"最好的概括。
- id: single_cause_fallacy
  label: 单一因果谬误
  source: 明智行动的艺术 第50章 单一因果谬误
  summary: 人们总是试图将事情归结到一个原因上，而实际上复杂事件有上百个、上千个甚至无数个原因。寻找一个替罪羊的狩猎极适合权力的行使。
  quote: >-
    "当苹果成熟，它会从树上掉下来，为什么会掉下来呢？因为地心引力？因为它的茎干枯了？它的果肉腐烂了？因为它太沉了？因为风把它吹下来了？或者因为树下的男孩想吃它？这里面没有一个唯一的原因，而是所有原因综合所致……"
- id: news_illusion
  label: 新闻错觉
  source: 明智行动的艺术 第52章 新闻错觉
  summary: 新闻对于精神的影响就像糖对于身体的影响一样——可口、容易消化，但长期下来却是有害的。关注新闻不是竞争优势，而是劣势。
  quote: 新闻对于我们的精神的影响，就像糖对于身体的影响一样：新闻是可口的，容易消化的——但长期下来却是有害的。
- id: introspection_illusion
  label: 内省错觉
  source: 明智行动的艺术 第17章 内省错觉
  summary: 人们相信通过窥探内心可以得到真相，但内省是不可靠的。我们窥探自己的内心时，会虚构出一些内容。越是你深信不疑的事情，你越是要多一些怀疑。
  quote: 这种相信通过窥探内心可以得到真相的情况被称之为"内省错觉"（德文有时翻译成"选择性盲目"或"自我观察错觉"）。
- id: information_bias
  label: 信息偏倚
  source: 明智行动的艺术 第8章 信息偏倚
  summary: 错误地认为掌握的信息越多，做出的决定就越好。更多信息不仅是多余的，有时甚至是有害的。试着用最少的信息来生活，这样可以做出更好的决定。
  quote: 博尔赫斯的地图是"信息偏倚"这种思维错误的极端例子：即错误地认为掌握的信息越多，做出的决定就越好。
- id: contagion_fallacy
  label: 关联谬误
  source: 明智行动的艺术 第3章 关联谬误
  summary: 人与物之间存在一种非理性的关联，即使关联早已不存在。人们不愿穿希特勒穿过的羊毛衫，即使它已重新洗好。这种不可理解的力量不容忽视。
  quote: 这种人与物之间的关联——即便关联早已不存在或以类似照片这种非具体的形式存在——是不容忽视的。这就是关联谬误。
- id: zeigarnik_effect
  label: 蔡格尼克记忆效应
  source: 明智行动的艺术 第46章 蔡格尼克记忆效应
  summary: 未完成的任务总会出现在我们的意识里，不会放过我们。但一个明确的计划就足以将它们从大脑中清除——不必真正完成任务。
  quote: >-
    未完成的任务一直会追着我们不放，直到我们有了明确的完成任务的计划。布尔玛·蔡格尼克误以为人们一定要完成任务才能将其从大脑中清除，但这不是必须的，一个很好的计划就足够了。
- id: skill_illusion
  label: 能力错觉
  source: 明智行动的艺术 第47章 能力错觉
  summary: 运气比实力更有决定性。能力和勤劳不是决定能否成功的条件——它们是必要的，但不是决定性的。在金融领域，成功很大程度上是偶然的。
  quote: >-
    有多少企业的成功是靠运气，有多少是靠辛勤的工作和卓越的才华？这个问题容易引起误会，成功肯定离不开天赋，离不开辛勤的工作，但能力和勤劳不是决定能否成功的条件——它们是必要的，但不是决定性的。
- id: fear_of_regret
  label: 害怕后悔
  source: 明智行动的艺术 第33章 害怕后悔
  summary: 对后悔的害怕会使人们做出不理智的行为。人们倾向于保守地行动，不让自己的做法太偏离常规。最愚蠢的情况是将这种害怕与"最后的机会"结合起来。
  quote: 这种对后悔的害怕有时会使我们做出不理智的行为。为了今后不再有这种可怕的后悔感，我们倾向于保守地行动，也就是不让自己的做法太偏离常规。
- id: procrastination
  label: 拖延症
  source: 明智行动的艺术 第37章 拖延症
  summary: 人们不愿意做重要的事情而进行拖延，即使在新年时就下了决心都很难完成。自我控制力不可以持续一整天，它需要放松，需要充电。
  quote: >-
    科学家将这种不愿意做重要的事情而进行拖延的现象称为"拖延症"或"行动拖延"，比如去健身俱乐部、换一个更划算的个人保险、写答谢卡等等，这些事即便在新年时就下了决心都很难完成。

source: 中县干部 — 冯军旗
description: 北京大学社会学系博士学位论文：政治社会学视角下的县级干部体系研究
core_concepts:
- id: political_elite_career_analysis
  label: 政治精英生涯分析
  source: 第一章 绪论
  summary: >-
    本研究采用政治精英生涯分析法，对中国中部某县（中县）1978年以来的干部体系进行全面考察。通过对干部的构成、来源、流动轨迹、晋升机制的系统分析，揭示县级政治精英的生产和再生产机制。县级是中国政治体系的关键层级——上接中央决策，下连基层治理，是理解中国政治运作的重要窗口。
  quote: 本研究在对改革开放30年来进行总结和反思的大背景下，运用政治精英生涯分析等研究方法，对中县干部1978年以来的变迁和晋升进行多层次、多角度的考察和研究。
- id: cadre_pyramid
  label: 干部金字塔结构
  source: 第二章 构成
  summary: >-
    中县干部体系呈现为四层金字塔结构：副科级、正科级、副处级和正处级。从家庭出身来看，约60%来自农家，20%来自干部家庭——说明社会纵向流动渠道仍然存在，但干部家庭背景的优势明显。男性占90%、女性占10%，性别比例严重失衡。年龄主要分布于35-55岁区间。学历特征为「空前绝后的中专一代」——全日制教育以中专为主，在职学历教育普遍追求本科和研究生文凭。
  quote: 中县干部体系是包括副科级、正科级、副处级和正处级的四层金字塔。60%来自于农家，20%来自于干部家庭。90%是男性，10%为女性。
- id: cadre_education
  label: 干部的学历结构
  source: 第二章 构成
  summary: >-
    中县干部教育结构呈现明显的时代特征：全日制教育以中专为主体——这是文革后恢复教育时期的特定产物；在职学历教育则以本科和研究生为主，反映干部追求学历晋升的强烈动机。专业分布上，全日制教育文科、理科和文理不分各占一定比重，而在职学历教育以人文社科为主。在职学历教育的文凭贬值现象值得关注——「学历通货膨胀」催生了「权学交易」和「文凭工厂」。
  quote: 全日制教育是空前绝后的中专一代，在职学历教育则以本科和研究生为主。全日制教育文科和理科都占一定比重，文理不分的比重最大。
- id: native_place_clusters
  label: 籍贯聚集与精英集群
  source: 第二章 构成
  summary: >-
    中县干部籍贯分布呈现明显的不均衡现象：正科级以下基本都是中县人，副处级以上基本都是非中县的北山市人。在某些地域形成了集中的干部产出精英集群——特定乡镇持续产生大量干部的现象。这种籍贯聚集反映了地方精英的地域网络和「同乡抱团」的组织文化。
  quote: 在籍贯分布中，不均衡现象明显，某个地域集中产出干部的精英集群现象突出。正科级以下基本都是中县人，副处级以上基本都是非中县的北山市人。
- id: cadre_sources
  label: 干部的三个来源
  source: 第三章 进入
  summary: >-
    中县干部的来源主要有三个渠道：大中专毕业生分配（体制内招录的主渠道，强调「学用一致、专业对口」）、军队转业干部（退伍军人的体制内安置）、吸收录用（从工人、农民等社会群体中选拔）。三种来源的比例变化反映了不同时期国家对干部队伍的需求——1950-1960年代以吸收录用和军转为主，1980年代后以大中专分配为主。
  quote: 从中县干部的来源来看，主要是三个渠道：大中专毕业生分配、军队转业干部和吸收录用。
- id: teacher_to_cadre
  label: 教师从政现象
  source: 第三章 进入
  summary: >-
    教师是中县干部体系中最突出的来源群体之一。大量教师通过「以工代干」「民转公」等路径进入党政机关，形成独特的「教师从政」现象。教师的优势在于：良好的文字表达能力、组织能力、与群众打交道的能力，以及对政策的理解和执行能力。教师从政的比例之高反映了基层治理对文化素质的需求，也体现了「学而优则仕」的传统。
  quote: 教师从政则是比较鲜明的干部流动现象。
- id: cadre_children_advantage
  label: 干部子弟的「不落空」现象
  source: 第三章 进入
  summary: >-
    干部子弟在仕途竞争中享有显著优势，表现为「不落空」——即在多次选拔中总有机会获得晋升或调往更好的岗位。这种优势通过多种机制实现：内部信息（对政策动向的提前了解）、社会资本（父辈关系网络的传递）、文化资本（从小在政治环境中成长形成的言行举止）以及直接的权力运作。
  quote: 在干部流动中，干部子弟的"不落空"现象突出。
- id: re_screening
  label: 再筛选机制
  source: 第三章 进入
  summary: >-
    干部获得初职后，大多经历一个专业化的成长阶段，此间「再筛选机制」在单位流动中发挥重要作用。表现优异的干部会被调入更重要的岗位或部门，而表现不佳者则被边缘化。再筛选是干部职业生涯中的持续过程，每一次职务调整都是对干部绩效和忠诚度的再评估。
  quote: 干部获得初职后，大多经历了一个专业化的成长阶段，这其中，再筛选机制在他们的单位流动中发挥重要作用。
- id: cadre_trajectory_types
  label: 混合型与单一型轨迹
  source: 第四章 轨迹
  summary: >-
    中县干部的仕途轨迹主要有两种类型：混合型（在多个系统、多类岗位上流动——如从乡镇到县直机关再回乡镇）和单一型（长期在一个系统内晋升）。混合型占大多数，说明干部的流动与其晋升成正比——流动越频繁，晋升机会越多。干部仕途制度化和例行化趋势明显——一个干部现在的职位和年龄大致决定了其仕途的发展前景。
  quote: 从中县干部的发展轨迹来看，主要有混合型和单一型两种轨迹，并以混合型为主，说明干部的流动和他们的晋升成正比。
- id: cadre_time_intervals
  label: 仕途各阶段时间间隔
  source: 第四章 轨迹
  summary: >-
    中县干部仕途的典型时间间隔：从参加工作到晋升为副科级约需8年，副科到正科约3年，正科到副处约7年，副处到正处约7年。这些时间间隔反映了干部晋升的「隐性台阶」和年龄限制——如果在某个级别停留时间过长或年龄过大，晋升可能性会急剧下降。时间间隔的规律性表明干部晋升已经高度制度化和模式化。
  quote: 晋升为副科一般约8年，副科到正科约3年，正科到副处约7年，副处到正处约7年。
- id: party_government_spiral
  label: 政—党螺旋晋升模式
  source: 第四章 轨迹
  summary: >-
    中县干部的核心晋升模式是「政—党螺旋」——先在政府系统（行政系统）历练，然后晋升入党委系统，并不断在这两个系统之间交替螺旋上升。这一模式根源于党政分立的制度设计：政府系统负责具体行政事务，党委系统负责政治领导和干部管理。在政府系统积累了实务经验后，转入党委系统掌握更高层次的决策权。
  quote: 干部的仕途轨迹中，政—党螺旋晋升模式明显，就是先在政府系统历练，然后晋升入党委系统，并不断螺旋上升。
- id: cadre_career_critical_points
  label: 干部仕途关键节点
  source: 第四章 轨迹（综合分析）
  summary: >-
    干部晋升的关键节点包括：初职岗位决定了起步的优劣——在重要部门（如县委办、组织部、政府办）起步的干部晋升速度明显更快；35岁是科级晋升的年龄底线（过了35岁未到科级意味着晋升空间有限）；45岁是进入县处级的最后窗口；「关键的时刻遇到关键的人」——领导推荐往往在关键晋升节点起决定性作用。
  quote: 一个干部现在的职位和年龄大致决定了其仕途的发展前景。
- id: key_institutions
  label: 关键机构（干部摇篮）
  source: 第五章 摇篮
  summary: >-
    不同机构对干部仕途的影响差异极大，形成了「高进高出」的干部摇篮。中县的关键机构包括：党群系统的县委办、组织部、纪委和团县委；政府系统的政府办、林业局、教育局和农业局；公检法机构和重点镇。这些机构因其权力核心位置、接触领导的频率、掌握资源的多少而成为干部的「摇篮」。关键机构经历是晋升加速器。
  quote: 不同的机构和岗位对干部仕途影响很大，特别是关键机构和关键岗位，形成了"高进高出"的干部流，从而成为干部的摇篮。
- id: secretary_phenomenon
  label: 办公室主任与秘书现象
  source: 第五章 摇篮
  summary: >-
    办公室主任和秘书（尤其是县领导的秘书）是中县最突出的干部晋升通道。办公室主任和秘书的优势在于：与领导的日常密切接触使领导能够充分了解其能力；参与核心决策过程积累经验；在领导提拔后更容易跟随晋升或被安排到重要岗位。这一现象反映了「近水楼台先得月」的官场规律——距离权力中心越近，晋升机会越大。
  quote: 办公室主任和秘书，是干部晋升的重要岗位来源，从而形成了干部仕途中富有特色的「办公室主任现象」和「秘书现象」。
- id: youth_league_channel
  label: 共青团系统培养
  source: 第五章 摇篮
  summary: >-
    共青团（团县委）是干部培养的重要摇篮。共青团系统的优势在于：提供年轻人锻炼平台（较早参与组织协调工作）；团干部流动快、晋升通道畅通；培养政治敏感度和群众工作能力。大量现任县级领导都有共青团经历。共青团系统的特殊地位使其成为干部体系中的「黄埔军校」。
  quote: 共青团中县县委是中县青年干部的摇篮，这是由团的职能和使命决定的。
- id: performance_based_system
  label: 干部政绩型体制
  source: 第六章 政绩
  summary: >-
    1978年以来，中县实行了一种以激励为核心的干部政绩型体制。通过中心任务分解和目标考核，将干部引入「为晋升而发展」的竞赛之中。政绩型体制是中县30年巨变的制度性因素——它创造了一个以经济发展为中心的干部激励机制，使地方官员有强烈动力推动经济增长。但「凭政绩用干部」也必然导致政绩真伪问题（假政绩、注水数据）和短期行为。
  quote: 1978年以来，中县实行了一种以激励为主的干部政绩型体制。通过中心任务和目标考核，这种体制把干部引入为晋升而发展的竞赛中。
- id: dual_strong_model
  label: 乡镇党委书记晋升的「双强模型」
  source: 第六章 政绩
  summary: >-
    中县乡镇党委书记晋升的「双强模型」是指既要经济发展强（以GDP和财政收入为核心指标），又要绝对绩效强（完成上级下达的各项任务指标达标）。在这个模型中，绝对绩效而非相对绩效更能解释晋升——不是比其他乡镇好就够，而是要达到上级设定的绝对标准。综合指标（多项任务全面完成）比单一经济指标更能预测晋升。
  quote: 政绩型体制在中县演化的结果是形成了一个精英乡镇集团，产生了乡镇党委书记晋升的双强模型——以经济发展和绝对绩效为基础。
- id: center_task_system
  label: 中心任务与目标考核
  source: 第六章 政绩
  summary: >-
    中心任务制度是中国基层治理的核心机制之一——上级政府在不同时期确定若干「中心任务」（如招商引资、计划生育、信访维稳、精准扶贫等），通过目标考核体系将任务分解到各级政府和具体干部。完成情况与干部的晋升、奖金、评优直接挂钩。这一制度确保了中央政策在地方的有效执行，但也造成了「唯指标论」的形式主义问题。
  quote: 通过中心任务和目标考核，这种体制把干部引入为晋升而发展的竞赛中——目标和指标的完成情况成为考核干部的核心标准。
- id: guanxi_types
  label: 关系的五种类型
  source: 第七章 关系
  summary: >-
    在中县干部的仕途中，关系发挥着重要作用，有时甚至是根本性的。关系的主要类型包括五种：家族（血缘关系、政治家族）、干亲（认干亲等拟亲缘关系）、同乡（同一籍贯）、同学（特别是党校同班）、战友（军队转业干部之间的关系）。这五种关系网络互相交叉、叠加，构成了干部仕途中的非正式权力基础。
  quote: 从中县的实际来看，关系类型主要有：家族、干亲、同乡、同学、战友等，这其中，政治家族现象突出。
- id: political_family
  label: 政治家族
  source: 第七章 关系
  summary: >-
    中县存在明显的政治家族现象——干部家族中多人同时或先后在党政机关任职，形成网络化的权力结构。政治家族通过内部资源调配、信息共享、互相提携来扩大家族的政治影响力。这种家族网络与正式制度并存，构成了干部体系中的一个显著特征。政治家族的存在既有传统宗族文化的影响，也有体制内「引荐」机制的作用。
  quote: 从中县的实际来看，关系类型主要有：家族、干亲、同乡、同学、战友等，这其中，政治家族现象突出。
- id: dual_loop_model
  label: 关系运作的双环模型
  source: 第七章 关系
  summary: >-
    干部选拔任用中民主推荐政策的实施加重了关系在干部仕途中的作用，催生了「拉票网」和关系运作的「双环模型」。内环是核心关系圈——家族、密友、恩师等最信任的关系，负责核心运作；外环是扩展关系圈——同学、同乡、同事等日常社交关系，负责广泛拉票。双环模型揭示了正式制度（民主推荐）与非正式运作（关系网络）如何在干部选拔中交织。
  quote: 干部选拔任用中民主推荐政策的实施加重了关系在干部仕途中的作用，并导致了拉票网和关系运作的双环模型的形成。
- id: cadre_promotion_factors
  label: 晋升的综合因素模型
  source: 第七章 关系
  summary: >-
    干部的晋升不是一个单一因素决定的，而是能力、关系、经济实绩、领导推荐、群众基础、机遇（如空缺职位出现）和资历综合作用的结果。这些因素的权重在不同层级、不同时期有所变化——在基层晋升中关系和资历权重更大，在中高层晋升中政绩和领导推荐权重上升。晋升是仕途中的关键环节，直接导致隐性台阶的强化和「过度竞争」的格局。
  quote: 干部的晋升是能力、关系、经济、领导推荐、群众基础、机遇和资历综合发生作用的结果。
- id: hidden_steps
  label: 隐性台阶与过度竞争
  source: 第七章 关系
  summary: >-
    隐性台阶是指正式晋升制度之外实际存在且必须经过的中间台阶——如从副镇长到常务副镇长、从一般乡镇到重点乡镇、从「虚职」到「实职」。这些台阶虽然不在正式编制序列中，但却是实际晋升的必经之路。隐性台阶的存在导致干部仕途的「过度竞争」——大量干部在同一层级激烈竞争有限的上级职位，形成了「千军万马过独木桥」的格局。
  quote: 并导致隐性台阶的强化和干部仕途"过度竞争"的格局。
- id: formal_informal_integration
  label: 正式关系与非正式关系的结合
  source: 第七章 关系
  summary: >-
    在中国政治生态中，一个运行良好的政治体系必然是正式关系（科层制度、岗位职责、法律法规）与非正式关系（人情、面子、关系网）的有机结合。非正式关系起到了润滑剂的作用，弥补了正式制度的僵化和不足，成为正式制度的有益补充。但两者的边界模糊也带来了权力寻租和腐败的风险。
  quote: 一个运行良好的政治体系，一定是正式关系和非正式关系的有机结合，这其中非正式关系起到了润滑剂的作用。

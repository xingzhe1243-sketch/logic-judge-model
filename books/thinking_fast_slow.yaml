source: 思考，快与慢 (Kahneman) — 基于原文完整提取的双系统、前景理论、偏见体系
description: All quotes are verbatim from the Chinese translation source text.
core_concepts:
- id: dual_system
  label: 双系统模型
  source: 思考，快与慢 (第1-3章)
  summary: >-
    系统1:自动/快速/直觉/无意识/模式识别/负责约95%日常决策；系统2:控制/缓慢/分析/逻辑推理/需要主观努力/负责约5%关键决策。系统1持续运行并向系统2提供建议，系统2通常懒惰且倾向于接受系统1的建议。
  quote: ·系统1的运行是无意识且快速的，不怎么费脑力，没有感觉，完全处于自主控制状态。
- id: cognitive_ease
  label: 认知放松与认知紧张
  source: 思考，快与慢 (第5章)
  summary: 认知放松:感觉熟悉流畅→系统1主导→更容易相信；认知紧张:感觉困难卡住→系统2激活→更谨慎分析。重复曝光就能产生熟悉感，从而带来认知放松。
  quote: 任何能使联想机制运行更轻松、更顺利的事物都会使我们心生偏见。想让人们相信谬误有个可靠的方法，那就是不断重复，因为人们很难对熟悉感和真相加以区别。
- id: priming
  label: 启动效应与观念运动效应
  source: 思考，快与慢 (第4章)
  summary: 先前的刺激(无论是否有意识)会影响后续思维和行为。包括语义启动、情绪启动、行为启动。观念运动效应:想到某概念会无意识地影响后续行为。
  quote: 我们将此现象称为启动效应，也就是说"喝"这个概念在"汤"之前出现，"运动"先于"场"出现。
- id: wysiati
  label: WYSIATI (你所看到的就是全部)
  source: 思考，快与慢 (第7章)
  summary: >-
    系统1基于已有信息做判断但容易忽略未知信息。WYSIATI是许多认知偏见的根源:过度自信、框架效应、基本归因错误等。当你只有一个证据时，系统1会自动构建连贯的故事让你感到充分解释了一切。
  quote: WYSIATI，意思为"What you see is all there is"，即眼见即为事实。系统1基本上对于引起印象和直觉的信息的质量和数量都不敏感。
- id: availability
  label: 可得性启发
  source: 思考，快与慢 (第12-13章+附录A)
  summary: 通过'想起例子的容易程度'来判断事件频率或概率——容易想起的就认为更常见。可得性并不受频率和概率的影响，因此会导致系统性偏见。
  quote: 我们将可得性启发法定义为通过"实例呈现在脑中的轻松程度"来判断概率的过程。
- id: representativeness
  label: 代表性启发
  source: 思考，快与慢 (第14-15章+附录A)
  summary: 通过'A是否能代表B'(相似程度)来判断概率——越相似认为概率越高。导致基础比率忽略和对样本大小的不敏感等问题。
  quote: 人们在回答这些问题时，会典型地依赖于代表性启发法，即通过用A来代表B，也就是通过比较B与A的相似程度来对概率进行评估。
- id: conjunction_fallacy
  label: 合取谬误 (琳达问题)
  source: 思考，快与慢 (第15章)
  summary: 错误地认为两个事件同时发生的概率比其中一个单独事件发生的概率更大——因为联合情境'更具代表性'。违反了最基本的概率逻辑。
  quote: 所有人都认为琳达更像是"主张女权主义的银行出纳"，而不是普通的银行出纳。普通的银行出纳不会热衷女权主义，加上这个细节，整个描述便更像是一个有条理的故事了。
- id: base_rate_neglect
  label: 基础比率忽略
  source: 思考，快与慢 (第14-16章+附录A)
  summary: 在判断概率时忽略先验概率(基础比率)而只关注具体证据的倾向。在缺乏具体信息时合理使用基础比率，但有描述后就被彻底忽略。
  quote: 如果人们通过代表性来评估概率，先验概率就会被忽视掉。
- id: anchoring
  label: 锚定效应
  source: 思考，快与慢 (第11章+附录A)
  summary: 初始值(锚点)对后续判断产生不成比例的影响，即使锚点是随机或无关的。两种机制:系统2的调整不足+系统1的启动效应。
  quote: 不同的起始点会产生不同的估测，都会偏向于初始值。我们将这个现象称为锚定。
- id: overconfidence
  label: 过度自信
  source: 思考，快与慢 (第19-20章)
  summary: 人们对自己的判断、知识和能力过分自信。真实准确性远低于主观自信水平。由WYSIATI+系统1的联想一致性导致。
  quote: 我们只重视自己已知的，却忽视自己未知的，因此我们对自己的信念过度自信。
- id: hindsight_bias
  label: 后见之明偏见 (事后聪明偏差)
  source: 思考，快与慢 (第19章)
  summary: 事情发生后，人们倾向于高估自己在事前预测到该结果的能力——'我早就知道会这样'。系统1用当前信息重构过去的产物。
  quote: 你无法重构过去的想法，这种情况会不可避免地导致你低估自己受往事影响的程度。
- id: sunk_cost
  label: 沉没成本谬误
  source: 思考，快与慢 (书中有多处相关讨论)
  summary: 继续投入已无法收回的资源(金钱/时间/精力)，仅仅因为'已经投入了这么多'——这是非理性的。由损失厌恶和心理账户共同导致。
  quote: 对亏损账户进行额外投资的决策被称为"沉没成本悖论"，这是一个代价高昂的错误决策。
- id: confirmation_bias
  label: 确认偏误
  source: 思考，快与慢 (第7章+第19章)
  summary: 人们倾向于寻找、注意和记住支持自己已有观点的证据，忽略或贬低与之矛盾的证据。系统1会自动构建与已有信念一致的因果关系。
  quote: 将注意力集中在当前的证据上，忽略不存在的证据（眼见即为事实）。
- id: expert_illusion
  label: 技能错觉与效度错觉
  source: 思考，快与慢 (第20-21章+附录A)
  summary: 根据输入信息与输出模式的高度一致性而产生的过度自信，忽视预测准确性的实际限制因素。即使知道限制因素时错觉仍然存在。
  quote: 他知道这份记录表明这种疾病的变化几乎是不可预知的，他怎么会对这个病例表现得这么自信？听起来像是有效性错觉。
- id: regression_fallacy
  label: 回归平均值误解
  source: 思考，快与慢 (第17章+附录A)
  summary: 极端值后往往跟随着更接近平均值的值——这是统计现象，但人们常对此捏造出错误的因果解释。
  quote: 她说经验教会她一个道理，批评比赞扬更有用。不过她不明白这是回归平均值在发挥效用。
- id: law_of_small_numbers
  label: 小数法则
  source: 思考，快与慢 (第10章+附录A)
  summary: 人们即使在小样本中也期望看到与大样本相同的分布特征，高估小样本的代表性。研究人员因此选择样本不够大并过度阐释有限发现。
  quote: 研究人员过于信任小样本的结果，高估了这些结果的可复制性。
- id: gamblers_fallacy
  label: 赌徒谬误
  source: 思考，快与慢 (第10章+附录A)
  summary: 错误地认为随机序列会自我纠正——'已经连续出了多次正面，接下来该出反面了'。人们期望随机过程的局部序列也代表其基本特征。
  quote: 事实上，在概率的结果揭晓之时，偏离并不是被"纠正"了，而只是融为一体了。
- id: planning_fallacy
  label: 计划谬误
  source: 思考，快与慢 (第23章)
  summary: 系统性地低估完成任务所需的时间、成本和风险，高估收益。即使知道类似计划在过去也超时超支。内部视角(聚焦于独特因素)而非外部视角(参考统计数据)是主要原因。
  quote: 我们将注意力集中在目标上，锚定我们的计划，却忽视了相关的基础比率，导致规划谬误。
- id: optimism_bias
  label: 乐观偏见
  source: 思考，快与慢 (第24章)
  summary: 系统性地高估好事发生在自己身上的概率，低估坏事的概率。是最普遍的认知偏见之一——既保护免于抑郁，也是企业创新的动力。
  quote: 乐观心态大多是遗传下来的，是人类普遍存在的一种性情，偏向于看到事物积极的一面。
- id: prospect_theory
  label: 前景理论
  source: 思考，快与慢 (第25-26章+附录B)
  summary: >-
    风险决策模型，核心三要素:参照点依赖(好坏取决于与参照点的比较)、损失厌恶(损失的痛苦≈获得的快乐的2倍)、敏感度递减(边际效应递减)。价值函数在收益区凹(风险规避)，在损失区凸(风险追求)。
  quote: 这个图有明显不同的两个部分，中性参照点的右边和左边。这个图的明显特征就是它是S形的，这表明人们对盈与亏的敏感度都降低了。
- id: loss_aversion
  label: 损失厌恶
  source: 思考，快与慢 (第26-27章)
  summary: 人们对损失的敏感度高于对收益的敏感度。典型损失厌恶系数约为2:1——失去的痛苦约等于获得同等快乐的两倍。是前景理论的核心组成部分。
  quote: 第三个原则是损失厌恶。当我们对盈亏进行直接比较或权衡时，亏似乎比盈影响更大。
- id: endowment_effect
  label: 禀赋效应
  source: 思考，快与慢 (第27章)
  summary: 当人们拥有某物后，会赋予它比拥有前更高的价值——因为放弃它被视为'损失'而令人厌恶。是损失厌恶的直接表现。
  quote: 禀赋效应是指当个人一旦拥有某个物品，那么他对该物品价值的评价要比未拥有之前大大提高。
- id: fourfold_pattern
  label: 四重模式
  source: 思考，快与慢 (第29章)
  summary: 不同概率和结果领域的风险态度模式:高概率收益→风险规避(确定效应);低概率收益→风险追求(彩票);高概率损失→风险追求;低概率损失→风险规避(保险)。
  quote: 偏好的"四重模式"被视为前景理论的核心成果之一。
- id: possibility_certainty
  label: 可能性效应与确定性效应
  source: 思考，快与慢 (第29章+附录B)
  summary: 可能性效应:过度重视小概率事件(过高估计其发生可能性)。确定性效应:对确定性结果给予过度的权重(相比高概率但不确定的结果)。概率的心理物理学导致决策权重非线性。
  quote: 可能性效应会重视不大可能的结果，而几乎肯定的结果相对于确定的结果来说，受到的重视程度要小。
- id: framing
  label: 框架效应
  source: 思考，快与慢 (第34章+附录B)
  summary: 同一问题用不同表述方式导致不同决策选择，违反不变性原则。收益框架下风险规避，损失框架下风险追求。框架效应像视觉错觉一样难以克服。
  quote: 如果采取方案A，可救治200人。（72%）如果采取方案B，有1/3的概率救治600人，2/3的概率无人获救。（28%）
- id: mental_accounting
  label: 心理账户
  source: 思考，快与慢 (第34章+附录B)
  summary: 人们在心理上将资金分配到不同'账户'，不同账户的钱被区别对待——虽然在经济学上完全可替代。心理账户解释了消费行为中的许多反常现象。
  quote: 心理账户在记录得分上应用广泛。
- id: pseudo_certainty
  label: 假确定性效应
  source: 思考，快与慢 (附录B)
  summary: 当不确定结果通过多阶段游戏呈现时，人们会在中间阶段将不确定性忽略，视为确定，从而导致偏好反转。
  quote: 我们将这种现象称为虚假确定性效应，因为实际上不确定的事件在被权衡时会被看成是确定的。
- id: peak_end
  label: 峰终定律
  source: 思考，快与慢 (第35章)
  summary: 对一段经历的评价主要取决于两个时刻:最高点(情绪最强烈)和结束点，而非全程总和。持续时间被忽略——经历的长度对整体评价影响很小。
  quote: ·峰终定律（peak-end rule）①：整体的回顾性评级可通过将最糟糕时期和最后时刻的疼痛程度的平均加权而评估出来。
- id: experience_vs_memory
  label: 体验自我 vs 记忆自我
  source: 思考，快与慢 (第35-38章)
  summary: 体验自我感受当下每一刻；记忆自我存储回忆并决定下次决策。两者常常冲突——记忆自我主导决策，但体验自我才是真实感受。记忆评价基于峰终时刻而非实际总体验。
  quote: ·过程忽视（duration neglect）：过程的持续对所有疼痛的评估没有任何影响。
- id: focusing_illusion
  label: 聚焦错觉
  source: 思考，快与慢 (第38章)
  summary: 当被问及某件事对幸福的影响时，会过度聚焦在该事上忽略生活中其他因素，从而高估其长期影响。'没有什么像你想象的那般重要'。
  quote: 聚焦错觉的本质是眼见即为事实，就上面例子来看，即是对气候给予过多的权重，却忽略了其他影响幸福的因素。
- id: illusory_correlation
  label: 相关性错觉
  source: 思考，快与慢 (附录A)
  summary: 人们高估自然联想到的两件事同时发生的频率——因为可同时被想起。这种效应极度抗拒相互矛盾的数据。
  quote: 这种效应被称为相关性错觉（illusory correlation）。
- id: denominator_neglect
  label: 分母忽略
  source: 思考，快与慢 (第10章+第15章)
  summary: 在判断概率时专注于分子(发生案例数)而忽略分母(总案例数)的倾向。导致对小概率事件的高估或对样本大小的不敏感。
  quote: 他们想让人们意识到风险是存在的。这也就是他们会使用'每1 000人中有1人死亡'这个说法的原因，这种做法利用了分母忽视效应。

source: 权力的48条法则 (Robert Greene) — 基于原文完整提取的权力法则体系
description: Original Chinese edition translated by 金马, 卢安安, 张小玲.
core_concepts:
- id: master_superiority
  label: '法则1: 永远不要盖过上司的光芒'
  source: 权力的48条法则 (法则1)
  summary: >-
    永远让你的上司感到比你优越。在取悦他们的同时不要过分显露才华，否则会引发恐惧和不安。掩饰长处最终可能帮助你掌握权力。你要奉承上司让他飘飘然，不露痕迹地让他显得更聪明干练。
  quote: 永远让你的上司感到比你优越。在取悦他们或给他们留下深刻印象的同时，不要过分显露你的才华，否则会适得其反——引发他的恐惧和不安。
  case: >-
    尼古拉斯·富凯为路易十四举办奢华宴会，展示了自己的财富和品位。第二天就被以盗窃国家财富的罪名逮捕，在单人牢房里度过生命最后20年。路易十四后来用了富凯的建筑师和园林设计师建造了更华丽的凡尔赛宫。
- id: trust_enemies
  label: '法则2: 永远不要太信任朋友，学会如何利用敌人'
  source: 权力的48条法则 (法则2)
  summary: 当心你的朋友们！他们背叛你的速度更快，因为他们更易萌生嫉妒之心。雇佣以前的敌人，他会比朋友更忠诚，因为他更想证明给你看。如果你没有敌人，想办法树立敌人！
  quote: 当心你的朋友们！他们背叛你的速度更快，因为他们更易萌生嫉妒之心。如果雇佣以前的敌人，他会比朋友更忠诚，因为他更想证明给你看。
  case: 拜占庭皇帝迈克尔三世极度信任好友巴西琉斯，将他从马夫提升为首席顾问。巴西琉斯越来越贪婪，最终发动政变用匕首杀死迈克尔，将他的头颅挑在长矛上游街。
- id: conceal_intentions
  label: '法则3: 隐藏你的意图'
  source: 权力的48条法则 (法则3)
  summary: 永远不要泄露行动背后真正的目的，要让别人难以意料。利用诱饵和烟幕转移注意力。虚情假意、言不由衷，同时放出误导信息，瞒过所有人，最终得到你要的一切。
  quote: 永远不要泄露你行动背后真正的目的，要让别人难以意料，捉摸不定。如果他们摸不清你的企图，就无法事先防备。
  case: 俾斯麦1850年在普鲁士议会发表反对战争的惊人演讲，被任命为内阁大臣。实际上他梦想统一德国、打败奥地利。几年后成为首相，最终引导普鲁士对奥地利开战并取胜。
- id: say_less
  label: '法则4: 说的永远比需要的少'
  source: 权力的48条法则 (法则4)
  summary: 说得越多就越显得平庸。有权势的人用少言寡语树立威严。沉默使别人感到不自在，迫使对方自我防御从而暴露弱点。话一旦说出口就无法收回。
  quote: 如果你想通过语言来引人注目，那么说得越多，你就显得越平庸，越不能掌控全局。有权势的人往往用少言寡语树立威严，慑服他人。
  case: >-
    路易十四在宫中对所有朝臣的禀报只说「我会考虑的」，然后离开。没有人能明了国王的立场或预测他的反应。圣西蒙评价：「没有人像他那样精于抬高自己的语言、微笑，甚至一抹眼神的价值。」
- id: reputation
  label: '法则5: 不惜用生命捍卫你的名誉'
  source: 权力的48条法则 (法则5)
  summary: 名誉是权力的基石。凭借名誉就能威慑别人、赢得胜利。名誉一旦受损就会陷入四面楚歌的境地。要时刻警惕潜在的攻击，防患于未然。同时要学会挖敌人名誉的墙角。
  quote: 名誉是权力的基石。仅仅凭借名誉，你就能威慑别人，赢得胜利。名誉一旦受损，你就会陷入无从抵抗、四面楚歌的境地。
  case: >-
    诸葛亮以「卧龙」之号名贯天下。司马懿率十五万大军兵临城下时诸葛亮兵力仅百余人。他打开城门坐在城墙上焚香操琴。司马懿恐惧其威名怀疑有诈，下令撤退。声望的威力不费一兵一箭击退敌人。
- id: court_attention
  label: '法则6: 不惜代价，引人注目'
  source: 权力的48条法则 (法则6)
  summary: 人们以外表评判一切，绝对不要让自己湮没在茫茫人海中。要让名字附着上特殊品质和形象。任何一种注目都有利于你——受人攻击中伤也要好过无人问津。用神秘感营造魅力。
  quote: 人们总是习惯于眼见为实，以外表评判一切，没看见的不算数。因此绝对不要让自己湮没在茫茫人海中，或是被他人遗忘。
  case: 巴纳姆在美国博物馆雇佣乞丐沿街放砖头，吸引好奇的群众尾随进入博物馆。他还购买「斐济美人鱼」标本并在全国报纸上大肆宣传，引发全美的争论，观众蜂拥而至。
- id: take_credit
  label: '法则7: 让别人为你效劳，将功劳记在自己名下'
  source: 权力的48条法则 (法则7)
  summary: 利用别人的智慧、知识和劳力推进自己的事业。他人的帮忙节省时间和精力，使你具有神助般的效率。你的助手会被人遗忘，只有你被牢记。不要亲自去做别人可以替你效劳的事。
  quote: >-
    第一，一项发明或创造的功绩属于谁这个问题的重要性，即使不能超过发明或创造本身，那么至少来说也是和发明或创造同等重要的。你必须牢牢占住功劳，严防被他人窃取，同时也应防止别人抢走你的苦劳。
  case: 画家鲁本斯雇佣一批出色画家分工协作，有人画服饰、有人画背景。有重要客户参观时他把雇佣画家赶出画室，让客户以为他独自以惊人速度作画。他因此被视为不可多得的天才。
- id: make_them_come
  label: '法则8: 让他人自投罗网——必要时使用诱饵'
  source: 权力的48条法则 (法则8)
  summary: 当你把他人逼得不得不采取行动时，你就掌控了主动权。最好的方法是让对手自投罗网。用诱饵引诱他入瓮然后发动攻击。有效行动十之八九是你保持不动，让别人步入陷阱。
  quote: 其实最有效的行动十之八九都是，你保持原地不动、缄默冷静、让别人步入你为他们设下的陷阱而束手就擒。
  case: >-
    塔里兰在维也纳会议期间设下诱饵——派密使暗示拿破仑英国会放他逃走。拿破仑果然从艾尔巴岛逃离重新称帝。但法国资源已耗尽，滑铁卢战役后拿破仑被流放到更偏远的圣赫勒拿岛。
- id: act_dont_argue
  label: '法则9: 要用行动取胜，莫靠辩论争赢'
  source: 权力的48条法则 (法则9)
  summary: 通过口舌之辩获得的胜利是代价高昂的胜利。争辩激起怨恨和恶意持续很久。行动更能让人心悦诚服。说话不值什么钱，行动和示范有力得多——「真理通常是眼见为实的。」
  quote: 言语不值什么钱。每个人都知道争辩得激烈的时候，为了支持某个主张，我们什么话都说得出来。有谁会被这种信口雌黄说服了呢？可见行动和示范有力多了。
  case: >-
    米开朗琪罗雕刻大卫像时市长索德里尼批评鼻子太长。米开朗琪罗知道市长视角有问题但不争辩。他邀请市长爬上架台，假装用锉刀修改——实际没碰鼻子。索德里尼再看时满意地说「你让他栩栩如生」。
- id: avoid_unhappy
  label: '法则10: 回避不快乐和不幸之人'
  source: 权力的48条法则 (法则10)
  summary: 情绪状态和疾病一样具有传染性。不幸者有时候是自己招惹的不幸，也会把不幸传递给你。你应该远离他们，去结交快乐和幸运的人。要对付感染只有一个办法——隔离。
  quote: 你会因其他人的悲惨不幸的影响而死亡——情绪状态和疾病一样具有很强的传染性。也许你觉得自己是在帮助一个溺水的人，可这样只会为自己招来灾难。
  case: 劳拉·蒙特兹以强烈性格诱惑了一个又一个男人，但她的不稳定性传染给所有亲近的人:杜加里因她决斗被杀；路德维希国王为她失去王位；军官希尔德为她失去军职并死于翻船。
- id: keep_dependent
  label: '法则11: 学会保持别人对你的依赖'
  source: 权力的48条法则 (法则11)
  summary: 让别人永远需要你。别人越依赖你，你就越自由。只要别人的幸福和成功都得仰仗你，你就可以无所畏惧。不要完全教会对方，否则他们就会甩开你。令人畏惧好过受人喜爱。
  quote: 要保持自己的独立性，你必须让自己永远被别人需要和渴求。别人越依赖你、你就越自由。只要别人的幸福和成功都得仰仗你，那么你就可以无所畏惧。
  case: >-
    俾斯麦先依附软弱的威廉四世成为他的力量来源，迫使国王按自己意愿行事。威廉继位后极度厌恶俾斯麦但仍不得不依赖他。每次俾斯麦威胁辞职国王就会让步。最终俾斯麦以首相之尊引领德意志统一。
- id: selective_honesty
  label: '法则12: 有选择地运用诚实与宽大，让对手放下武器'
  source: 权力的48条法则 (法则12)
  summary: 一次真挚诚实的举动足以掩盖屡次不诚实的行为。即便是最多疑的人面对真诚宽大的姿态也会解除戒备。将欲取之，必先予之——给予使得对方很难注意到你的索取。
  quote: 一次真挚而诚实的举动足以掩盖屡次不诚实的行为。即便是最多疑的人，面对真诚宽大、开诚布公的姿态也会解除戒备。
  case: >-
    鲁斯提伯爵从黑帮头目卡彭那里借5万美元说帮他翻倍。60天后他归还了分文不少的钱。卡彭被他的「诚实」震惊说「你真是太诚实了」，主动给了鲁斯提5000美元——而这正是鲁斯提的目标。
- id: appeal_self_interest
  label: '法则13: 请求帮助时，诉诸对方的自身利益'
  source: 权力的48条法则 (法则13)
  summary: 千万不要去恳求慈悲或感恩。不要提醒别人你过去给他的好处。指出你的请求对他有利的地方，只要他看到利益就一定做出热诚回应。自我利益是推动众人的杠杆。
  quote: 如果你需要求助于你的盟友，千万不要惹人讨厌地去提醒他你过去给他的帮助和好处，否则他一定会想方设法不理睬你。
  case: >-
    蒙古入侵中原时耶律楚材没有诉诸正义或慈悲，而是诉诸成吉思汗的贪婪——「只需要向每个人征收赋税就可以搜刮财富」。成吉思汗理解了这一智慧，中原因此得救。开封要被屠城时他又说「最优秀的工匠技工都逃到了开封，应善加利用」。
- id: spy_as_friend
  label: '法则14: 装成朋友的姿态，进行间谍的工作'
  source: 权力的48条法则 (法则14)
  summary: 充分了解对手非常重要。利用间谍搜集情报能使你比对手领先一步。更好的是自己充当间谍，在社交场合刺探侦察，提出问题让人们泄露出弱点和意图。
  quote: 充分了解你的对手是非常重要的。利用间谍搜集有价值的情报，能使你比对手领先一步。更好的方法是自己充当间谍。
  case: >-
    艺术品经纪人杜文花了多年追踪实业家梅隆，秘密雇佣其手下打探品位和习性。当梅隆访问伦敦时杜文预订他正下方的套房，安排「巧遇」并一起前往博物馆。梅隆惊讶发现两人品味惊人相似，从此成为杜文最慷慨的客户。
- id: crush_enemy
  label: '法则15: 彻底根除你的敌人'
  source: 权力的48条法则 (法则15)
  summary: 令人生畏的对手必须彻底消灭。如果留有一丝余烬不管多么微弱火焰最终会复燃。半途而止比彻底歼灭代价更大。彻底消灭敌人，从肉体到精神一起消灭。
  quote: 自摩西以来，所有伟大的领袖都明白，令人生畏的对手必须彻底消灭（有时要历尽艰难才会明白这一道理）。如果留有一丝余烬未灭，不管多么微弱，火焰最终会升腾复燃。
  case: >-
    项羽多次抓到刘邦却因同情犹豫不决——第一次让他逃脱，第二次接受求和，第三次心存仁慈。最后局势逆转，刘邦采纳军师劝告彻底消灭项羽军队。项羽被迫自刎，刘邦成为汉朝开国皇帝。
- id: use_absence
  label: '法则16: 利用缺席让人们更尊敬你'
  source: 权力的48条法则 (法则16)
  summary: 流通量过大会使价格下跌。露面越频繁就显得越平凡。地位稳固后暂时抽身而退会让人们更多谈论你甚至仰慕你。要学会在什么时候暂时离开，借助缺席抬高身价。
  quote: 流通量过大会使产品价格下跌。露面越频繁或者关于你的消息越多，你就显得越平凡。如果你在一个团队里地位已经稳固，暂时抽身而退会让人们更多地谈论你，甚至更加仰慕你。
  case: >-
    美狄亚人的仲裁人狄奥克斯在权力巅峰时突然退休，国家陷入混乱。美狄亚人请求他当国王。他提出条件——修建王宫、配备卫队，定下「不准见他」的法则。他统治53年，人们视他为神之子。
- id: unpredictable
  label: '法则17: 让别人战战兢兢，营造高深莫测的氛围'
  source: 权力的48条法则 (法则17)
  summary: 如果别人能预料到你的行动，他们就有把握大局的感觉。故意让人摸不着头脑会让他们心慌意乱，费尽心机揣摩你的行为。这一策略运用到极致能起到威吓震慑的作用。
  quote: >-
    人类是一种习惯性的好奇动物，总是希望通过别人的行动来揣测出某些一贯性的熟悉的东西。如果别人能预料到你的行动，他们就会有把握大局的感觉。要将局势逆转：故意让人摸不着头脑。
  case: >-
    巴比·费雪在国际象棋世纪之争中故意挑剔、迟到、走臭棋，让史帕斯基完全猜不透。以冷静著称的史帕斯基开始怀疑有阴谋——橙汁被下药、椅子有机关、空气中有化学物质。最终史帕斯基完全崩溃放弃比赛。
- id: avoid_isolation
  label: '法则18: 不要筑起堡垒自我防御——孤立是危险的'
  source: 权力的48条法则 (法则18)
  summary: 堡垒看起来最安全但孤立让你暴露在更多危险中。孤立切断宝贵的信息来源让你成为易攻击的目标。最好的办法是周旋于人群之中找到盟友。权力依赖于社会交往和沟通。
  quote: 躲进堡垒里，你就失去了与权力之源的联系，无从知晓周围发生的事情，也丧失了均衡感。你并没有让自己更安全，反而将自己与赖以生存的信息隔绝开来。
  case: >-
    秦始皇统一六国后日益恐惧，住在有270间宫室的宫殿里，每晚睡在不同房间，撞见者处死。孤立切断了信息来源，宦官不经准许假传圣旨。他孤独死去时遗体被装在御辇里用咸鱼掩盖腐臭。对比:路易十四让贵族住在凡尔赛宫周围，「即使一根针掉在地上他也能听见」。
- id: know_whom
  label: '法则19: 弄清楚你要对付的人——千万不要搞错对象'
  source: 权力的48条法则 (法则19)
  summary: >-
    世界上的人形形色色，人人不会以同样方式回应你的策略。必须极其小心选择对手。权力的最高境界是能辨认出羊群中的狼。错误会被原谅但轻蔑永远不会——自尊心永远记住所受的侮辱。
  quote: 世界上的人形形色色，你绝对不能认为人人都会以同样的方式回应你的策略。你以骗术或计策将某些人愚弄了一次，他们会一辈子都在寻求报复。
  case: >-
    花剌子模国王穆罕默德侮辱成吉思汗的使者——处死一名、剃光两名使者的头发送回。成吉思汗回应：「你选择了战争，该来的就会来。」一年之内成吉思汗攻占撒马尔干，花剌子模帝国土崩瓦解。
- id: dont_commit
  label: '法则20: 不要依附于任何人'
  source: 权力的48条法则 (法则20)
  summary: 只有傻瓜才急急忙忙选择站在哪一派。不要依附于任何一方或主张，坚持自己的立场。保持独立性你就可以从容掌控他们——隔山观虎斗让他们相互攻讦然后跑来求你。
  quote: 只有傻瓜才急急忙忙地选择站在哪一派。不要依附于任何一方或者任何主张，而应该坚持自己的立场。
- id: play_sucker
  label: '法则21: 假装比你的对手还要傻——借愚取胜'
  source: 权力的48条法则 (法则21)
  summary: 没有人喜欢觉得自己比对方笨。让你的对手觉得自己很聪明，他们就会卸下戒备心理落入你的陷阱。看似愚钝的外表是最高明的伪装。
  quote: 没有人愿意觉得自己比旁边的人傻。你的计策是让你的对手觉得自己很聪明——不仅是聪明，而且是比你还聪明。一旦他们相信这一点，就永远不会怀疑你是否有不为人知的动机。
- id: surrender_tactic
  label: '法则22: 运用投降的策略——将弱势转化为力量'
  source: 权力的48条法则 (法则22)
  summary: 当你处于弱势时不要为荣誉做无谓的抗争。选择投降可以保存实力等待时机。适时投降给你时间去破坏和报复。投降不是终点而是战略性的退却。
  quote: >-
    当你力量很薄弱的时候，宁可选择投降也不要为所谓的荣誉而战。投降给你时间恢复元气，给你时间折磨和激怒你的征服者，也给你时间等待他力量的衰落。不要给予他与你作战并击败你的满足感——先投降。你把另一边脸转向他，就会惹恼他，令他不安。让投降成为获取力量的工具。
- id: concentrate_forces
  label: '法则23: 凝聚你的力量'
  source: 权力的48条法则 (法则23)
  summary: 要拥有持久的权力你必须将力量集中在关键目标上。分散力量会削弱你。像阳光透过放大镜聚焦才能点燃火焰一样，把精力集中在少数关键领域。
  quote: 保存你的力量和能量，把它们集中在最有力的一点上。找到丰富的矿藏并深入挖掘，比蜻蜒点水式地东挖西掘收获要大得多。深度和强度要胜过宽度和广度一筹。
- id: perfect_courtier
  label: '法则24: 扮演完美的朝臣'
  source: 权力的48条法则 (法则24)
  summary: 宫廷是高度文明和优雅的地方，公然恃强凌弱会引起不满。你必须充分表现优雅和高贵同时又以最高妙手段挫败对手——「手上戴着天鹅绒的手套，脸上挂着最甜美的微笑」。
  quote: 久经考验、成功取胜的朝臣们学会了每一个步骤都要巧妙迂回。如果要在对手的背上插入一刀，就必须'手上戴着天鹅绒的手套，脸上挂着最甜美的微笑'。
  case: 路易十四的凡尔赛宫中贵族们表面上优雅高贵彬彬有礼，暗中不断策划如何赢得国王恩宠、挫败竞争对手。最高明的朝臣通过诱惑、魅力、欺骗和巧妙计策达到目的。
- id: recreate_yourself
  label: '法则25: 重新塑造你的形象'
  source: 权力的48条法则 (法则25)
  summary: 你必须主动塑造自己的形象而不是让世界来定义你。通过戏剧化的方式重新创造你的身份。掌握自己的形象你就握住了权力的钥匙。
  quote: >-
    不要欣然接受社会强加于你的角色。重塑一个既引人注目又不会让观众厌烦的新身份。时刻关注自己的形象，让自己成为形象塑造的主人，不要让别人为你设定形象。将戏剧性手段融入你在公众场合的姿态与行动之中，那么，在公众视野中，你的权力将会因此而得到提升，你也将声誉鹊起，名誉将比生命本身所赋予的更大。
- id: clean_hands
  label: '法则26: 洁身自好，保持清白'
  source: 权力的48条法则 (法则26)
  summary: 你的手必须保持清白——不能让人抓住把柄。使用替罪羊或中间人去做肮脏的事情。看起来清白的声誉是最宝贵的权力资产之一。
  quote: 你必须做礼仪与效率方面的模范：绝不可以染指任何错误和污秽的行为。你要维护你那一尘不染的形象，必要的时候可以利用他人做替罪羊或爪牙，以此来掩饰你那不可告人的行迹。
- id: cult_of_followers
  label: '法则27: 操控人们需要信仰追求的弱点，制造一群追随者'
  source: 权力的48条法则 (法则27)
  summary: 人们有相信某事物的渴望。你需要为他们提供可以全身心投入的信仰或事业，这样他们就会成为忠诚的追随者。利用人们需要意义和归属感的弱点。
  quote: >-
    人们对于信仰有一种不可抗拒的强烈需求。你应该提供一套新的永远能够满足他们精神需要的信仰体系，以便他们追随。首先，你的言辞语义要力求模糊，但是言语之中要有承诺之词，强调热忱超过理性和清晰思考，给予你的追随者可以执行的仪式，要求他们为了你的利益而牺牲。
- id: act_with_boldness
  label: '法则28: 行动时要大胆'
  source: 权力的48条法则 (法则28)
  summary: 在你做好充分准备后要以大胆和果断的行动抓住机会。犹豫不决是权力的大敌。胆怯的人总是疑虑重重——行动的大胆既迷惑敌人又鼓舞盟友。
  quote: >-
    如果你不确定应该如何实施计划，那就不要轻易尝试。你的疑虑和迟疑将会影响你计划的执行。胆怯是危险的，最好是大胆行动，放手去搏。你因大胆而犯下的任何错误，都可以用更加大胆的举措来纠正。人人都钦佩胆大、无畏的人，没有人会敬重和佩服懦夫。
- id: plan_to_end
  label: '法则29: 全盘考虑，计划到结局'
  source: 权力的48条法则 (法则29)
  summary: 必须事前周密计划，推演各种可能的后果，计算出每一步的得失。全盘计划最稳妥能使你看得更远。贪图短暂利益往往导致长远的失败。
  quote: >-
    结果是我们所追求的，是最重要的东西。你的计划要有始有终，必须围绕着结局来考虑问题。你要考虑所有可能的结果、障碍及上司忽视你的辛劳并把荣誉授予别人的曲折命运。计划到结局，你不但不会让形势左右，而且知道何时该罢手。只有思考得更长远才能主宰命运以及决定未来。
- id: seem_effortless
  label: '法则30: 让成就的取得显得不费吹灰之力'
  source: 权力的48条法则 (法则30)
  summary: 你的行动必须显得从容不迫毫不费力。永远不要让别人看到你付出了多大努力——那会暴露你的局限。你的才华要显得自然轻松仿佛一切尽在掌握。
  quote: >-
    在你取得成就的过程中，行动看起来必须自然轻松。你必须将付出的辛劳与努力，还有一切聪明的窍门都加以隐瞒。行动时，要表现得不费吹灰之力，仿佛你可以做得更好更多。避免让他人知晓你忙忙碌碌地工作，那样会衍生新的问题。
- id: control_options
  label: '法则31: 掌控选择权——让别人玩你发的牌'
  source: 权力的48条法则 (法则31)
  summary: 最精明的操控者是那些让受害者以为自己在做选择的人。给他们有限的选项，无论他们选什么你都受益。掌控选择权就是掌控局势。
  quote: >-
    最佳的骗术是让牺牲者以为他有选择权，让他以为自己控制了大局，但实际上他只是你的玩偶。向牺牲者提供对你有利的选项，不论他们如何选择，你总是有利可获的。强迫他们在两害之中做出选择，无论他们如何选择，最终都会达到你的目的。
- id: peoples_fantasies
  label: '法则32: 利用民众的梦想'
  source: 权力的48条法则 (法则32)
  summary: 真相往往令人痛苦而梦想的承诺则具有无与伦比的力量。学会利用大众的幻想而不是打破它。人们更愿意相信美好的故事而非枯燥的事实。
  quote: >-
    人往往逃避事实的真相，因为真相是丑陋且令人颇感不爽的。不要将真相诉诸于现实，除非你准备好承梦想破灭之后随之而来的人们的巨大怒。敲开民众梦想的天窗，将会带给你巨大的权力。
- id: find_weakness
  label: '法则33: 找出每个人的缺点'
  source: 权力的48条法则 (法则33)
  summary: 每个人都有一个弱点、一个「阿喀琉斯之踵」。找到它你就掌握了他的命脉。观察人们最在意什么、最害怕什么，那就是他们的要害。
  quote: >-
    凡是人必有缺点，就好像坚固的城堡城墙中必有裂口一样。那些缺点往往意味缺乏安全感、无法控制情绪和欲望，或者是小小的秘密乐趣。无论如何，一旦找出，那将会成为你扭转局势的制胜法宝。
- id: act_like_king
  label: '法则34: 要让别人像对待君王一样对你，首先要表现得像个君王'
  source: 权力的48条法则 (法则34)
  summary: 对待自己要尊贵自信这种态度会传染给周围的人。你的自我定位决定了他人如何对待你。表现出君王般的自信人们就会以君王之礼待你。
  quote: 你的行为举止决定了别人怎样对待你。
- id: timing
  label: '法则35: 学习掌控时间的艺术'
  source: 权力的48条法则 (法则35)
  summary: 时间掌握一切——知道何时该加速、何时该等待、何时该停止。时间选择往往比行动本身更重要。耐心是权力之神至高无上的美德。
  quote: >-
    永远不要显得匆匆忙忙。匆匆忙忙的行事姿态会泄露出你对自己缺乏控制，不能掌控时间。你得让别人看起来总是很有耐心，仿佛你知道所有的事情最终都会水到渠成。做一个能正确判断时机的侦探，用心发现这个时代的精神、潮流所在，这个潮流将会带你到达权力的彼岸。在时机尚未成熟之时，要学着往后站；当收获季节来临时，要勇猛出击夺取胜利的果实。
- id: disdain_unobtainable
  label: '法则36: 鄙视那些你得不到的东西'
  source: 权力的48条法则 (法则36)
  summary: 你越表现出想要某物就越显得软弱。鄙视那些你得不到的东西——忽视是最好的报复手段。表现出不在乎让你处于有利位置。
  quote: >-
    对于一个不值一提的问题，你采取了承认的态度，那就给了它存在的空间与可信度。你往敌人身上投入的精力越多，就意味着他们越强大。如果有件东西你极其喜欢，但最终却不可得，对它表示出十足的轻视吧。你表现出来的兴趣越少，就显得你越有优越感。
- id: compelling_spectacles
  label: '法则37: 制造令人过目不忘的外在表现'
  source: 权力的48条法则 (法则37)
  summary: 创造视觉化的仪式和场景——人们容易记住有强烈视觉冲击的东西。形象化的权力比抽象的权力更有影响力。给人以过目不忘的印象。
  quote: >-
    惹人注目的肖像和伟大的象征姿势都会孕育出权力的氛围，众人必将对此予以回应。在舞台上，以引人注目的形象和光芒四射的特征来增加你的风采，让别人感到你气势非凡。用外在表现眩惑众人，那么将不会有人注意到你究竟想干什么。
- id: think_as_you_like
  label: '法则38: 想法可以自由，行为要随大众'
  source: 权力的48条法则 (法则38)
  summary: 保持内心的独立思考但外表上要符合社交规范。不要因为特立独行而引来不必要的注目。在思想上保持自由但在行为上表现出从众。
  quote: >-
    如果你有反抗时代的迹象，炫耀你那不依惯例的想法和非正统的思维方式，人们会以为你只是要吸引人们的注意力，而且看不起他们。因此，学习和跟随民众的一般行为是比较安全的。
- id: stir_waters
  label: '法则39: 搅动池水，才好混水摸鱼'
  source: 权力的48条法则 (法则39)
  summary: 在混乱的局面中你才能浑水摸鱼。有意制造情绪波动和混乱然后从中获利。动荡不安的局面中先机总是属于主动制造混乱的人。
  quote: >-
    如果你能够激怒敌人而让自己依然保持冷静，那么你就取得了决定性的优势。置你的敌人于失衡之中：找出敌人空虚之中出现的漏洞，透过这个漏洞你可以撼动他们，从而掌握主动权。
- id: no_free_lunch
  label: '法则40: 蔑视免费的午餐'
  source: 权力的48条法则 (法则40)
  summary: 免费的午餐往往是陷阱。慷慨往往是一种隐藏着操纵意图的信号。付出什么就得到什么。接受免费的东西会让你欠下人情债。
  quote: 免费提供的事物是有危险性的，通常不是内含诡计就是隐藏着潜在的义务；因此，有价值的事物是值得付费的。用你的方式付费后，你就可以抛掉感激、罪过以及欺诈。
- id: avoid_great_mans_shoes
  label: '法则41: 尽量避免继承伟人的衣钵'
  source: 权力的48条法则 (法则41)
  summary: 如果你继承了一个伟人的位置你需要超越他而不是模仿他。跟随伟人的脚步会让你显得渺小。建立你自己的身份而不是活在伟人的阴影下。
  quote: >-
    如果你继承了一位伟人或者父母是闻名遐迩的人物的衣钵，那就意味着你必须要取得前者两倍以上的成绩才能在公众眼中超越他们。不要迷失在他们的阴影下或是深陷于不是你所创造的成绩中，改变方向，建立属于你自己的名声和身份。
- id: strike_shepherd
  label: '法则42: 攻击牧羊人，羊群就会四处奔跑'
  source: 权力的48条法则 (法则42)
  summary: 不要逐一对付群体中的每个人而是攻击他们的首领。摧毁了领头的其他人就会四散。消除影响力中心整个组织就会瓦解。
  quote: 麻烦经常可以追溯到单个个体——喜欢添油加醋的人、自大而又不可理喻的部下。如果你给上述人充足的操作空间，其他人会盲目跟随，从而使形势变得不可控制。
- id: hearts_minds
  label: '法则43: 致力于他人的情感与心灵'
  source: 权力的48条法则 (法则43)
  summary: 要想赢得别人的支持，留住他们的心比留住他们的头脑更重要。情感的力量远大于逻辑。攻击心灵深处别人就无法防御。
  quote: >-
    高压政策通常会让你陷于不利之中，你必须善于引诱别人朝着你的方向行走。你成功诱惑的人将会成为你忠诚的爪牙。成功诱惑他人的方式就是玩弄他们的心理以及弱点，通过在他们的情感上下功夫来软化抵抗者，在他们所喜爱与害怕的事物上大做文章。
- id: mirror_effect
  label: '法则44: 运用镜子效应解除敌人武装和激怒敌人'
  source: 权力的48条法则 (法则44)
  summary: 用镜子反射敌人的行为来解除其武装和激怒他们。当你模仿敌人时他们就会自乱阵脚。镜子是最古老的武器之一——反射出敌人自己的丑陋。
  quote: >-
    镜子是行骗的完美工具。你可以通过模仿激怒敌人，让他们摸不着头脑；也可以举起镜子探视敌人的灵魂，通过幻觉诱惑他们，让他们以为你认同了他们的价值。几乎没有人能够抵挡得住镜子效应的威力。
- id: preach_change
  label: '法则45: 鼓吹改革的需要，但是不要一次改革太多'
  source: 权力的48条法则 (法则45)
  summary: 对变革要持谨慎态度。太多的变革会引发反抗。要让变革看起来像是恢复过去的辉煌。渐进式改革比激进革命更持久。
  quote: 在抽象意义上，每个人都理解变革的需要，但在日常生活中，人们却是习惯的产物。太多的创新会带来创伤，导致反抗。
- id: never_perfect
  label: '法则46: 不要表现得过于完美'
  source: 权力的48条法则 (法则46)
  summary: 偶尔有小缺点反而显得更有人性更容易接近。完美会引发嫉妒和怨恨。刻意流露一些小缺点让他人对你放心。
  quote: >-
    比别人表现得好，总是危险的，但是最危险的是表现得没有错误和缺点。嫉妒会树立沉默的敌人。偶尔展现自己的缺点，承认无伤大雅的不道德行为是很明智的举措。这样能够使他人对你的嫉妒融解于你的小小瑕疵中，而且让你看起来更加有人性和平易近人。
- id: know_when_to_stop
  label: '法则47: 不要超越你瞄准的目标——在胜利中学会适时停手'
  source: 权力的48条法则 (法则47)
  summary: 不要超越你瞄准的目标。赢了就停手——过分贪婪会让你失去已经得到的一切。知道什么时候停止与知道什么时候开始同样重要。
  quote: 胜利的时刻往往是最危险的。在胜利的刺激下，傲慢与过度自信会推动你超越原本订立的目标。一旦你走得太远，你树立的敌人将会比你击垮的对手还多。
- id: assume_formlessness
  label: '法则48: 顺应变化，以无形胜有形'
  source: 权力的48条法则 (法则48)
  summary: 最终极的权力形式是无形——就像水一样根据容器的形状不断变化。没有固定形态的人才是无法被打败的。适应任何环境、任何规则、任何对手。
  quote: 塑造一个形状，拟定一个看得见的计划，就等于你完全开放自己接受别人的攻击。不要有让敌人抓住的固定形状，取而代之的是保持你的适应能力，并且不停地变动。
- id: power_basics
  label: 权力的基石——情绪控制
  source: 权力的48条法则 (前言)
  summary: 控制情绪是通向权力最重要的技巧。愤怒会阻碍视野并增强敌人决心。爱和感情会遮蔽你审视他人自私心计的能力。你必须学会让爱与愤怒不影响你的计划和策略。
  quote: 这些技巧中最重要的，也是权力最关键的基石，就是控制自己情绪的能力。对任何情况或局面都产生情绪上的反应是通向权力道路最大的障碍，这样的错误会让你付出巨大的代价。
- id: power_amoral
  label: 权力超越道德
  source: 权力的48条法则 (前言)
  summary: 权力在本质上是与道德无关的。必须根据形势变化而非根据善恶来洞察情势、做出判断和应对。权力是一场竞赛，以行动的结果而非道德意图来决定输赢。
  quote: 在本质上，权力是与道德无关的，是超越道德范畴的。要想获取权力，最重要的技能之一，就是能够根据形势变化而不是根据善恶来洞察情势，做出判断和应对。
- id: court_as_world
  label: 现代世界就是巨大的宫廷
  source: 权力的48条法则 (前言)
  summary: 我们现在所处的世界与古代宫廷相似——必须表现得文明高尚但实际充满权力争斗。如果过于严守规则就会被聪明对手打败。与其抗拒不如精于权力之道。
  quote: 整个世界就像一个勾心斗角的巨大宫廷，我们都身陷其中，如果试图置身于游戏之外，那是徒劳无益的。因为那只会使你失去力量，而失去力量你将会陷入悲惨的境地。
- id: patience
  label: 耐心是权力之神的美德
  source: 权力的48条法则 (前言)
  summary: 权力不是天生的需要耐心培养。耐心什么都不需要只需要时间。如果你给予足够的时间眼光放远些一切美好的事情都会发生。缺乏耐心让你变得虚弱。
  quote: 如果欺诈是你武器库中最锐利的武器，那么对任何事情都保持足够的耐心，则是你必不可少的盾牌。耐心可以防止你犯下愚蠢的大错。
- id: deception_art
  label: 欺诈是权力角逐场上最强有力的武器
  source: 权力的48条法则 (前言)
  summary: 要获得权力需要有扮演千面人的能力。戴上多种面具准备好各种各样欺骗的诡计。欺诈是文明社会高度发达的一种艺术。人类之所以与动物有区别就在于说谎和欺骗的能力。
  quote: 欺骗和伪装不应简单地看成是丑恶的和不道德的，人与人之间的交际互动在很多方面都需要欺骗。从某种意义上说，人类之所以与动物有区别，就是在于人类有说谎和欺骗的能力。
- id: psychologist_skill
  label: 成为出色的心理学家
  source: 权力的48条法则 (前言)
  summary: 要成为操控权力的专家你必须能透过重重迷雾洞悉别人隐藏的动机。永远不要完全信任任何人而应该研究每一个人包括朋友和你所爱的人。这是最了不起的能力。
  quote: 要成为操控权力的专家，你还应该是一位出色的心理学家，能透过重重迷雾，洞悉别人隐藏的动机——这是最了不起的能力，有助于你取得权力。

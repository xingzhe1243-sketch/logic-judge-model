source: 孙子兵法·鬼谷子·三十六计 — 兵书三绝
description: 中国古典战略智慧完整框架：军事战略、权谋术、诡道体系
core_concepts:
- id: dao_tian_di_jiang_fa
  label: 道天地将法（五事）
  source: 孙子兵法 第一篇 始计
  summary: >-
    孙子提出决定战争胜负的五项根本要素：道（政治民心）、天（天时）、地（地利）、将（将领）、法（法制）。道指民众与君主意志一致，可与之共生死；天指阴阳寒暑时令；地指远近险易广狭；将指智信仁勇严五德；法指编制、职责、后勤。五事是战略分析的总框架。
  quote: 故经之以五事 ［1］ ，校之以计 ［2］ ，而索其情：一曰道，二曰天，三曰地，四曰将，五曰法。道者，令民与上同意也，故可以与之死，可以与之生，而不畏危。
- id: zhi_ji_zhi_bi
  label: 知己知彼
  source: 孙子兵法 第三篇 谋攻
  summary: >-
    了解自己和了解对方，才能在斗争中立于不败之地。孙子认为知彼知己者百战不殆，不知彼而知己者一胜一负，不知彼不知己者每战必殆。这一原则超越了军事领域，成为一切竞争性活动的通用准则。
  quote: 故曰：知彼知己者，百战不殆；不知彼而知己，一胜一负；不知彼，不知己，每战必殆。
- id: bu_zhan_er_qu_ren
  label: 不战而屈人之兵
  source: 孙子兵法 第三篇 谋攻
  summary: >-
    战争的最高境界不是通过交战取胜，而是通过谋略迫使敌人不战而降。孙子提出上兵伐谋（挫败敌方的战略意图），其次伐交（破坏敌方的外交联盟），其次伐兵（击败敌方的军队），其下攻城（强攻城池是最不得已的选择）。
  quote: 是故百战百胜，非善之善者也；不战而屈人之兵，善之善者也。
- id: chu_qi_zhi_sheng
  label: 出奇制胜
  source: 孙子兵法 第五篇 兵势
  summary: 用兵作战以正兵当敌、以奇兵取胜。正奇相互转化，无穷无尽。孙子以五声五色五味为喻，说明正奇变化的无穷性。奇正理论是孙子军事哲学的核心方法论之一。
  quote: 凡战者，以正合，以奇胜。故善出奇者，无穷如天地，不竭如江河。终而复始，日月是也；死而复生，四时是也。
- id: xian_shi_er_hou_zhan
  label: 先胜而后求战
  source: 孙子兵法 第四篇 军形
  summary: >-
    善于用兵者先创造不可被战胜的条件（先为不可胜），再等待敌人可以被战胜的时机（以待敌之可胜）。胜利的军队总是在具备必胜条件后才寻求交战，失败的军队总是先交战再侥幸求胜。这一原则强调充分准备和对胜负条件的冷静评估。
  quote: 故善战者，立于不败之地，而不失敌之败也。是故胜兵先胜而后求战，败兵先战而后求胜。
- id: yi_shi_dai_lao
  label: 以逸待劳
  source: 孙子兵法 第六篇 虚实
  summary: >-
    通过调动敌人使其疲惫，而我方保持精力充沛。孙子主张善战者致人而不致于人（调动敌人而不被敌人调动），使敌人千里而来、前后不相及、众寡不相恃、贵贱不相救，从而以整体的优势对抗分散的劣势。
  quote: 凡先处战地而待敌者佚 ［1］ ，后处战地而趋战者劳。故善战者，致 ［2］ 人而不致于人。
- id: shui_zhi_ren_shi
  label: 因敌制胜（水形）
  source: 孙子兵法 第六篇 虚实
  summary: >-
    用兵如同流水，水的形态根据地形而变，用兵的方法根据敌情而变。孙子强调兵无常势、水无常形，能够根据敌人的变化而灵活调整以取胜的，才叫作用兵如神。这是孙子灵活应变思想的集中体现。
  quote: 夫兵形 ［1］ 象水，水之形避高而趋下；兵之形避实而击虚。水因地而制流，兵因敌而制胜。故兵无常势，水无常形；能因敌变化而取胜者，谓之神。
- id: jun_zheng_zhi_dao
  label: 军争之道（迂直之计）
  source: 孙子兵法 第七篇 军争
  summary: >-
    争夺先机之利是战争中最困难的部分，需要把迂远的路当作直路来走（以迂为直），把不利条件转化为有利条件（以患为利）。孙子还提出「兵以诈立，以利动，以分合为变」的原则，以及「用兵八戒」：高陵勿向、背丘勿逆、佯北勿从、锐卒勿攻、饵兵勿食、归师勿遏、围师必阙、穷寇勿迫。
  quote: 军争之难者，以迂为直，以患为利。故迂其途，而诱之以利，后人发，先人至，此知迂直之计者也。
- id: jiu_bian_zhi_shu
  label: 九变之术
  source: 孙子兵法 第八篇 九变
  summary: >-
    将领需通晓九种战场变通之术，在五种危险地形中做出正确决策。孙子提出「智者之虑，必杂于利害」——明智的考虑必须兼顾利害两面。在有利条件下要考虑到不利因素（杂于利而务可信），在不利条件下要看到有利因素（杂于害而患可解）。
  quote: 是故智者之虑，必杂 ［1］ 于利害。杂于利，而务可信 ［2］ 也；杂于害，而患可解也。
- id: yong_jian_zhi_dao
  label: 用间之道
  source: 孙子兵法 第十三篇 用间
  summary: >-
    情报是战争决策的基础。孙子将间谍分为五类：因间（利用敌方官员）、内间（收买敌方官吏）、反间（使敌方间谍为我所用）、死间（传递假情报）、生间（活着返回报告）。强调「兵之要，人之司命」，用间是战争中最关键的投入。
  quote: 故明君贤将，所以动而胜人，成功出于众者，先知也。先知者，不可取于鬼神，不可象于事 ［2］ ，不可验于度 ［3］ ，必取于人，知敌之情者也。
- id: bai_he
  label: 捭阖
  source: 鬼谷子 第一篇 捭阖
  summary: >-
    捭（开放/开启）与阖（闭合/封闭）是游说和谋略的根本方法。捭是公开言论以探测对方真实意图，阖是沉默退守以观察对方反应。捭阖之道要求根据时势变化灵活切换开放与封闭的状态，是鬼谷子纵横术的哲学基础。
  quote: >-
    捭之者，开也、言也、阳也；阖之者，闭也、谋也、阴也。阴阳其和，终始其义 ［4］ 。故言长生、安乐、富贵、尊荣、显名、爱好、财利、得意、喜欲为阳，曰"始"。故言死亡、忧患、贫贱、苦辱、弃损、亡利、失意、有害、刑戮、诛罚为阴，曰"终"。
- id: fan_ying
  label: 反应
  source: 鬼谷子 第二篇 反应
  summary: >-
    反应之道是投石问路、以静制动的方法。通过故意抛出言辞来试探对方的反应（以反求复），从对方的表现中推断其真实意图。善于钓言的纵横家如同张网捕兽，通过反复试探来捕获对方的真实想法。
  quote: >-
    古之大化者 ［1］ ，乃与无形 ［2］ 俱生。反 ［3］ 以观往，覆 ［4］ 以验来；反以知古，覆以知今；反以知彼，覆以知己。动静虚实之理，不合于今，反古而求之。
- id: nei_jian
  label: 内揵
  source: 鬼谷子 第三篇 内揵
  summary: >-
    内揵之术讲如何获得君主的信任和亲近，从而能够深入参与核心决策。通过揣摩君主的内心需求、情感倾向和思维方式，找到与之契合的切入点，进献谋略并建立稳固的关系。核心是「得其情，乃制其术」——掌握真实情况才能施展权术。
  quote: 故远而亲者，有阴德 ［1］ 也；近而疏者，志不合也；就而不用者，策不得 ［2］ 也；去而反求者，事中 ［3］ 来也；
- id: di_xi
  label: 抵巇
  source: 鬼谷子 第四篇 抵巇
  summary: >-
    抵巇之术讲如何发现和利用事物中的缝隙与裂痕。巇（裂缝）是事物发展的转折点，在裂痕初现时就能察觉并加以利用，可以化解危机或创造机会。抵巇有五法：塞（堵塞）、却（退让）、息（平息）、匿（隐藏）、得（获取）。
  quote: >-
    巇 ［6］ 者，罅 ［7］ 也。罅者，涧 ［8］ 也。涧者，成大隙也。巇始有朕 ［9］ ，可抵而塞，可抵而却，可抵而息，可抵而匿 ［10］ ，可抵而得。此谓抵巇之理也。
- id: fei_qian
  label: 飞箝
  source: 鬼谷子 第五篇 飞箝
  summary: >-
    飞箝之术是用褒扬赞美之辞（飞言）来箝制控制对方的方法。先以夸赞奉承获取对方的好感和信任，继而引导其按照自己的意图行事。使用时需要观察对方的智慧、才能、品性和好恶，有的放矢，使对方在不知不觉中顺从。
  quote: 引钩 ［1］ 箝 ［2］ 之辞，飞而箝之。钩箝之语，其说辞也，乍同乍异。其不可善者：或先征之，而后重累 ［3］ ；或先重以累，而后毁之；
- id: wu_he
  label: 忤合
  source: 鬼谷子 第六篇 忤合
  summary: >-
    忤合之术讲如何在敌对阵营之间做出选择与转向。忤（背离）与合（趋附）是权变的两个方面。纵横家不忠诚于特定的君主或国家，而是忠诚于自己的道——根据时势判断谁将取得天下，然后辅佐之。所谓「合于彼而离于此」——选择一方就必须背离另一方。
  quote: >-
    凡趋合倍反 ［1］ ，计有适合。化转环属 ［2］ ，各有形势。反覆 ［3］ 相求，因事为制 ［4］ 。是以圣人居天地之间，立身、御世 ［5］ 、施教、扬声、明名也，必因事物之会，观天时之宜，
- id: chuai_mo
  label: 揣摩
  source: 鬼谷子 第七、八篇 揣篇、摩篇
  summary: >-
    揣是估量对方的实力和形势，摩是反复试探推敲以确认真实意图。揣包括量权（衡量对方实力）和揣情（揣测对方真实情感）。摩是在揣的基础上进一步验证，如同钓鱼时反复试探鱼饵是否被咬。揣摩结合是游说和决策的前提。
  quote: >-
    古之善用天下者，必量 ［1］ 天下之权 ［2］ ，而揣 ［3］ 诸侯之情 ［4］ 。量权不审 ［5］ ，不知强弱轻重之称 ［6］ ；揣情不审，不知隐匿变化之动静 ［7］ 。
- id: quan_mou
  label: 权谋
  source: 鬼谷子 第九、十篇 权篇、谋篇
  summary: >-
    权篇讲如何权衡利弊、选择恰当的言辞和策略；谋篇讲如何设计和实施谋略。鬼谷子提出「谋之于阴而用之于阳」——谋略在暗中策划，在公开场合实施。用谋需根据对方的智慧程度：与智者言依于博，与博者言依于辨，与辨者言依于要。
  quote: >-
    故口者，机关 ［1］ 也，所以关闭情意也。耳目者，心之佐助 ［2］ 也，所以窥覸 ［3］ 奸邪。故曰：参 ［4］ 调而应，利道 ［5］ 而动。故繁言 ［6］ 而不乱，翱翔 ［7］ 而不迷，变易而不危
    ［8］ 者，睹要得理。
- id: jue_ce
  label: 决篇（决策之道）
  source: 鬼谷子 第十一篇 决篇
  summary: >-
    决策是解决问题的关键，鬼谷子提出凡决物必托于疑者——决策的对象是疑难问题。善决者善于把握决断的时机，在五种情况下应当立即决断（王公大人之事、免于危难者、为先王之命者、刘氏奉公者、可为福长者）。犹豫不决是决策的大忌。
  quote: 凡决物 ［1］ ，必托 ［2］ 于疑者。善其用福，恶其有患。善至于诱也，终无惑偏。有利焉，去其利则不受也，奇之所托 ［3］ 。
- id: man_tian_guo_hai
  label: 瞒天过海
  source: 三十六计 第一计 胜战计
  summary: >-
    利用人们习以为常的惯性思维来隐藏行动。当某种行为反复出现后，人们会逐渐失去警惕，此时即可在公开的掩饰下进行秘密行动。核心在于「阴在阳之内，不在阳之对」——秘密隐藏在公开的事物之中。
  quote: 备周则意怠 ［1］ ；常见则不疑。阴在阳之内，不在阳之对 ［2］ 。太阳，太阴 ［3］ 。
- id: wei_wei_jiu_zhao
  label: 围魏救赵
  source: 三十六计 第二计 胜战计
  summary: 当敌人力量集中时，避免正面攻击，转而攻击其后方要害，迫使敌人回师救援。这样既解除了敌方的正面威胁，又可在运动中伺机歼敌。核心是以迂为直、攻其必救。
  quote: 共敌不如分敌 ［1］ ，敌阳不如敌阴 ［2］ 。
- id: jie_dao_sha_ren
  label: 借刀杀人
  source: 三十六计 第三计 胜战计
  summary: 自己不直接出手，利用第三方力量去消灭敌人。通过挑拨离间、制造矛盾等手段，诱使他人代自己完成打击目标。核心在于保存自身实力同时达到目的。
  quote: 敌已明，友未定 ［1］ ，引友杀敌，不自出力，以《损》推演 ［2］ 。
- id: yi_yi_dai_lao_36
  label: 以逸待劳
  source: 三十六计 第四计 胜战计
  summary: 通过控制局势使敌人疲惫消耗，而我方保持充分准备和精力。主动防御、控制战场节奏，利用时间和空间来削弱敌人的战斗力，然后在其虚弱时发起反击。
  quote: 困敌之势 ［1］ ，不以战；损刚益柔 ［2］ 。
- id: chen_h饥_dda_liang
  label: 趁火打劫
  source: 三十六计 第五计 胜战计
  summary: 当敌人处于困境或混乱时，乘机出击获取利益。这一策略要求敏锐把握时机——一旦发现敌方内部出现问题，立即果断行动，扩大战果。
  quote: 敌之害大 ［1］ ，就势取利，刚决柔也 ［2］ 。
- id: sheng_dong_ji_xi
  label: 声东击西
  source: 三十六计 第六计 胜战计
  summary: >-
    表面上制造攻击东方的声势，实际上却攻击西方。通过佯攻迷惑敌人，使其防不胜防。此计成功的关键在于敌人的意志是否混乱——在被误导的情况下，敌方的防御部署就会失去效力。
  quote: 敌志乱萃 ［1］ ，不虞 ［2］ ，坤下兑上 ［3］ 之象，利其不自主 ［4］ 而取之。
- id: wu_zhong_sheng_you
  label: 无中生有
  source: 三十六计 第七计 敌战计
  summary: >-
    以虚假的伪装欺骗敌人，但从虚假变为真实——让敌人把虚假当作真实，把真实当作虚假。这一策略的精髓在于虚实转换：先暴露虚假（无），让敌人产生习惯性的轻视；再将真实隐藏其中（有），在关键时刻发动。
  quote: 诳 ［1］ 也，非诳也，实其所诳也 ［2］ 。少阴、太阴、太阳 ［3］ 。
- id: an_du_chen_cang
  label: 暗度陈仓
  source: 三十六计 第八计 敌战计
  summary: 用公开的行动吸引敌人注意力（明修栈道），同时暗中进行真正的行动（暗度陈仓）。与声东击西的区别在于：此计强调双方的实际行动部署，而非仅靠声威迷惑。
  quote: 示之以动，利其静而有主，益动而巽 ［1］ 。
- id: shang_wu_ti_huan
  label: 上层抽梯（上屋抽梯）
  source: 三十六计 第二十八计 并战计
  summary: 故意诱使敌人进入有利我方的境地（上屋），然后截断其后路（抽梯），使其陷入进退两难的困境。关键在于以小利引诱敌人自愿深入，然后断其后援。
  quote: 假之以便，唆之使前，断其援应，陷之死地。遇毒，位不当也 ［1］ 。
- id: kong_cheng_ji
  label: 空城计
  source: 三十六计 第三十二计 败战计
  summary: 在自己实力空虚时，故意显示空虚以迷惑敌人，使敌人怀疑其中有诈而不敢进攻。这是一个高风险的心理策略——利用的是对方多疑的心理和对反常现象的警惕。
  quote: 虚者虚之 ［1］ ，疑中生疑；刚柔之际 ［2］ ，奇而复奇。
- id: fan_jian_ji
  label: 反间计
  source: 三十六计 第三十三计 败战计
  summary: 利用敌人的间谍来传递假情报，或者策反敌人的间谍为我所用。使敌人内部产生猜疑和矛盾，从而自毁长城。反间的关键在于制造疑阵——让敌人无法判断真假信息。
  quote: 疑中之疑 ［1］ 。比之自内，不自失也 ［2］ 。
- id: ku_rou_ji
  label: 苦肉计
  source: 三十六计 第三十四计 败战计
  summary: 通过自我伤害来获取敌人的信任。人们通常认为人不会伤害自己，因此当看到对方受到伤害时就会放松警惕。苦肉计利用这一心理定势，以真实的代价换取敌人的信任和麻痹。
  quote: 人不自害，受害必真；假真真假，间以得行 ［1］ 。童蒙之吉，顺以巽也 ［2］ 。
- id: lian_huan_ji
  label: 连环计
  source: 三十六计 第三十五计 败战计
  summary: >-
    多计并用，环环相扣，使敌人陷入连环陷阱。先让敌人自相拖累（如让敌军将领忙于应付内部事务），然后主力出击。连环计的关键在于每一步都为下一步创造有利条件，形成一个完整的策略链条。
  quote: 将多兵众，不可以敌，使其自累，以杀其势。在师中吉，承天宠也 ［1］ 。
- id: zou_wei_shang
  label: 走为上
  source: 三十六计 第三十六计 败战计
  summary: >-
    在敌我力量悬殊、局势不利时，主动撤退保全实力，等待时机东山再起。走为上并非消极逃跑，而是战略性撤退。在三十六计中，走为上是最后一计，意味着当所有计谋都失效时，保存实力就是最好的策略。
  quote: 全师避敌 ［1］ 。左次无咎，未失常也 ［2］ 。

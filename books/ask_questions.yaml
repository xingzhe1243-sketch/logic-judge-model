source: 学会提问 (Browne & Keeley 11th Ed.)
description: >-
  Asking the Right Questions — critical evaluation toolkit 本书核心：11个关键问题（Critical Questions）构成的批判性论证评估体系。
  按章节顺序：
core_concepts:
- id: alternative_causes
  label: 替代原因4类（Ch10）
  source: 《学会提问》第10章
  summary: >-
    观察到A与B相关时，至少有4种解释：①A是B的原因（直接因果）；②B是A的原因（反向因果）；③第三方因素C同时导致A和B（忽略常见原因）；④A和B纯属巧合或相互影响。
  quote: 记住：相关性或关联性并不能证明因果关系！
- id: data_deception
  label: 数据欺骗6项检查（Ch11）
  source: 《学会提问》第11章
  summary: >-
    ①数据来源/来历是否清楚？②平均值类型被掩盖？（平均数≠中位数≠众数）③全距和数值分布被忽略？④样本有偏差吗？⑤结论与数据是否匹配？（用一件事的结论证明另一件）⑥缺少比较信息？（只有绝对数值没有百分比，或反之）
  quote: 统计数据可能而且经常骗人。它们并不必然就能证明表面上想要证明的一切。（第11章）
- id: omitted_info
  label: 省略信息9问（Ch12）
  source: 《学会提问》第12章
  summary: >-
    ①反对者会提供什么理由？②遗漏的定义（关键词另一种定义会怎样？）③遗漏的价值取向或视角？④事实来源被省略？⑤程序细节（样本量、措辞）被省略？⑥其他收集证据技巧可能产生不同结果？⑦遗漏或不完整的数据？⑧省略的结果（正面/负面、短期/长期）？⑨预测的失败/失误被省略？
  quote: 因此你的任务就是判断你自己是否想成为这一选定目的的傀儡。
- id: value_conflicts
  label: 价值观冲突（Ch6）
  source: 《学会提问》第6章
  summary: >-
    书中明确列出的5组典型冲突：①忠诚vs诚实（该不该告诉父母姐姐有药瘾）②竞争vs合作（是否支持评分制）③媒体自由vs国家安全（每周总统新闻发布会是否明智）④秩序vs言论自由（应不应该监禁有种族主义思想的人）⑤理性vs冲动（打赌下注时该不该查赔率）。扩展可衍生更多组：平等vs自由、效率vs公平、个人主义vs集体主义、长远vs短期、环境vs发展、创新vs传统、权利vs责任。
  quote: 只有把这些价值观假设添加到论证过程中，各种理由才能从逻辑上支持结论。（第6章）
- id: ct_levels
  label: 批判性思维层次（Ch1）
  source: 《学会提问》第1章
  summary: >-
    两类思维方式：海绵式思维（被动吸收信息，不评判）vs 淘金式思维（主动提问质疑，决定取舍）。两种CT用途：弱势批判性思维（用CT捍卫已有信念）vs 强势批判性思维（用CT评估所有断言和信念，包括自己的）。
  quote: 弱势批判性思维是利用批判性思维来捍卫自己当前的信念。强势批判性思维是利用批判性思维来评估所有的断言和信念，尤其是对自己的断言和信念加以评估。（第1章）
- id: in_out_group
  label: 认知障碍清单（Ch2）
  source: 《学会提问》第2章
  summary: >-
    ①正确提问带来的不快（社交压力）；②思考过快（系统1vs系统2思维）；③刻板印象；④晕轮效应（光环效应）；⑤信念固着与确认性偏见；⑥可得性启发与近因效应；⑦答非所问；⑧自我中心与知识的诅咒；⑨一厢情愿（Truthiness）与奇迹式思维——批判性思维最大的障碍。
  quote: 治疗一厢情愿的良药，就是积极主动地使用本书教授的批判性思维方式。（第2章）
- id: issue_conclusion
  label: 论题与结论识别（Ch3）
  source: 《学会提问》第3章
  summary: >-
    论题分两类：描述性论题（过去/现在/未来如何存在）和规定性论题（什么该做/什么对错）。结论是作者希望你接受的信息。寻找结论的5个线索：①找论题是什么；②看指示词（因此、表明、由此可知、证明等）；③查开头和结尾；④排除不可能作为结论的东西（例证、数据、定义、背景、证据）；⑤检查作者背景和语境。
  quote: 小贴士：所谓结论，即是作者或演说者希望你接受的信息。
- id: reasons
  label: 理由识别（Ch4）
  source: 《学会提问》第4章
  summary: 理由就是支撑或证明结论的信念、证据、隐喻、类比和其他陈述。提示词：由于、因为这个原因、鉴于、由以下材料支撑、研究显示、第一/第二/第三等。
  quote: 判断一个人是否有理性，其主要标志就是看他的各种信念是否都有适当的证据来支撑。（第4章）
- id: ambiguity
  label: 歧义检查（Ch5）
  source: 《学会提问》第5章
  summary: >-
    歧义是指一个关键词可能存在多重含义的现象。检查方法：①在论题中找关键词；②在理由和结论中找关键词（越抽象越可能有多重解读）；③检测：将一个词的不同含义替换到论证中，如果不同含义影响理由对结论的支持效度，则找到重要歧义。注意附加感情色彩的语言（loaded
    terms）绕过描述性意义通道直接触发情感。
  quote: 你没有义务去评价那些表述不清的想法或选择。
- id: assumptions
  label: 假设识别（Ch6）
  source: 《学会提问》第6章
  summary: >-
    假设具有4个特征：①隐藏或没有明说出；②作者认为是理所当然的；③对决定结论有较大影响；④可能有一定的欺骗性。价值观假设：没有明说出来的喜欢一种价值观超过另一种的倾向。描述性假设：对世界过去/现在/未来是什么样的没有明说的信念。常见描述性假设：①发生在人们身上的事都是自己选择的结果；②演说者就是典型（以自己经历直白推论）；③这个世界是公正的；④因为以前发生过今后还会发生；⑤我的世界就是这个宇宙的中心。
  quote: 小贴士：所谓假设，就是一个信念，通常没有明说出来，而作者认为是理所当然，并用来证明外在的论证。
- id: fallacies
  label: 论证谬误清单（Ch7）
  source: 《学会提问》第7章
  summary: >-
    13种常见谬误：①人身攻击型（攻击人而非论证）；②滑坡谬误（设想采取步骤会引发不可控连锁事件）；③追求完美解决方案谬误（不能彻底解决就抛弃）；④诉诸公众谬误（多数人认同就是对的）；⑤诉诸可疑权威谬误（引用不具相关专长的权威）；⑥诉诸感情谬误（用强烈感情色彩分散注意力）；⑦稻草人谬误（歪曲对方观点便于攻击）；⑧虚假两难选择谬误（假想只有两种选择）；⑨乱扣帽子谬误（给行为贴标签冒充解释）；⑩计划谬误（低估完成时间）；⑪光环效应谬误（模糊品德词汇引发积极联想）；⑫转移话题谬误（插入不相干话题）；⑬循环论证谬误（结论本身已被假设为理由）。
  quote: 所谓谬误，就是论证中的欺骗手段，作者有可能利用这个欺骗手段来说服你采纳他的结论。（第7章）
- id: evidence_type1
  label: 证据效力：直觉/个人经历/典型案例/证言/专家意见（Ch8）
  source: 《学会提问》第8章
  summary: >-
    ①直觉——私密性、无法判断可靠性，警惕单凭直觉支撑的断言；②个人经历——容易出现'以偏概全谬误'，单一经历不足以构成有代表性的样本；③典型案例——具体生动但诉诸情感，分散对证据价值的注意力；④当事人证言——选择性、个人利益、省略信息、人为因素（信得过但未必可靠）；⑤专家意见——追问：专长领域？第一手/第二手资料？偏见/利益冲突？名声？
  quote: 对于事实断言，你要问的第一个问题就是："我为什么要相信它？"
- id: evidence_type2
  label: 证据效力：个人观察/研究报告/类比（Ch9）
  source: 《学会提问》第9章
  summary: >-
    ①个人观察——观察受价值观、偏见、态度、期待过滤，不提供'纯粹'观察；②科学研究——8个注意点（质量参差、互相矛盾、不能证明结论、研究人员也有偏见、被歪曲/简化、事实会随时间改变、人工条件问题、利益需求影响），特别注意样本覆盖率/范围/随机性、测量方法满意度、片面调查与问卷措辞偏见；③类比论证——关注两事物的相同/不同点及其相关性，寻找可替代的类比来检验。
  quote: 类比既能激发深刻的见解，同时又能蒙蔽我们。例如，类比在科学论证和法学论证中就极富成效。
- id: averages
  label: 三种平均值（Ch11）
  source: 《学会提问》第11章
  summary: >-
    ①平均数（mean）——总和÷数量，易被极端值拉高；②中位数（median）——排序后最中间的数值，不受极端值影响；③众数（mode）——出现频率最高的数值。同组数据三种平均值可能完全不同。需要同时了解全距（最大值-最小值）和分布。
  quote: 当你见到平均值的时候，一定要记得问一下："是平均数、中位数还是众数，平均值的含义不同会不会产生什么影响？"
- id: reasonable_conclusions
  label: 合理结论与二分式思维（Ch13）
  source: 《学会提问》第13章
  summary: >-
    二分式思维：非黑即白、非是即否，过度限制了选择范围。避免方法：①问'什么时候/什么地方/为什么目的'结论才准确；②使用条件句（如果……那么……）限定结论；③将论题重新表述为'我们该怎样处理这个问题'而非'要不要采取甲措施'。
  quote: 重大的问题，很少能用简单的"是"或绝对的"不是"来回答。

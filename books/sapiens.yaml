source: 人类简史 (Sapiens) — 基于原文完整提取的四大部分分析框架
description: Real original citations from the Chinese translation (林俊宏 译, 中信出版社 2014).
core_concepts:
- id: cognitive_revolution
  label: 认知革命
  source: 人类简史 (第1-4章)
  summary: 约7万年前智人发展出能够描述虚拟故事的语言能力，使大规模灵活合作成为可能，智人由此胜出并走出非洲。这是人类历史的起点。
  quote: >-
    "虚构"这件事的重点不只在于让人类能够拥有想象，更重要的是可以"一起"想象，编织出种种共同的虚构故事，不管是《圣经》的《创世记》、澳大利亚原住民的"梦世记"（Dreamtime），甚至连现代所谓的国家其实也是种想象。这样的虚构故事赋予智人前所未有的能力，让我们得以集结大批人力、灵活合作。
- id: gossip_theory
  label: 八卦理论
  source: 人类简史 (第2章)
  summary: 语言最初的重要功能是传递社会信息/八卦，让部落成员了解彼此的信用和关系，从而形成更大更稳定的合作群体。八卦维持着约150人的自然团体（邓巴数）。
  quote: >-
    大约在7万年前，现代智人发展出新的语言技能，让他们能够八卦达数小时之久。这下，他们能够明确得知自己部落里谁比较可信可靠，于是部落的规模就能够扩大，而智人也能够发展出更紧密、更复杂的合作形式。
- id: imagined_order
  label: 想象的秩序
  source: 人类简史 (第6-8章)
  summary: 由集体共同相信的虚构故事（法律、货币、国家、神）——'主体间'的现实。只要人们共同相信，它就有强大力量，能支撑数百万人的有效合作。
  quote: 想象建构的秩序并非个人主观的想象，而是存在于主体之间（inter-subjective），存在于千千万万人共同的想象之中。
- id: human_flood
  label: 毁天灭地的人类洪水
  source: 人类简史 (第4章)
  summary: 智人每到一处新大陆都会导致当地巨型动物群大规模灭绝。澳大利亚4.5万年前、美洲1.6万年前都经历了智人到来后的物种灭绝事件。
  quote: >-
    有些学者试着为人类脱罪，把这些物种灭绝的责任推给气候变迁（常常都是靠它来顶罪）。但要说智人完全无辜实在令人难以置信。澳大利亚巨型动物灭绝，有三大证据显示气候很难成为借口，而人类难辞其咎。
- id: sapiens_ascend
  label: 智人胜出的原因
  source: 人类简史 (第1-2章)
  summary: 智人胜出不是因为个人智力或体力，而是因为能够大规模灵活合作——这种能力建立在虚构故事之上。在认知革命之前，地球上同时存在多个人类物种（尼安德特人、直立人等）。
  quote: >-
    人类语言真正最独特的功能，并不在于能够传达关于人或狮子的信息，而是能够传达关于一些根本不存在的事物的信息。据我们所知，只有智人能够表达关于从来没有看过、碰过、耳闻过的事物，而且讲得煞有其事。
- id: agricultural_trap
  label: 农业革命是最大骗局
  source: 人类简史 (第5章)
  summary: 农业革命虽然使总人口增加，但对个体农民而言生活更糟——工作更繁重、营养更差、疾病更多。不是人类驯化了小麦，而是小麦驯化了人类。
  quote: 普遍来说，农民的工作要比采集者更辛苦，而且到头来的饮食还要更糟。农业革命可说是史上最大的一桩骗局。
- id: wheat_domesticated_humans
  label: 小麦驯化人类
  source: 人类简史 (第5章)
  summary: 小麦这种植物通过让智人改变生活方式来确保自己的繁衍：智人为它开垦土地、除草、浇水、施肥，放弃了狩猎采集的自由生活，反而成了为小麦服务的物种。
  quote: >-
    智人的身体演化目的并不是为了从事这些活动，我们适应的活动是爬爬果树、追追瞪羚，而不是弯腰清石块、努力挑水桶。于是，人类的脊椎、膝盖、脖子和脚底就得付出代价。研究古代骨骼发现，人类进到农业时代后出现了大量疾病，例如椎间盘突出、关节炎和疝气。此外，新的农业活动得花上大把时间，人类就只能被迫永久定居在麦田旁边。这彻底改变了人类的生活方式。其实不是我们驯化了小麦，而是小麦驯化了我们。
- id: pyramid_society
  label: 盖起金字塔
  source: 人类简史 (第6章)
  summary: 农业革命产生粮食剩余，支撑起精英阶层（国王、官员、士兵、祭司），形成了基于'想象的秩序'的复杂社会结构，从村落、城镇到王国和帝国。
  quote: 农业带来的压力影响深远，这正是后代大规模政治和社会制度的基础。
- id: writing_invention
  label: 文字发明
  source: 人类简史 (第7章)
  summary: 文字最初是为了满足农业社会日益复杂的行政需求——记录税收、财产和债务，而非记录文学或历史。最早的苏美尔文字是行政记账工具。
  quote: >-
    在公元前3500年~公元前3000年之间，一些不知名的苏美尔天才发明了一套系统，可以在人脑之外储存和处理信息，专为处理大量数字数据所量身打造。从此，苏美尔人的社会秩序不再受限于人脑的处理能力，而开始能走向城市、王国和帝国。苏美尔人所发明的这套数字处理系统，正是"书写文字"。
- id: history_no_justice
  label: 历史从无正义
  source: 人类简史 (第8章)
  summary: 人类社会的等级制度（种姓、阶级、种族歧视、性别不平等）并非自然或生物性的，而是由'想象的秩序'创造和维持的。
  quote: 然而历史的铁则告诉我们，每一种由想象建构出来的秩序，都绝不会承认自己出于想象和虚构，而会大谈自己是自然、必然的结果。
- id: money_trust
  label: 金钱——最普遍的信任体系
  source: 人类简史 (第10章)
  summary: 金钱的本质是一种'相互信任的系统'，不是物质财富，而是纯粹的文化概念。金钱是有史以来最普遍最有效的互信系统。
  quote: >-
    "信任"正是所有金钱形式最基本的原料。如果有个富裕的农民卖掉房舍田产换来一袋贝壳，还带着这袋贝壳前往远地的省份，那是因为他相信抵达之后，其他人会愿意用稻米、房屋和田地和他交换这些贝壳。所以，可以说金钱就是一种相互信任的系统，而且还不是随随便便的某种系统：金钱正是有史以来最普遍也最有效的互信系统。
- id: empire_dialectic
  label: 帝国的双重性
  source: 人类简史 (第11章)
  summary: 帝国通过暴力和压迫建立，但也促进了文化融合、科技传播和思想交流。大多数现代文化都是帝国遗绪，简单分为'好'或'坏'是片面的。
  quote: 然而，帝国也不是完全有害无益。如果说帝国就是样样不行，所有相关的事物都该抛弃，那世界上大多数的文化便将不复存在。
- id: religion_unifier
  label: 宗教——第三种统一力量
  source: 人类简史 (第12章)
  summary: >-
    宗教为脆弱的'想象的秩序'提供超人类的合法性。与金钱（交换媒介）和帝国（政治框架）并列，是人类统一三大力量之一。宗教是'规范及价值观的系统，建立在超人类的秩序之上'。
  quote: >-
    正因为所有的社会秩序和阶级都只是想象的产物，所以它们也十分脆弱，而且社会规模越大，反而就越脆弱。而在历史上，宗教的重要性就在于让这些脆弱的架构有了超人类的合法性。有了宗教之后，就能说法律并不只是人类自己的设计和想象，而是来自一种绝对的神圣最高权柄。
- id: mono_vs_poly
  label: 一神教与多神教
  source: 人类简史 (第12章)
  summary: 多神教承认多位神灵，本质上较宽容；一神教认为自己信奉唯一的神和唯一真相，更狂热、更热衷传教，也因此更易引发宗教冲突。
  quote: 多神论本质上就属于开明，很少迫害异教徒。
- id: buddhism_law
  label: 佛教——自然法则宗教
  source: 人类简史 (第12章)
  summary: 佛教不崇拜神灵，而是崇拜自然法则——'痛苦来自欲望'。要从痛苦中解脱就要放下欲望、训练心智，体验事物的本质。这是最重要的古代自然法则宗教。
  quote: 痛苦来自欲望；要从痛苦中解脱，就要放下欲望；而要放下欲望，就必须训练心智，体验事物的本质。
- id: history_chaos
  label: 历史的二级混沌系统
  source: 人类简史 (第13章)
  summary: 历史属于'二级混沌系统'——会受到预测的影响而改变，因此无法准确预测。研究历史不是为了预测未来，而是为了理解现状并非必然。
  quote: 历史的铁则就是：事后看来无可避免的事，在当时看来总是毫不明显。
- id: three_unifiers
  label: 三大统一力量
  source: 人类简史 (第9-13章)
  summary: 金钱（普遍的交换媒介）、帝国（政治融合框架）和宗教（超越性意义）是统一人类的三大力量，它们将分散的小文化逐渐融合为全球单一文明。
  quote: >-
    商业、帝国和全球性的宗教，最后终于将几乎每个智人都纳入了我们今天的全球世界。这个扩张和统一的过程并不是完全直线发展、一帆风顺。但纵观大局，可以看到从许多小文化到少数大文化再到最后的全球单一文化，应该是人类历史无法避免的结果。
- id: admit_ignorance
  label: 承认无知——科学革命的核心
  source: 人类简史 (第14章)
  summary: >-
    科学革命最核心的突破不是'知识的革命'而是'无知的革命'——现代科学愿意承认自己对最重要的问题一无所知。这与前现代知识体系（认为所有重要知识已被古人或神所知）形成根本对比。
  quote: 科学革命并不是"知识的革命"，而是"无知的革命"。真正让科学革命起步的伟大发现，就是发现"人类对于最重要的问题其实毫无所知"。
- id: science_empire_capital
  label: 科学、帝国与资本的联盟
  source: 人类简史 (第14-16章)
  summary: 三者形成了正反馈循环：科学提供知识和技术，帝国提供资金和探索场域，资本提供经济动力。这种'军-工-学复合组织'是欧洲称霸世界的根本原因。
  quote: 在过去500年间，科学、帝国和资本之间的回馈循环无疑正是推动历史演进的主要引擎。
- id: capitalism_creed
  label: 资本主义教条
  source: 人类简史 (第16章)
  summary: >-
    资本主义的核心教条：'生产的利润必须再投资于提高产量'。基于对未来的信任，信用制度推动指数级经济增长。亚当·斯密提出'利己即利他'——这是人类史上最革命性的经济概念。
  quote: >-
    亚当·斯密明确提出：人类全体财富的基础，就在于希望增加个人利润的自私心理。这一点可以说是人类历史上最革命性的概念，而且还不只是从经济的角度，也包括道德和政治的角度。
- id: slave_trade_capitalism
  label: 资本主义的黑暗面
  source: 人类简史 (第16章)
  summary: 资本主义无法保证利润以公平方式取得或分配。大西洋奴隶贸易、孟加拉大饥荒、刚果自由邦等都是贪婪的市场力量造成的灾难。资本主义杀害了数百万人，原因是冷漠和贪婪。
  quote: 这是自由市场资本主义美中不足之处。它无法保证利润会以公平的方式取得或是以公平的方式分配。
- id: industrial_revolution_energy
  label: 工业革命——能源转换的革命
  source: 人类简史 (第17章)
  summary: 工业革命核心是将热能转换为动能（蒸汽机），人类从依赖植物能源的局限中解放出来。能源的'限制'只在于知识而非实际储量——太阳每天提供的能量远超人类需求。
  quote: 工业革命的核心，其实就是能源转换的革命。我们已经一再看到，我们能使用的能源其实无穷无尽。讲得更精确，唯一的限制只在于我们的无知。
- id: consumerism
  label: 消费主义与现代伦理
  source: 人类简史 (第17章)
  summary: 资本主义需要消费主义来消化过剩产能——'投资'是有钱人的伦理，'购买'是普通人的伦理。这是人类史上第一次信众能真正达到宗教要求的条件。
  quote: 资本主义和消费主义的伦理可以说是一枚硬币的正反两面，将这两种秩序合而为一。有钱人的最高指导原则是——"投资！"而我们这些其他人的最高指导原则则是——"购买！"
- id: family_collapse
  label: 家庭与社群的崩溃
  source: 人类简史 (第18章)
  summary: 工业革命后，国家和市场取代了传统家庭和社群的功能（教育、养老、医疗、保险），个人被解放但也变得孤立。这是'解放的代价'。
  quote: 工业革命不过花了短短两世纪左右，就将这些单位粉碎成了原子。许多过去家庭和社群的功能，现在都被国家和市场取代。
- id: nuclear_peace
  label: 核子和平
  source: 人类简史 (第18章)
  summary: 核武器使超级大国之间的全面战争等于集体自杀，加上战争利润下降、和平红利上升以及全球文化转向和平主义，现代社会反而比历史上任何时期都更和平。
  quote: 核子末日的威胁促进了和平主义；和平主义大行其道，于是战争退散、贸易兴旺；贸易成长，也就让和平的利润更高，而战争的成本也更高。
- id: happiness_biology
  label: 快乐的生化本质
  source: 人类简史 (第19章)
  summary: 快乐主要由血清素、多巴胺和催产素等生化物质决定，而非外在条件。人类生化机制像恒温空调，限制了快乐波动的范围。中乐透和车祸一年后，幸福感通常回到基线。
  quote: >-
    生物学家认为，我们的心理和情感世界其实是由经过数百万年演化的生化机制所形塑。所有心理状态（包括主观幸福感）不是由外在因素决定，而是由神经、神经元、突触和各种生化物质构成的复杂系统而定。
- id: happiness_buddhist
  label: 佛教的快乐观
  source: 人类简史 (第19章)
  summary: 佛教认为快乐既不是主观愉悦也不是生命有意义，而在于放下对主观感受的追求。苦的真正根源是'追求'本身——无论追求什么都会陷入紧张和不满。
  quote: 根据佛教的观点，大多数人太看重自己的感受，以为快感就是快乐，不愉悦的感受就是受苦。然而，这是大大的误解。苦真正的根源就在于'追求'主观感受这件事。
- id: gilgamesh_project
  label: 吉尔伽美什计划——追求永生
  source: 人类简史 (第14章+第20章)
  summary: 科学革命的终极目标之一就是打败死亡。赫拉利将追求永生的科学工程称为'吉尔伽美什计划'。科技进步使人类寿命延长，但可能带来前所未有的不平等——永生只属于少数精英。
  quote: 科学革命的一大计划目标，就是要给予人类永恒的生命。如果觉得永生不死似乎还是个太遥远的目标，可以回想一下，我们现在的医药成就早就是几世纪前所绝对不敢想象的。
- id: sapiens_end
  label: 智人末日——智能设计取代自然选择
  source: 人类简史 (第20章)
  summary: 21世纪自然选择开始被智能设计取代，通过三种方式：生物工程（基因改造）、仿生工程（生化人）和无机生命工程（人工智能）。智人可能被超人类取代。
  quote: >-
    就在21世纪曙光乍现之时，情况已经有所改变：智人开始超越了这些界限。自然选择的法则开始被打破，而由智慧设计法则取而代之。有三种方式可能让智慧设计取代自然选择：生物工程、仿生工程与无机生命工程。
- id: become_god
  label: 变成神的这种动物
  source: 人类简史 (后记)
  summary: 赫拉利的最终警告：智人拥有了神的能力，但不负责任、贪得无厌，而且连想要什么都不知道——这是最危险的事。
  quote: 拥有神的能力，但是不负责任、贪得无厌，而且连想要什么都不知道。天下危险，恐怕莫此为甚。

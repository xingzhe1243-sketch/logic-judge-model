source: 学会提问 (Neil Browne & Stuart Keeley)
description: 批判性质询框架——淘金式思维10问，13种谬误，7种证据类型
critical_thinking_definition: '批判性思维 = 对思考过程的再思考。包含: 意识到一组互相关联的关键问题; 有能力恰当地提出和回答关键问题; 主动运用关键问题的意愿'
thinking_modes:
  sponge: '海绵式思维: 大量吸收信息，但被动、不评判'
  panning_for_gold: '淘金式思维: 主动与知识互动，提问质疑，决定取舍'
  weak_ct: '弱势批判性思维: 用批判性思维捍卫已有立场'
  strong_ct: '强势批判性思维: 用批判性思维检视一切主张，包括自己的'
core_values:
- '自主决断: 形成自己结论的勇气'
- '好奇求真: 倾听他人但不盲从'
- '谦逊: 承认自己可能忽视细节'
- '相信理性: 理性是最好的判断标准'
conversation_strategies:
- 问'为什么' — 追问理由
- 问'你说的'XX'是什么意思' — 澄清歧义
- 问'有哪些替代解释' — 拓宽思路
- 问'证据有多可靠' — 检验支撑
- 问'有没有反例' — 检验归纳强度
- 问'数据从哪里来' — 追溯来源
- 问'省略了什么信息' — 识别偏见
- 问'可以得出哪些合理结论' — 寻找多种可能
obstacles:
- '认知失调: 新证据与既有信念冲突时的不适'
- '圈内人/圈外人思维: 将世界划分为''我们''和''他们'''
- '信念固着: 即使证据否定也坚持原有信念'
- '可得性启发: 最容易想到的就被认为最可能'
- '答非所问: 回避问题而迎合情感需要'
- '自我中心: 只从自己的视角看问题'
- '一厢情愿: 因为希望所以相信'
core_questions:
- Q1 论题和结论是什么？ — 区分描述性论题(是什么)和规范性论题(应该怎样)
- Q2 理由是什么？ — 结论需要理由支撑，区分理由和只是重复结论
- Q3 哪些词语有歧义？ — 抽象词可能被模糊使用，检查关键词的具体含义
- Q4 什么是价值冲突和价值观假设？ — 作者默认了什么价值立场？
- Q5 什么是描述性假设？ — 作者默认了什么事实性的前提？
- Q6 推理中有没有谬误？ — 识别13种常见谬误
- Q7 证据有多可靠？ — 区分7种证据类型的可靠性
- Q8 有没有替代原因？ — 相关性不等于因果
- Q9 数据有没有欺骗性？ — 检查来源、平均值类型、样本偏差
- Q10 省略了什么重要信息？ — 主动寻找被忽略的反面证据
issue_types:
  descriptive: '描述性论题: 关于世界是什么、过去/现在/未来的事实'
  normative: '规范性论题: 关于世界应该怎样的价值判断'
finding_conclusions:
- '寻找指示词: 因此/所以/由此可见/这表明'
- '检查上下文: 结论通常在开头或结尾'
- '区分结论和理由: 用''因为''标记理由，''所以''标记结论'
- '排除法: 不是理由、不是背景的就是结论'
reasons:
- 理由=对结论的支撑，是信念之砖
- '用''因为''检测: 把''因为''放在某句话前面看是否支撑结论'
ambiguity_analysis:
- '找抽象词: 如''自由''''公平''''正义''''责任'''
- '角色扮演测试: 换不同立场的人理解这个词，含义会不同吗？'
- '检查歧义句: 同一个句子可能有多种解读'
assumptions:
  value_assumptions:
  - '冲突1: 忠诚vs.  honesty → 对朋友该忠诚还是诚实？'
  - '冲突2: 竞争vs. 合作 → 市场应该自由竞争还是政府干预？'
  - '冲突3: 平等vs. 自由 → 再分配促进平等但限制自由？'
  - '冲突4: 秩序vs. 言论自由 → 安全vs. 表达权？'
  - '冲突5: 效率vs. 公平 → 追求效率必然牺牲公平？'
  - '冲突6: 个人主义vs. 集体主义 → 个人权利优先还是集体利益优先？'
  - '冲突7: 理性vs. 情感 → 决策应基于理性分析还是情感需求？'
  - '冲突8: 长远vs. 短期 → 牺牲当下为长远值得吗？'
  - '冲突9: 环境vs. 发展 → 环保优先还是经济增长优先？'
  - '冲突10: 创新vs. 传统 → 拥抱变化还是维护传统？'
  - '冲突11: 权利vs. 责任 → 享有权利是否意味着承担同等责任？'
  descriptive_assumptions:
  - 世界如何运作的信念，隐藏的事实性前提
  - '检查: 这个结论在什么条件下才成立？'
fallacies:
- '人身攻击: 攻击提出论证者而非论证本身'
- '叙事谬误: 用看似合理的''故事''解释过去'
- '诉诸公众/群众: 因为很多人相信所以正确'
- '诉诸可疑权威: 权威在非专业领域的判断'
- '诉诸情感: 用情绪(恐惧/同情/自豪)代替推理'
- '稻草人: 歪曲/简化对方观点再攻击'
- '虚假两难/非黑即白: 制造只有两种选择的假象'
- '一厢情愿: 因为希望X真的所以X是真的'
- '偷换概念: 论证中关键术语含义发生改变'
- '诉诸未知/无知: 无法证伪所以为真'
- '以偏概全: 样本不足以支持结论'
- '过度简化因果关系: 将复杂结果归因于单一原因'
- '因果混淆: 将相关关系误认为因果关系'
evidence_types:
  直觉:
    reliability: 低
    when_useful: 作为起点而非终点
    question: 直觉的来源是什么？
  个人经历:
    reliability: 低
    when_useful: 个案不代表整体
    question: 这个案例是否典型？
  典型案例:
    reliability: 中
    when_useful: 生动但有误导风险
    question: 案例是否经过挑选？
  当事人证词:
    reliability: 低
    when_useful: 仅作参考
    question: 证词有利益偏向吗？
  权威意见:
    reliability: 中
    when_useful: 专业领域内可靠
    question: 权威在该领域吗？意见有共识吗？
  个人观察:
    reliability: 中
    when_useful: 直接观察比二手可靠
    question: 观察是否系统化？有无偏见？
  研究/数据:
    reliability: 高
    when_useful: 方法科学则最可靠
    question: 研究方法是否科学？样本量？可重复吗？
alternative_causes:
- 原因A→结果B
- 结果B→原因A(反向因果)
- 第三方因素X同时→A和B
- 纯属巧合
data_deception:
- '来源: 数据来自哪里？'
- '平均值类型: 平均数/中位数/众数的差异被掩盖'
- '全距/分布: 平均值掩盖了内部差异'
- '样本偏差: 样本不能代表总体'
- '结论与数据不匹配: 拿一件事的数据证明另一件事'
- '缺失比较: 没有同比/环比数据'
omitted_information:
- 反对者会提出什么理由？
- 定义/假设是否被省略？
- 有没有其他分类方式？
- 只说了好处没提坏处？
- 行动方案的长期负面效果？
- 谁没有受益？谁蒙受了损失？
- 负面证据被省略了吗？
reasonable_conclusions:
- 从同一套理由可能推导出多个合理结论
- '二分式思维警告: 非黑即白忽略了中间地带'
- '条件句限定: 问''这个结论在什么条件下成立？'''
- '重新表述论题: 从''是/否''转向''我们该怎么处理？'''

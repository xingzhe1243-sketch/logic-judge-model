source: 犯罪心理学：犯罪为何会发生 — Richard Wortley
description: '心理学取向的犯罪学整合理论框架 "Psychological Criminology: An Integrative Approach".'
core_concepts:
- id: psychological_criminology
  label: 心理学取向的犯罪学
  source: 第一章 引言 第一节
  summary: >-
    心理学取向的犯罪学是对犯罪行为和犯罪人的心理学研究，关注个体及其经历如何导致犯罪行为。不同于社会学取向关注社会结构对犯罪的影响，心理学取向聚焦于个体的生物学结构、人格、教育抚养方式、思维过程和所处情境等因素对犯罪行为的引发作用。心理学与社会学视角是互补的，而非竞争的。
  quote: 心理学取向的犯罪学可以被界定为通过对行为与精神过程的科学研究，增进对犯罪人及其犯罪心理的理解。
- id: crime_continuum
  label: 犯罪行为的连续体
  source: 第一章 第二节
  summary: >-
    犯罪行为在概念上应被视为一个连续体，如同智力和焦虑等个人属性一样服从正态分布。大部分人处于中间范围，极端守法者和极端犯罪者都是少数。几乎所有人都会在某些情境下实施轻微的违法行为（如税务欺诈、虚报差旅费），但这些行为不必然将个体定义为「犯罪人」。
  quote: 如同许多个人属性——智力、焦虑、自信等，犯罪行为在概念上也应当被视为一种连续体……大部分人是集中在中间部分的，同时也有极少数者处于极端位置。
- id: antisocial_personality
  label: 反社会人格障碍（APD）
  source: 第一章 第二节
  summary: >-
    反社会行为是一个临床概念，指违反社会规范或侵犯他人权利的行为。反社会人格障碍（APD）的典型症状包括欺骗性、冲动性、无责任感、缺乏懊悔、忽视他人福利、多次未能遵守社会规范。APD在DSM-IV-TR中有明确定义，但需要注意反社会人格者不等同于精神病患者。
  quote: >-
    稳定地、持续地表现出反社会行为者通常会被评估为具有反社会人格障碍（APD）。根据DSM-IV-TR，APD的典型症状有：欺骗性、冲动性、无责任感、缺乏懊悔、忽视他人福利、多次未能遵守社会规范。
- id: evolutionary_criminology
  label: 进化犯罪学
  source: 第二章 人类本性
  summary: >-
    进化心理学为理解犯罪行为的起源提供了宏观框架。从进化角度看，某些犯罪行为可能是人类在远古环境中形成的适应性策略在现代环境中的不恰当表达。例如，暴力犯罪可能源于男性间竞争配偶的进化压力，财产犯罪可能源于获取资源的进化策略。
  quote: >-
    当代进化理论将犯罪行为——甚至是由坚决反社会的个人实施的犯罪行为——视为人性的正常结果。我们现在称之为犯罪的行为并不是从犯罪开始的。它们是适应性行为，在它们最初进化的环境中，它们提供给了那些在繁衍过程中表现出它们的人竞争优势。
- id: crime_as_adaptive_strategy
  label: 犯罪作为适应性策略
  source: 第二章 第四节
  summary: >-
    进化理论将某些犯罪视为一种「选择性策略」——个体在特定环境条件下采取的行为策略，其目的是最大化自身的生存和繁殖收益。例如，高风险高回报的犯罪行为在某些社会环境中可能是一个理性的生存策略，尤其是在合法途径受限的情况下。
  quote: 有人提出犯罪行为已经演变为利他主义的一种基于基因的替代性策略。
- id: behavioral_genetics_crime
  label: 犯罪的行为遗传学
  source: 第三章 遗传
  summary: >-
    行为遗传学通过双胞胎研究和收养研究来评估遗传因素对犯罪的影响。同卵双胞胎（MZ）在犯罪行为上的一致性显著高于异卵双胞胎（DZ）。分开抚养的MZ双胞胎研究进一步证实了遗传的影响。荟萃分析表明，约有40-50%的犯罪倾向变异可归因于遗传因素。
  quote: 每项研究都显示MZ双胞胎的一致率比DZ双胞胎更高——平均是DZ双胞胎的两倍多，表明基因在犯罪中起着重要作用。
- id: molecular_genetics_crime
  label: 分子遗传学与犯罪
  source: 第三章 第四节
  summary: >-
    超越传统的双胞胎和收养研究，分子遗传学试图识别与犯罪行为相关的特定基因。研究集中在影响神经递质系统（如MAOA基因、5-HTT基因）和多巴胺系统的基因变异。但这些基因的影响是微小的，且与环境因素存在复杂的交互作用——基因与环境交互作用（G×E）是当前的主流观点。
  quote: 暴力和反社会行为中已经隐含了一些特定的基因。这并不意味着我们更接近于找到犯罪基因——因为没有这种基因——但这表明基因研究将留在犯罪学领域，注定会变得更加重要。
- id: gene_environment_interaction
  label: 基因—环境交互作用
  source: 第三章（扩展至第六章）
  summary: >-
    遗传倾向不是决定性的命运，而是与环境因素交互作用后才影响行为。例如，MAOA基因的低表达版本会增加个体的暴力倾向，但只有在个体同时经历童年虐待时才会实际提高暴力犯罪率。这一发现解释了为什么遗传相同的个体在不同环境中会发展出完全不同的行为结果。
  quote: >-
    基因与环境的相互作用意味着同一环境的影响因个体而异，这取决于个体的基因构成。而环境风险因素没有得到同等的验证，有些人在遗传上更容易受犯罪环境的影响，有些人则更灵活。换句话说，负责犯罪倾向的基因可能会保持休眠状态，除非它们受到特定环境条件的激活。
- id: neuropsychology_crime
  label: 犯罪的神经心理学
  source: 第四章 大脑
  summary: >-
    犯罪的神经心理学研究关注大脑结构和功能与犯罪行为的关系。关键发现包括：低静息心率（低唤醒水平）与反社会行为高度相关；前额叶功能障碍（影响冲动控制和决策能力）与暴力犯罪相关联；多巴胺和5-羟色胺等神经递质的失衡影响攻击性和冲动行为。
  quote: 反社会行为最一致的神经关联之一是低唤醒。实验表明，ECG和GSR测量的ANS功能和EEG测量的皮层脑电波活动显示出反社会个体的低唤醒特征。
- id: reward_dominance
  label: 奖励支配
  source: 第四章 第四节
  summary: >-
    奖励支配理论认为某些个体的行为系统对奖励信号过度敏感，对惩罚信号反应不足。这种神经心理学特征使得他们更容易被即时的回报（包括通过犯罪获得的回报）所吸引，而对潜在的负面后果（惩罚、被捕等）缺乏足够的抑制。这种模式与冲动性和感觉寻求密切相关。
  quote: 有人认为，在罪犯中，BAS的影响比BIS更大。因此，罪犯对奖励的预期比对惩罚的威胁更加敏感，他们的行为会倾向冲动，会弄巧成拙。
- id: prefrontal_dysfunction
  label: 前额叶功能障碍
  source: 第四章 第四节
  summary: >-
    前额叶皮质负责执行功能（计划、抑制控制、决策、社会认知）。前额叶功能障碍会削弱这些能力，导致个体易于冲动行事、难以预见行为的后果、在社会互动中出现判断失误。脑成像研究一致表明暴力犯罪者的前额叶活动水平低于正常对照。
  quote: 虽然大脑的许多结构在某个时候与反社会行为有关，但最一致的发现是额叶功能障碍，尤其是负责执行功能的前额叶皮质的功能障碍。
- id: eysenck_pen_theory
  label: 艾森克的PEN犯罪三要素理论
  source: 第五章 第三节
  summary: >-
    艾森克提出人格的三个核心维度——精神质（P）、外向性（E）、神经质（N）——与犯罪行为相关。高精神质者冷酷无情、缺乏共情；高外向性者寻求刺激、需要持续兴奋；高神经质者情绪不稳定、对压力反应过度。三者组合（P高+E高+N高）是犯罪倾向的典型人格剖面。
  quote: 当涉及犯罪行为时，高度精神质、高度外向和高度神经质的结合被认为是最有问题的特征组合。
- id: impulsivity_crime
  label: 冲动性与犯罪
  source: 第五章 第二节
  summary: >-
    冲动性是最稳定且最强的犯罪人格预测因素之一。冲动性表现为缺乏延迟满足的能力、行动不经思考、喜欢冒险。高冲动性的个体即使在清楚风险的情况下也会选择即时回报，容易被临时出现的机会所引诱。冲动性是连接许多其他犯罪风险因素（低自我控制、感觉寻求等）的核心通路。
  quote: 冲动是指对短期而不是长期后果的预期行为表现。冲动性在理论上和生物学上与感觉寻求有关，但是更特别地关注个人抑制或延迟自我满足欲望的能力。
- id: low_empathy
  label: 低共情与犯罪
  source: 第五章 第二节
  summary: >-
    共情是理解他人感受的能力，是抑制攻击行为和伤害他人的重要内在机制。低共情水平的个体难以理解或关心受害者的痛苦和感受，因此更容易实施伤害他人的行为。共情缺陷是精神病态（psychopathy）的核心特征之一，也是暴力犯罪和性犯罪的重要风险因素。
  quote: 共情是理解和分享他人情感状态的能力。这个定义确定了共情的两个组成部分：理解他人情感状态的认知能力和分享他人情感状态的情感能力。
- id: developmental_risk_factors
  label: 犯罪发展的风险因素
  source: 第六章 第二节
  summary: >-
    发展犯罪学识别了从产前到青春期影响犯罪行为的多层次风险因素：家庭结构（单亲、大家庭）、儿童虐待与忽视、父母管教方式（过度严厉或不一致）、学校教育失败、不良同伴影响、早婚/不稳定的亲密关系。这些风险因素具有累积效应——风险因素越多，犯罪可能性越高。
  quote: 本章研究了犯罪在整个生命过程中的发展，确定了犯罪的风险和保护因素，并提出了理论解释来解释这些因素所起的作用。
- id: LCP_vs_AL
  label: 终生持续型（LCP）vs 青少年期局限型（AL）
  source: 第六章 第四节
  summary: >-
    Moffitt提出两种截然不同的犯罪发展轨迹。终生持续型（LCP）罪犯：早年开始的神经心理缺陷与不良家庭环境交互作用，导致终身的犯罪生涯，尽管只占犯罪人口的少数但犯案量极大。青少年期局限型（AL）罪犯：占大多数，犯罪活动限于青少年时期，是正常的青春期叛逆与成年角色过渡之间的「成熟差距」的表现。
  quote: AL罪犯有短暂的犯罪生涯，涉及相对较晚的发作和较早的停止，而LCP罪犯在其一生中继续以相同的高犯罪率犯罪。
- id: attachment_crime
  label: 依恋与犯罪
  source: 第六章 第三节
  summary: >-
    鲍尔比的依恋理论认为，早期与照顾者形成的不安全依恋会影响个体的情感调节能力、人际信任和道德发展。不安全依恋（矛盾型、回避型、混乱型）与后来的反社会行为相关。安全依恋为自我调节和共情发展奠定基础，缺乏安全依恋的儿童更容易出现行为问题。
  quote: 安全的依恋有助于塑造一种以自信、合作和移情为特征的人际风格，而不安全的依恋风格会导致这些人际行为领域的缺陷。
- id: self_control_theory
  label: 自我控制理论
  source: 第六章 第三节
  summary: >-
    Gottfredson和Hirschi的一般犯罪理论认为低自我控制是犯罪行为的核心原因。低自我控制表现在：冲动性、追求即时满足、偏好简单任务而非复杂任务、喜欢冒险、关注自身而非他人、低挫折容忍度。自我控制在儿童期形成，受父母管教质量的影响，一旦形成则相对稳定。
  quote: 戈特弗雷德森和赫斯基的一般犯罪理论是犯罪学中相当有影响力和被广泛引用的理论之一。由于罪犯自制力低，因此在犯罪方面有多种表现的看法得到了大量的经验支持。
- id: classical_conditioning_crime
  label: 经典条件反射与犯罪
  source: 第七章 第二节
  summary: >-
    经典条件反射理论认为，犯罪行为可以通过刺激与反应的配对而习得。例如，某些原本中性的刺激（特定情境、人物、地点）通过与犯罪行为的反复配对，逐渐成为触发犯罪动机的条件刺激。相反，惩罚与恐惧的条件反射也是社会化的基础——对犯罪行为的恐惧感是条件性情绪反应的结果。
  quote: 经典的条件作用对于解释涉及对环境刺激的自主生理反应的犯罪是有用的。
- id: operant_conditioning_crime
  label: 操作性条件反射与犯罪
  source: 第七章 第三节
  summary: >-
    斯金纳的操作性条件反射理论认为，犯罪行为是受其后果塑造和维持的。如果犯罪行为获得正强化（如金钱、同伴赞扬、性满足）或负强化（如解除痛苦、逃脱厌倦），该行为的发生频率就会增加。犯罪行为的持续是因为其即时回报超过了延迟的惩罚（如被捕）。
  quote: 操作性条件反射也称为工具性条件反射，因为它适用于为实现某种目标而进行的行为。根据操作性条件反射模型，行为是由其产生的后果决定的。
- id: social_learning_crime
  label: 社会学习与犯罪
  source: 第七章 第四节
  summary: >-
    班杜拉的社会学习理论强调犯罪行为是通过观察和模仿他人（尤其是榜样人物）以及直接经验学习的。家庭、同伴、亚文化群体和媒体都是重要的犯罪学习来源。观察学习不仅包括具体的犯罪技巧，还包括对犯罪的态度、合理化中和技巧以及奖励预期。
  quote: >-
    社会学习理论是被广泛引用的犯罪心理学理论。社会学习理论也见于社会犯罪学——如萨瑟兰（Sutherland，1947）的差异联想理论——尽管社会学版本缺乏详细的行为框架和心理学方法的实验基础。
- id: differential_association
  label: 差异交往理论
  source: 第七章 第四节
  summary: >-
    萨瑟兰的差异交往理论结合社会学习视角：犯罪行为是在与亲密群体（尤其是同伴）的互动中习得的。个体犯罪倾向取决于其接触的有利于犯罪的定义（态度、合理化技巧）超过不利于犯罪的定义的程度。频率、持续时间、优先性和强度是最关键的交往参数。
  quote: >-
    社会学习理论也见于社会犯罪学——如萨瑟兰（Sutherland，1947）的差异联想理论——尽管社会学版本缺乏详细的行为框架和心理学方法的实验基础。埃科斯试图将社会学习的社会学和心理学传统结合在他的差异联想强化理论中。
- id: cognitive_scripts
  label: 认知图式与犯罪脚本
  source: 第八章 第四节
  summary: >-
    图式是组织化的知识结构，用于理解世界和指导行为。犯罪脚本是一种特殊的图式——存储于记忆中的标准化犯罪行动序列。有经验的罪犯会自动调用这些脚本，在适当的情境触发下快速做出反应。犯罪脚本来自直接经验和观察学习。
  quote: 脚本是一种特殊类型的图式，称为事件图式。事件图式包含日常活动所需的适当行为顺序。
- id: rational_choice_crime
  label: 理性选择与犯罪决策
  source: 第八章 第三节
  summary: >-
    理性选择观点认为罪犯在实施犯罪前会进行基本的成本和收益分析，权衡被捕风险、惩罚严重性和犯罪收益。但这种「理性」是有界理性——受到个体认知局限、时间压力和可用信息的限制。情境因素通过影响感知到的风险和收益来调节犯罪决策。
  quote: 理性选择的观点认为罪犯是效用最大化者，他们在决定是否犯罪时权衡犯罪行为的主观成本和利益。当犯罪行为的预期收益超过预期成本时，犯罪就会发生。
- id: neutralization_techniques
  label: 中和技术与道德脱离
  source: 第八章 第二节
  summary: >-
    罪犯常用一系列中和技巧来合理化犯罪行为，消除内心的罪恶感：否认责任（「不是我的错」）、否认伤害（「没人真正受伤」）、否认受害者（「他活该」）、谴责谴责者（「那些当官的更腐败」）、诉诸更高忠诚（「我是为兄弟才这么做」）。这些技巧通过认知重构允许个体在保持积极自我形象的同时实施犯罪。
  quote: 中立化和道德脱离是罪犯说服自己不要为罪行负责的借口。
- id: frustration_aggression
  label: 挫折—攻击假说
  source: 第八章 第二节
  summary: >-
    伯科威茨修正后的挫折—攻击理论认为：挫折（目标受阻）会引发愤怒和攻击准备状态，但攻击行为是否实际发生取决于情境线索（如武器的存在）和个体的习得反应模式。挫折导致的不是「攻击驱力」，而是一种情绪准备状态，加上适当的触发因素才会导致实际攻击。
  quote: 环境中令人沮丧的刺激的存在增加了一个人变得愤怒和采取积极行动的可能性，但不一定保证会有攻击。
- id: situational_crime_prevention
  label: 情境犯罪预防
  source: 第九章 第四节
  summary: >-
    情境犯罪预防是减少犯罪机会的系统性方法。其核心假设是：犯罪发生在犯罪动机与犯罪机会相遇之时。通过增加犯罪难度（目标加固）、提高犯罪风险（监控）、减少犯罪回报（财产标记）、降低犯罪挑衅（减少挫折）、去除犯罪借口（明确规则）等五种途径减少犯罪。
  quote: >-
    犯罪中情境因素的重要性得到了心理学和犯罪学理论和研究的坚实支持。像所有物种一样，从生态学的角度来看，人类是最容易被理解的，因为人类与其周围环境有着密切而动态的关系。犯罪行为的表现不可避免地取决于情境。
- id: routine_activity_theory
  label: 日常活动理论
  source: 第九章 第四节
  summary: >-
    Cohen和Felson的日常活动理论认为，直接接触的掠夺性犯罪需要三个要素在时间和空间上同时汇集：有动机的犯罪人、合适的目标（如无人看管的财物）、有效监控的缺失（缺乏守护者）。该理论解释了为什么社会结构变化（如女性就业增加、家庭外活动增多）会显著影响犯罪率——因为日常活动模式改变了三个要素的时空汇聚。
  quote: 科恩和费尔森认为，对犯罪的解释可以归结为三个基本要素在时间和空间上的巧合：（1）有动机的罪犯；（2）合适的目标；（3）缺乏针对违法行为的有能力的监视。
- id: deindividuation
  label: 去个性化
  source: 第九章 第二节
  summary: >-
    去个性化是个体在群体中丧失个人身份感和自我约束的现象。在匿名性、扩散责任和群体兴奋的状态下，个体可能做出通常不会做出的攻击或违法行为——如暴民暴力。津巴多的斯坦福监狱实验和米尔格拉姆的服从实验都展示了情境力量对个体行为的强大影响。
  quote: 作为一个群体中的一员，个体会产生一种自我意识降低的感觉，并引发一种心理上去个性的状态，称为去个性化。
- id: integrative_criminology
  label: 整合路径的优势
  source: 第十章 结论
  summary: >-
    心理学取向的犯罪学理论整合了从进化到情境的多个分析水平——生物学、人格、发展、学习、认知和情境因素——形成一个多层次的解释框架。每个理论分支解释犯罪的不同方面，而非互相竞争。整合路径比任何单一理论提供更完整的画面，并对犯罪预防和罪犯矫正有更全面的实践指导意义。
  quote: 犯罪行为是一个复杂的现象，犯罪成因因罪犯个体类型的差异而不同。整合的心理学路径能够更好地帮助理解罪犯的差异性。

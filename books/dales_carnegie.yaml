source: 《人性的弱点》引擎模块
description: ====================== 戴尔·卡耐基 著 (增订全译版) 引擎用途：提供书本核心概念、原文引证、运行时上下文和关键词检索
core_concepts:
- id: 原则一_不批评不指责不抱怨
  source: 第一篇·第1章
  summary: 批评不会产生任何结果，它使对方的防御模式大开，竭力为自己辩护。批评也是危险的，它会伤害人的自尊和自我价值感，让人怀恨在心。
  quote: 批评不会产生任何结果，因为它使对方的防御模式大开，竭力为自己辩护。批评也是危险的，它会伤害人的自尊和自我价值感，让人怀恨在心。
  chapter: '01'
- id: 原则二_真诚赞美
  source: 第一篇·第2章
  summary: 人性中最深的冲动是渴望感觉自己很重要。真诚的赞美能激发人的潜能，改变人的一生。欣赏和谄媚的区别在于：前者发自内心，后者言不由衷。
  quote: 世界上最能消灭一个人的斗志的，就是上司的讥讽。我从不批评任何人，我相信人需要激励才能工作。我总是急于称赞，迟于挑刺儿。
  chapter: '02'
- id: 原则三_诉诸对方需要
  source: 第一篇·第3章
  summary: 世界上唯一能影响他人的方法，就是谈论他们想要的东西，并告诉他们如何获得。首先诉诸对方的内在需要，整个世界都会向你招手。
  quote: 世界上唯一能影响他人的方法，就是谈论他们想要的东西，并告诉他们如何获得。
  chapter: '03'
- id: 原则四_真的喜欢别人
  source: 第二篇·第4章
  summary: 不关心别人的人会活得最苦，也最贻害他人，所有的人类失败都来自这些人。真的喜欢别人的人两个月内交到的朋友，比努力让别人喜欢自己的人花两年时间交到的朋友更多。
  quote: 不关心别人的人会活得最苦，也最贻害他人，所有的人类失败都来自这些人。
  chapter: '04'
- id: 原则五_微笑
  source: 第二篇·第5章
  summary: 行动比语言更雄辩，一个微笑传递的信息是：我喜欢你，你让我高兴。微笑的人一般更能高效地管理、教育、销售，还能养育出更幸福的孩子。
  quote: 查尔斯·施瓦布对我说，自己一笑值千金56。
  chapter: '05'
- id: 原则六_记住名字
  source: 第二篇·第6章
  summary: 一般人很在意自己的姓名，甚于全世界的姓名之和。记住那个名字并自然地叫出口，就已经巧妙且有效地恭维对方了。
  quote: 吉姆·法雷早就发现，一般人很在意自己的姓名，甚于全世界的姓名之和。记住那个名字，并自然地叫出口，你就已经巧妙且有效地恭维对方了。
  chapter: '06'
- id: 原则七_倾听
  source: 第二篇·第7章
  summary: 倾听是我们能够给予任何人的最高赞美。全心关注是一种微妙的恭维，很少有人能抵抗得住。
  quote: 倾听是我们能够给予任何人的最高赞美。
  chapter: '07'
- id: 原则八_聊对方兴趣
  source: 第二篇·第8章
  summary: 直抵心底的康庄大道，就是聊对方最关注的话题。聊对方感兴趣的话题，能给双方都带来好处。
  quote: 罗斯福知道，其他领袖也知道，直抵心底的康庄大道，就是聊对方最关注的话题。
  chapter: 08
- id: 原则九_让对方感觉重要
  source: 第二篇·第9章
  summary: 永远要让别人感到他很重要。这是人性中最迫切的底层渴望。黄金法则：你希望别人如何待你，你就怎样去对待别人。
  quote: 这条法则就是：永远要让别人感到他很重要。
  chapter: 09
- id: 原则十_避免争论
  source: 第三篇·第10章
  summary: 争吵的结果10次有9次是双方更坚信自己正确。吵赢了还是输了——你让对方感觉卑微，伤了他的骄傲，他会对你的胜利怀恨在心。
  quote: 天底下赢得争辩的唯一方法，就是不争辩。要避开争吵，就像避开响尾蛇和地震一样。
  chapter: '10'
- id: 原则十一_尊重对方意见
  source: 第三篇·第11章
  summary: 直接说对方错了，是一拳打在他的智力、判断力、骄傲和自尊上。要用"我可能错了，让我们仔细看看事实"这样的措辞。
  quote: 如果你说对方错了，你是在让他们甘心服你吗？不！你直接一拳打在他的智力、判断力、骄傲和自尊上了。
  chapter: '11'
- id: 原则十二_承认错误
  source: 第三篇·第12章
  summary: 如果知道自己一定会挨骂，主动替对方责备自己。听自己责备自己比听别人骂自己更容易接受。有勇气承认自己的错误会产生满足感。
  quote: 如果知道自己一定会挨骂，主动替对方责备自己，是不是更好呢？
  chapter: '12'
- id: 原则十三_友善开场
  source: 第三篇·第13章
  summary: 一滴蜂蜜比三升胆汁能够捉到更多的飞虫。温柔和友善永远比暴怒和强力更有力量。
  quote: 一滴蜂蜜比三升胆汁能够捉到更多的飞虫。
  chapter: '13'
- id: 原则十四_引导对方说对
  source: 第三篇·第14章
  summary: 一开始能引出的"对"越多，就越能牵住对方的思路。苏格拉底法的基础就是让对方说"对"。轻履者行远。
  quote: “回应一个‘不’字，”奥弗斯特里特73教授说，“就增加了一堵难克服的墙。当人说‘不’字时，人格中所有的骄傲都在逼他必须坚持到底。
  chapter: '14'
- id: 原则十五_让对方多说
  source: 第三篇·第15章
  summary: 让对方把话说完。他们对自己的事和问题比别人懂得多。如果不同意，也不要插嘴。耐心地听，真诚地鼓励对方充分说完。
  quote: 如果你不同意，也许忍不住插嘴，但不要这样做，很危险。他们倾诉的欲望还没结束……就不可能注意你想说什么。
  chapter: '15'
- id: 原则十六_让对方觉得是自己的主意
  source: 第三篇·第16章
  summary: 你自己发现的观点比别人硬塞进来的更值得相信。给建议，然后让对方自己得出结论。让对方感觉是自己在创作、自己在买。
  quote: 没有人喜欢被说服去买一个东西，也没有人喜欢被命令去做什么。我们都很喜欢认为，自己是在根据自己的个人意志或观念在买东西。
  chapter: '16'
- id: 原则十七_换位思考
  source: 第三篇·第17章
  summary: 试着理解别人为什么那么想、那么做。把自己真的放在他的位置上，你会免去很多烦恼，大大提高交际技术。
  quote: 如果我换上他的鞋，我会怎么做，我会有什么感觉？”你会免去很多烦恼，省下很多时间。
  chapter: '17'
- id: 原则十八_共情
  source: 第三篇·第18章
  summary: 说一句神奇的话："你现在这样感觉，我没有任何理由怪你，如果我是你，我一定也会是那个感觉。"理解他们的情绪，他们就会爱你。
  quote: 你现在这样感觉，我没有任何理由怪你，如果我是你，我一定也会是那个感觉。
  chapter: '18'
- id: 原则十九_诉诸高尚情操
  source: 第三篇·第19章
  summary: 人们做一件事一般有两重理由——好听的理由和真实的原因。所有人都在心底是理想家，所以为了改变人的意志，就要诉诸他们高尚的情操。
  quote: 人们做一件事，一般有两重理由，一重好听的理由，一重真实的原因。……为了改变人的意志，就要诉诸他们高尚的情操。
  chapter: '19'
- id: 原则二十_戏剧化表达
  source: 第三篇·第20章
  summary: 这是看戏的时代，光靠嘴说是不够的。事实要生动、有趣、让人身临其境。必须学会用情节说话而不是靠语言。
  quote: 这是看戏的时代，这个时代需要故事，光靠嘴说是不够的。是事实，就要生动、有趣、让人身临其境。
  chapter: '20'
- id: 原则二十一_抛出挑战
  source: 第三篇·第21章
  summary: 争胜的欲望和挑战是人们渴望战胜的本能。最大的激励因素是工作本身——如果工作有趣又激动人心，人们就会渴望做、渴望做好。
  quote: “要让事情顺利完成，”施瓦布说，“有时需要鼓励‘争’，我说的不是赤裸裸地争着赚钱，而是人们渴望战胜挑战。”
  chapter: '21'
- id: 原则二十二_先赞美后批评
  source: 第四篇·第22章
  summary: 如果先听到一些对我们长处的赞扬，我们就总能更容易接受不那么好听的话了。先赞赏，就像牙医动手前使用局部麻药一样。
  quote: 如果先听到一些对我们的长处的赞扬，我们就总能更容易接受不那么好听的话了。
  chapter: '22'
- id: 原则二十三_间接提醒
  source: 第四篇·第23章
  summary: 直接批评会招致憎恨。用间接的方式让人注意错误，改"但是"为"而"，能产生奇迹。
  quote: 间接地使人注意到自己的错误，会产生奇迹，尤其是当你面对的是敏感的人，他们强烈仇视任何直接的批评。
  chapter: '23'
- id: 原则二十四_先说自己错
  source: 第四篇·第24章
  summary: 如果批评方先低下身段，先说自己远非完美，再提出批评，被批评的一方就更容易接受了。
  quote: 如果批评方先低下身段，先说自己远非完美，然后再提出批评，比起听对方历数自己的罪状来，被批评的一方就更容易接受了。
  chapter: '24'
- id: 原则二十五_用问句代替命令
  source: 第四篇·第25章
  summary: 建议比命令更容易让人接受。使用问句不仅能使命令更容易接受，还能提高对方的执行力。人们更乐意执行参与了决定过程的指令。
  quote: 使用问句，不仅能使命令更容易接受，还常能提高对方的执行力。
  chapter: '25'
- id: 原则二十六_保全颜面
  source: 第四篇·第26章
  summary: 保全人的面子是多么重要！花几分钟想一想，说一两句体贴的话，理解对方的视角，就可以缓解刺痛。伤害一个人的尊严是犯罪行为。
  quote: 我无权说或做任何事情，降低一个人在自己眼里的地位。我觉得他怎么样并不重要，他觉得自己怎么样才是重要的。
  chapter: '26'
- id: 原则二十七_称赞进步
  source: 第四篇·第27章
  summary: 只有一件事能激励对方持续成长，那就是夸赞最小的进步。赞扬就像阳光，可以温暖人的精神，没有它我们就无法开花成长。
  quote: 只有一件事能激励对方持续成长，那就是夸赞最小的进步。
  chapter: '27'
- id: 原则二十八_给美名
  source: 第四篇·第28章
  summary: 如果你想改善一个人的某个方面，就要表现得仿佛那方面的特点已经是他的优点了。给人一个好名声让他去实现，他会竭尽全力不愿使你的愿望落空。
  quote: 莎士比亚说：“如果你没有某种品德，就假设你已经有了。”
  chapter: '28'
- id: 原则二十九_鼓励让改变变容易
  source: 第四篇·第29章
  summary: 使用相反的技术，不吝啬鼓励，使事情看起来很容易做到，让对方知道你对他的能力有信心，他还会尚待开发的天分，他就会拼到深夜争取胜利。
  quote: 使事情看起来很容易做到，让对方知道你对他的能力有信心，他还有尚待开发的天分，那他就会拼到深夜，争取胜利。
  chapter: '29'
- id: 原则三十_让人乐意做
  source: 第四篇·第30章
  summary: 遵循6步：真诚、精确知道想让对方做什么、共情、想想对方的受益、把好处和对方需要匹配、传达对方将是受益者。
  quote: 豪斯上校遵循了人际关系中一条重要的原则：总要使人乐意接受你要做的事。
  chapter: '30'

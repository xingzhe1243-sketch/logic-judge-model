source: 《乌合之众：群体心理学》— 引擎模块
description: 古斯塔夫·勒庞 | 译者：董强 基于1902年第六版 / 1963年PUF重版 用于分析文本中的群体行为、意见形成、领袖影响等现象。
core_concepts:
- id: 心理群体
  definition: 在特定刺激下，个体有意识人格消失、情感和思想被引向同一方向时形成的集体灵魂。
  quote: 有意识的人格消失了，整个群体的情感和想法都被引向了同一个方向。一个群体的灵魂形成了，它也许是过渡性的，但带有一些极其明确的特征。
  chapter: 第一篇·第一章
  keywords:
  - 集体灵魂
  - 心智单一法则
  - 有组织群体
- id: 群体心智单一法则
  definition: 一旦形成心理群体，所有个体的情感与思想被引向同一方向，集体变成一个独一的生灵。
  quote: 集体就变成了一个我称之为'有组织的群体'的东西……群体变成了一个独一的生灵，遵从群体的心智单一法则。
  chapter: 第一篇·第一章
  keywords:
  - 统一方向
  - 集体意志
  - 同质化
- id: 无意识主导
  definition: 群体行为主要受无意识引导，理性被悬置，脊髓（本能）取代脑子（理性）成为行为驱动者。
  quote: 有意识的人格消失，无意识的个性占主导，通过暗示，以及情感和思想的传染，所有人朝向同一个方向。
  chapter: 第一篇·第一章
  keywords:
  - 本能
  - 原始人
  - 自动木偶
  - 去个体化
- id: 群体智力低下
  definition: 群体在智力上总是低于孤立的个体，因为群体中异质性淹没在同质性中，平庸品质占主导。
  quote: 群体添加的，不是智力，而是平庸。人们总是说，所有人加一起，要比伏尔泰更聪明。假如所有人加一起代表了群体的话，那么，伏尔泰一定比他们更聪明。
  chapter: 第一篇·第一章
  keywords:
  - 平庸化
  - 智力下降
  - 批判精神缺失
- id: 情感夸大与简单化
  definition: 群体情感不知细腻，走极端，怀疑立刻变成不容置疑的明显事实，反感变成强烈恨意。
  quote: 群体不知何为细腻，只能看到一整块东西，看不到中间的过渡……他们容易走极端。提出的怀疑，马上会变成不容置疑的明显事实。
  chapter: 第一篇·第二章第三–四节
  keywords:
  - 极端化
  - 过度简化
  - 二元对立
- id: 易受暗示与轻信
  definition: 群体处于无意识边缘，接受各种暗示，缺乏批评精神，将脑海中出现的意象视为真实。
  quote: 群体一直在无意识的边缘徘徊，接受各种暗示……缺乏批评精神，只能显示出一种极度的轻信。'不可能'对他们来说不存在。
  chapter: 第一篇·第二章第二节
  keywords:
  - 暗示
  - 传染
  - 幻觉
  - 集体幻觉
- id: 群体道德两面性
  definition: 群体可以比个体更低劣（残暴、杀戮），也可以比个体更高尚（自我牺牲、忠诚、无私），取决于被暗示的方向。
  quote: 群体经常是罪犯，这一点可以肯定，但他们也经常是英雄。为了一种信仰或者理念的胜利，人们可以轻易地让群体去受死。
  chapter: 第一篇·第二章第五节
  keywords:
  - 无私
  - 忠诚
  - 牺牲
  - 残暴
  - 本能释放
- id: 群体信念宗教形式
  definition: 群体的信念总是带宗教情感特征：崇拜、恐惧、盲从、不容讨论、强烈宣传欲、视异见者为敌人。
  quote: 无论这样一种情感适用于一个看不见的神，一个石制的偶像，一个英雄，还是一种政治理念，其本质都是宗教性的。
  chapter: 第一篇·第四章
  keywords:
  - 崇拜
  - 盲从
  - 不宽容
  - 狂热
  - 宗教情感
- id: 间接因素（遥远成因）
  definition: 五种长期因素准备好了群体接受信仰的土壤：种族、传统、时间、制度、教育。
  quote: 遥远的因素使得群体可以确信某些东西，而拒绝接受另一些。这些遥远的因素准备好了场地，可以让人突然看到一些新观念的出现。
  chapter: 第二篇·第一章
  keywords:
  - 种族
  - 传统
  - 时间
  - 制度
  - 教育
- id: 种族决定论
  definition: 种族是影响群体灵魂最强大的因素。种族的灵魂越强大，群体特征越不明显；群体状态代表向野蛮回归。
  quote: 种族的灵魂完全主导群体的灵魂。它是一种强大的基质，可以防止过大的摇摆。种族的灵魂越强大，群体的特征就越不明显。
  chapter: 第二篇·第一章第一节 / 第三篇·第一章
  keywords:
  - 遗传
  - 祖先
  - 民族灵魂
  - 文明
- id: 词语与口号的力量
  definition: 词语的力量在于其唤起的意象而非真实意义。巧妙使用词语和口号可以控制群体，即使含义模糊。
  quote: 词语的力量与他们所唤起的意象相关，完全独立于它们真正的意义……理性和论证，面对一些词语和口号，是无能为力的。
  chapter: 第二篇·第二章第一节
  keywords:
  - 口号
  - 意象
  - 魔法般力量
  - 标签
- id: 幻想优于真理
  definition: 群体从未渴望真理，他们需要幻觉。能提供幻想者成为主人，试图让人幻灭者成为牺牲品。
  quote: 群体从未渴望真理。面对那些让他们不适的明显的真相，他们转过身去，将谬误神化，只要谬误能够诱惑他们。谁能够带来幻想，就很容易成为他们的主人。
  chapter: 第二篇·第二章第二节
  keywords:
  - 幻想
  - 谬误
  - 乌托邦
  - 希望
- id: 理性无效
  definition: 理性逻辑对群体不起作用。影响群体必须通过情感，而非理性论证。
  quote: 群体是不受逻辑推理影响的，他们只理解一些粗浅的联想……理性逻辑的法则，对于群体起不到任何作用。
  chapter: 第二篇·第二章第四节
  keywords:
  - 情感
  - 非理性
  - 逻辑失效
  - 暗示
- id: 断言-重复-传染
  definition: 领袖影响群体的三大根本手段。断言越简洁越有威信，重复使其深入人心，传染使其扩散。
  quote: 简单、纯粹的断言，摆脱一切的逻辑推理和证据，是让一种观念渗透群体脑海的有效手段……拿破仑说过，只存在一个真正的修辞手法，那就是重复。
  chapter: 第二篇·第三章第二节
  keywords:
  - 断言
  - 重复
  - 传染
  - 广告
  - 宣传
- id: 威望
  definition: 威望是对个体的迷惑力，使批评能力瘫痪，充满惊讶和尊敬。分被赋予的威望（头衔、财富）和个人威望（人格魅力）。
  quote: 威望是一个个体、一部作品，或一种教理对我们的迷惑。这种迷惑力让我们所有的批评能力瘫痪……威望是一切统治的最有力的支撑。没有威望，神灵、国王和女人都无法高高在上。
  chapter: 第二篇·第三章第三节
  keywords:
  - 魅力
  - 迷惑
  - 名望
  - 权威
  - 成功
- id: 领袖心理
  definition: 领袖是首先被自己理念催眠的人，多数是行动家而非思想家，不能太明智，具有坚定信念和强烈意志。
  quote: 领袖在最经常的情况下，首先是一个被自己的理念所操纵的人，然后，他成为该理念的传教者……他们更多地属于那些神经质的人，超级激动的人，半疯狂的人，处于疯狂的边缘。
  chapter: 第二篇·第三章第一节
  keywords:
  - 信念
  - 意志
  - 传教者
  - 独裁
- id: 群体保守本能
  definition: 尽管群体以暴力革命著称，但其深层本能是极其保守的，对传统有恋物癖般的尊重。
  quote: 他们其实是极其保守的。一旦任凭群体放任自流，他们很快就会厌倦自己的无序，本能地转向奴性。
  chapter: 第一篇·第二章第四节
  keywords:
  - 保守
  - 传统
  - 奴性
  - 秩序
- id: 异质群体 vs 同质群体
  definition: 异质群体由不同个体随意组成（如街上人群、议会）；同质群体包括宗派（信仰）、等级集团（职业）、阶级（利益和教育）。
  quote: 异质的群体，包括匿名之众（比方说，大街上的人群）；非匿名之众（评审团、议会，等等）。同质的群体，包括宗派，等级集团，阶级。
  chapter: 第三篇·第一章
  keywords:
  - 异质
  - 同质
  - 宗派
  - 等级集团
  - 阶级
- id: 文明的兴衰
  definition: 文明周期：追随理想从野蛮走向文明，理想消亡后走向败落，种族重新变回群体。
  quote: 追随一个理想，从野蛮走向文明；然后，一旦这个理想失去了它的力量，就开始败落，消亡——这就是一个民族的生命历程。
  chapter: 第三篇·第五章（结论）
  keywords:
  - 文明
  - 理想
  - 衰落
  - 野蛮回归
- id: 议会群体
  definition: 非匿名异质群体的典型代表，特点为意见过于简单化、易受暗示、情感夸张、领袖主导。
  quote: 在议会中，我们可以找到群体的普遍特征：思想的过于简单化，易受刺激，容易接受暗示，感情的夸张，领袖的巨大影响。
  chapter: 第三篇·第五章
  keywords:
  - 议会
  - 投票
  - 领袖
  - 简单化

source: 进化心理学 (D.M. Buss) — 基于原文完整提取的分析引擎模块
description: >-
  Source: D.M.巴斯《进化心理学：心理的新科学》第2版 华东师范大学出版社, 2007年中文版 Real experimental evidence and original citations
  from the book.
core_concepts:
- id: inclusive_fitness
  label: 内含适应性理论
  source: 进化心理学 (第1-2章, 第8章)
  summary: >-
    Hamilton(1964)提出，内含适应性是指个体繁殖后代的直接适应性与个体对遗传亲属适应性的影响的总和。适应器由于能在某种程度上促进个体的内含适应性才被选择出来。Hamilton规则c<rb：当利他者付出的代价(c)低于受惠者获得的收益(b)与遗传相关度(r)的乘积时，利他行为就能进化。
  quote: >-
    一个生物体的内含适应性并非是指他自身的属性，而是指他的行为或影响的属性。内含适应性等于个体自身的繁殖成功，再加上他对其亲属繁殖成功的影响并乘上一个对应的相关系数。(Dawkins, 1982, p.
    186)
- id: natural_selection
  label: 自然选择理论
  source: 进化心理学 (第1章)
  summary: >-
    达尔文提出的自然选择是进化心理学的基石。个体在生存竞争中，那些拥有更适应环境的特征的个体更可能存活并繁殖，从而将这些特征传递给后代。自然选择解释了物种如何适应其生存环境。
  quote: 达尔文的自然选择和性选择理论说起来很简单，但直到今天它们仍然受到很多误解。自然选择也被称作'生存选择'——和Freud的求生本能理论异曲同工。
- id: sexual_selection
  label: 性选择理论
  source: 进化心理学 (第1章, 第4章)
  summary: >-
    达尔文提出性选择来解释那些不能提高生存率但有助于繁殖成功的特征。包含两种形式：(1)同性竞争——同性成员之间竞争接近异性的机会；(2)异性选择——异性偏好某种特征的配偶。性选择解决了达尔文曾寝食难安的反常现象（如孔雀尾巴）。
  quote: 公鹿之间用鹿角相互攻击，这就是性选择的一种形式——同性竞争。由于胜利者能够获得更多的交配机会，所以那些有利于同性竞争的特性将通过繁殖传播到更多的后代身上。
- id: parental_investment
  label: 亲代投资理论
  source: 进化心理学 (第2章, 第4章)
  summary: >-
    Trivers(1972)提出，在大多数物种中，雌性对后代的初始投资（卵子、怀孕、哺乳）大于雄性（精子），因此雌性成为男性竞争和追求的有限资源。投资更多的一方在择偶时更挑剔，投资较少的一方竞争更激烈。该理论是理解两性择偶策略差异的中级水平理论。
  quote: >-
    女性的贡献并不止于卵子，人类亲代投资的关键阶段如受孕、怀孕过程都发生在女性体内。一次性行为只需要最少的男性投资，却有可能令女性付出九月怀胎的代价，此间丧失了其他的择偶机会。
- id: evolved_psych_mechanism
  label: 进化形成的心理机制
  source: 进化心理学 (第2章)
  summary: >-
    进化心理学的核心分析单元是进化形成的心理机制（适应器）。这些机制是自然选择设计来解决特定适应性问题的信息加工程序，具有：(1)功能专门化——每个机制解决一个特定问题；(2)普遍性——在物种中普遍存在；(3)需要环境输入才能发展或激活。
  quote: 进化心理学家相信，正如人体包含着很多专门化的复杂生理解剖机制一样，寓于大脑中的心理也包括很多专门化的复杂机制。
- id: eea
  label: 进化环境 (EEA)
  source: 进化心理学 (第2章)
  summary: >-
    进化环境（Environment of Evolutionary Adaptedness）是指人类心理机制进化的环境条件——不是指某个具体时间和地点，而是祖先反复面临的适应性问题的统计概括。许多现代环境与EEA不匹配，导致进化形成的偏好和现代环境之间的冲突。
  quote: 人类正生活在一个在许多方面都不同于远古时代的现代环境中。例如，现代社会有更新世时代所没有的货币经济。
- id: female_longterm_mate
  label: 女性长期择偶策略
  source: 进化心理学 (第4章)
  summary: >-
    跨文化研究表明，女性普遍偏好：(1)经济资源和提供资源的能力；(2)高社会地位；(3)年龄稍长(表明已积累资源)；(4)抱负和勤奋；(5)可靠性和稳定性；(6)智力和兼容性；(7)体型和对称性(好基因信号)；(8)愿意对家庭承诺和投资。这些偏好解决了女性在进化中面临的独特适应性问题：获得资源支持怀孕和抚养后代。
  quote: 女性一般从配偶那里获取资源。但资源并非总是直接可辨的，因而女性的择偶偏好对于某些品质很敏感，这些品质显示出可能的财富，或者未来的前景和资源。
- id: male_longterm_mate
  label: 男性长期择偶策略
  source: 进化心理学 (第5章)
  summary: >-
    男性长期择偶的核心偏好是年轻和健康——两者都是繁殖价值(未来生育潜力)的关键线索。具体包括：年轻外貌(光洁皮肤、丰满嘴唇、亮泽头发、明亮眼睛)、低腰臀比(WHR约0.7)、对称性、充沛精力、忠诚信号。男性从婚姻中获得五种潜在适应收益：增加吸引异性成功率、吸引更迷人配偶、增加父子关系可信度、提高子女存活率、促进子女成功繁殖。
  quote: 年轻是一个关键的线索，因为根据记录，女性超过20岁以后，她的繁殖价值随着年龄平稳下降。女性过了40岁，繁殖价值就很低了，而到50岁时几乎为零。
- id: whr
  label: 腰臀比 (WHR)
  source: 进化心理学 (第5章)
  summary: >-
    Waist-to-Hip Ratio是腰围与臀围的比值。男性普遍偏好WHR约为0.7的女性。低WHR与高生育力相关：在青春期后显现、由雌激素水平调控、排卵期雌激素升高时WHR降低。这是男性评估女性繁殖价值的关键视觉线索之一。
  quote: >-
    在排卵期，女性的雌激素水平升高，相应地女性的腰臀比率就降低（Profet，个人交流，见Symons, 1995, p. 93）。如前面提到的，较低的WHR对男性更具有性魅力（Singh, 1993）。
- id: symmetry_attraction
  label: 对称性与吸引力
  source: 进化心理学 (第4-5章)
  summary: >-
    面孔和身体的对称性被视为有吸引力的特征，因为对称性是健康信号——标志着发展过程中相对较少的寄生虫感染、对寄生虫的遗传抵抗力、以及较少的环境损伤。对称性与好基因假设相关，尤其在女性排卵期偏好增强。
  quote: >-
    大部分女性发现具有对称的面孔的男性，例如演员Denzel Washington（左图），比起较不对称的面孔的男性，例如音乐人兼演员Lyle Lovett（右图），更有吸引力。根据假设，对称性是一个健康信号，标志着体内相对较少的寄生虫，对寄生虫的遗传抵抗力，或者发展过程中相对较少的环境损伤。
- id: male_shortterm_mating
  label: 男性短期择偶策略
  source: 进化心理学 (第6章)
  summary: >-
    男性短期择偶的进化逻辑基于亲代投资理论：男性投资较少，因此通过增加性伴侣数量可提高繁殖成功率。男性短期择偶要解决四个适应性问题：(1)配偶数量和多样性；(2)性的可接触性；(3)确定生育力；(4)避免承诺。短期择偶降低了择偶标准，偏好性可接触、高生育力、无需承诺的女性。
  quote: >-
    对远古男性而言，短期择偶的主要繁殖收益在于可以繁殖尽可能多的后代，因此男性面临着如何寻求多样的性伴侣这一关键的适应性难题。解决方法之一就是进化出能驱使男性寻求大量多样性性伴侣的心理机制。(Symons,
    1979)
- id: female_shortterm_mating
  label: 女性短期择偶策略
  source: 进化心理学 (第6章)
  summary: >-
    女性短期择偶的五种适应性收益假说：(1)资源假设——通过短期性关系获取肉类、食物或服务；(2)遗传收益假设——获得好基因以增加后代遗传多样性；(3)更换配偶假设——当现有配偶价值降低时作为更换手段；(4)性技巧获取假设；(5)操纵配偶假设。女性短期择偶的代价比男性更大：名誉损失、配偶收回投资、性病风险更高。
  quote: 通过短期性关系女性可以获得肉类、食物或者其他服务。此外，远古女性还可以通过隐藏孩子的父亲身份而从两个或多个男人那里获得资源。(Hrdy, 1981)
- id: parental_care_sex_diff
  label: 亲代抚育的性别差异
  source: 进化心理学 (第7章)
  summary: >-
    三种假说解释为何母亲比父亲提供更多亲代抚育：(1)父子关系不确定性假说——男性永远无法100%确定孩子是自己的；(2)遗弃假说——男性遗弃后代的代价更低；(3)择偶机会代价假说——男性投资于亲代抚育丧失其他择偶机会。即使在被认为父职最高的Aka社会，母亲每天搂抱孩子490分钟而父亲只有57分钟。
  quote: >-
    一项对多种鱼类和两栖类动物的研究发现，有86％的体内受精物种是由雌性承担大量的抚养工作（Gross & Shine, 1981）。相比之下，对于鱼类和两栖类等体外受精物种来说，只有30％是雌性比雄性提供更多的亲代投资，余下的70％是雄性比雌性对亲代抚育投入更多。
- id: parent_offspring_conflict
  label: 父母-子女冲突理论
  source: 进化心理学 (第7章)
  summary: >-
    Trivers(1974)提出父母和子女之间存在固有利益冲突。从孩子的视角，他自己的内含适应性高于兄弟姐妹，因此要求更多投资。而从父母的视角，每个孩子遗传价值相等(50%相关度)，应平均分配投资。冲突并非弗洛伊德所说的性冲突，而是亲代投资分配上的分歧。
  quote: >-
    根据Trivers的理论，父母和子女的利益冲突基本上和孩子的性别无关，至少在学前阶段是这样。相反，冲突是亲代投资上的分歧所导致。儿子和女儿都同样要求父母给予自己比父母想给的还要多的亲代投资。
- id: kinship_altruism
  label: 亲属利他与内含适应性
  source: 进化心理学 (第8章)
  summary: >-
    内含适应性理论预测亲属间利他行为随遗传相关度和受惠者繁殖价值增加而增加。实证支持：(1)生死关头近亲更可能得到帮助；(2)遗嘱中财产更多流向近亲；(3)外婆投资最多，爷爷投资最少(因父子关系不确定性)；(4)亲属关系是自我概念的核心成分；(5)遗传相关度是亲属间投资多寡的主要影响因素。
  quote: 内含适应性理论预测，利他行为会更多地指向那些遗传相关度更高的个体。根据Hamilton(1964)公式推测出来。
- id: step_parenting
  label: 继亲投资与风险
  source: 进化心理学 (第7-8章)
  summary: >-
    亲代投资是宝贵资源，自然选择青睐那些不在非亲属身上浪费资源的心理机制。研究证实继父母比亲生父母对子女的关心更少，继亲家庭中冲突和虐待风险更高。这是内含适应性理论的直接预测。
  quote: 亲代投资是一项宝贵的资源，选择必然青睐那些具有不在非亲属身上浪费资源心理的父母。(p. 83)
- id: reciprocal_altruism
  label: 互惠式利他行为理论
  source: 进化心理学 (第9章)
  summary: >-
    Trivers(1971)提出互惠式利他理论：利他者现在为他人提供利益，日后从受惠者获得回馈时利他行为就能进化。Axelrod的计算机模拟发现[以牙还牙](Tit-for-Tat)是最成功的策略：第一轮合作，随后复制对方上一轮行为。促进合作策略包括：以牙还牙、引导互惠、坚持公平原则、迅速反击背叛。
  quote: 以牙还牙策略是指，个体第一次选择合作，随后选择互惠式的合作。这个策略不仅能够促进双方合作，而且还有助于解决欺骗问题，因为它可以马上对欺骗行为予以惩罚。
- id: social_contract_theory
  label: 社会契约理论与欺骗检测
  source: 进化心理学 (第9章)
  summary: >-
    Cosmides和Tooby提出人类已进化出专门检测社会交换欺骗者的心智模块。五种必需能力：(1)识别个体；(2)记住交换历史；(3)向他人表达自身价值观念和需要；(4)认识他人需要；(5)以代价和收益表征交换事物。沃森选择任务是检测欺骗检测能力的经典实验范式。
  quote: 社会契约理论认为，人类已经进化了5种能力来解决社会交换中的欺骗问题，从而确保人们在交换活动中获得成功。
- id: aggression_adaptation
  label: 攻击行为的进化适应功能
  source: 进化心理学 (第10章)
  summary: >-
    攻击不是单一现象，而是一组解决特定适应性问题的行为策略：(1)获取他人资源；(2)防御攻击；(3)同性竞争(击败对手以获得接近异性机会)；(4)提升社会等级/地位；(5)留住配偶(防止不忠)；(6)消除非己后代。潜在心理机制在高度特殊化情境条件下才会显现。
  quote: 从进化心理学的视角来看，攻击行为并不是一种铁板一块的现象。其实，它是一组行为策略，只有在高度特殊化的情境条件下才会显现出来。
- id: male_aggression
  label: 男性攻击性的进化解释
  source: 进化心理学 (第10章)
  summary: >-
    男性的繁殖成功率取决于接近女性的机会，因此同性竞争更加激烈。男性比女性拥有更高的繁殖上限（可以拥有更多后代），这种繁殖可变性差异导致男性在竞争中冒更大风险。跨文化证据：92%的性嫉妒凶杀案是男性对男性。
  quote: >-
    两性在亲代投资的最低责任（比如雌性哺乳动物要承担体内受精和怀孕的重担）上存在很大的差异。这些性别差异意味着雄性可以比雌性拥有更多的后代（参见第四章）。换句话说，雄性的繁殖上限要远远高于雌性。
- id: sex_conflict
  label: 策略冲突理论
  source: 进化心理学 (第11章)
  summary: >-
    策略冲突理论认为两性冲突源于男性和女性采用的不同交配策略之间的干扰。消极情绪（愤怒、嫉妒、忧伤）是进化来解决策略冲突的适应器——激发对冲突来源保持警惕并采取行动。核心假设：当一方违背另一方意愿时，策略冲突就会发生。
  quote: >-
    策略冲突理论有两个主要的假设。第一，无论哪一方违背了异性成员的意愿，策略冲突都会发生；从历史上来看，这种冲突能够有效阻止我们祖先对某种策略过分偏爱而导致繁殖成功率的降低。
- id: sexual_jealousy
  label: 性嫉妒的两性差异
  source: 进化心理学 (第11章)
  summary: >-
    进化预测男性对配偶的性背叛（身体出轨）更嫉妒（因父子关系不确定性威胁繁殖成功），女性对配偶的情感背叛（情感出轨）更嫉妒（因可能意味着男性资源转移）。性嫉妒是激发同性攻击和凶杀的重要因素。
  quote: 性嫉妒可能是激发同性之间的攻击和凶杀行为的另一个重要因素。要知道，大多数的凶手都是男性，大多数的受害者也是男性。
- id: mate_retention
  label: 留住配偶策略
  source: 进化心理学 (第11章)
  summary: >-
    男性和女性采用不同策略来留住配偶：女性更多提升自身吸引力（化妆、打扮时尚）；男性更多使用警惕和暴力信号（威胁情敌、限制配偶自由、展示资源）。伴侣更年轻更迷人的男性更常使用留住配偶策略。经济资源缺乏的丈夫更可能使用暴力策略。
  quote: 女性往往通过美容养颜来留住配偶，即通过面容化妆、追赶潮流使自己变得更有吸引力。拥有更加努力为地位奋斗的丈夫的女性，比起其他女性，显然要投入更多留住配偶的努力。
- id: status_dominance
  label: 地位、声望和社会支配
  source: 进化心理学 (第12章)
  summary: >-
    支配等级在人类和其他社会动物中普遍存在，提供了解决冲突的非暴力方式。高地位个体获得更多资源、更好的食物和更多的交配机会。人类追求地位的心理机制是性选择的结果，因为地位提升了男性吸引配偶的能力。
  quote: >-
    从功能的角度来讲，支配等级（dominance hierarchy）是指一个群体内的一部分人比其他人拥有更多的机会去获得那些非常关键的资源——即有助于个体的生存和繁衍的资源（Cummins，1998）。
- id: ovulatory_shift
  label: 排卵周期偏好转移
  source: 进化心理学 (第4章)
  summary: >-
    女性在排卵期（受孕概率高时）的择偶偏好发生显著变化：转向偏好更有男子气的男性面孔和对称性更好的男性体味。这种周期性变化可能反映了两种适应器——帮助女性在受孕概率高时寻找最健康的男性配偶以获得好基因。
  quote: >-
    在女性更有可能受孕时，她们的择偶偏好会转向更有男子气的男性面孔以及对称性更好的男性的体味。这两种周期性的变化可能反应了两种适应器，它们有助于女性寻找最健康的男性作为配偶。
- id: good_genes_hypothesis
  label: 好基因假设
  source: 进化心理学 (第4章)
  summary: >-
    好基因假设认为女性偏好某些男性特征（对称性、男子气概）是因为这些特征是好基因的信号——表明该男性对寄生虫和疾病有更强的遗传抵抗力。将这些基因传给后代可提高后代的生存和繁殖成功率。
  quote: 研究者假设卵泡期后期的择偶偏好将会影响后代"优秀基因"的选择。
- id: hunting_hypothesis
  label: 狩猎假设
  source: 进化心理学 (第3章)
  summary: >-
    狩猎假设认为男性的亲代投资行为、男性间牢固同盟、互惠式社会交换、劳动性别分工以及石器工具发展都可以通过男性狩猎活动得到解释。为女性和子女提供食物是狩猎活动出现的主要原因。
  quote: 除了解释男性巨大的亲代投资行为之外，狩猎假设至少还能部分地解释男性间的牢固同盟、朋友之间的互惠式同盟和社会交换，以及劳动的性别分工和石器工具的发展。
- id: evolutionary_meta_theory
  label: 进化心理学的分析层次
  source: 进化心理学 (第2章)
  summary: >-
    进化心理学包含三个分析水平：(1)一般进化理论——内含适应性理论，被当作事实接受；(2)中级水平理论——如亲代投资理论、互惠利他理论等，从一般理论推导但具有自身价值；(3)具体假设——关于特定适应性问题及其心理解决方案。
  quote: 任何一门科学的本质特征之一，就是形成假设。在进化心理学中，具体的假设主要集中于适应性问题及其解决方案。

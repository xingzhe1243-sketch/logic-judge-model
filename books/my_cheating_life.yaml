source: 我的老千生涯 — 腾飞
description: >-
  中国地下赌场的真实记录：赌博、老千与人性博弈 A first-person account of professional gambling and cheating in China's underground
  casinos.
core_concepts:
- id: cheating_profession
  label: 老千的职业生态
  source: 第一章 木头驴 及 全书
  summary: >-
    老千是以赌博作弊为生的职业群体。他们混迹于各类赌局中，通过藏牌、换牌、洗牌控牌、信号传递等手段操控赌局结果。老千的生存法则是：不贪、不露、不惹事。真正的老千必须控制赢钱的频率和幅度——每次赢太多会被发现，赢太少不值得。高手从不在一场赌局中赢走所有人，而是细水长流。
  quote: 出千这个东西千变万化.而且总在不断的更新.所以常常要去适应新的千术.去学新的千术.你永远不知道明天会出什么新花样
- id: human_greed
  label: 贪婪是赌徒的死穴
  source: 第三章 大圈套 及 全书
  summary: >-
    赌徒最大的敌人不是庄家也不是老千，而是自己的贪婪。赢了想赢更多，输了想翻本——这两种心态都会让人无法离开赌桌。老千利用的正是这种心理：先让目标赢一点尝到甜头，诱使其加大赌注，然后一举收网。贪婪使人失去判断力、忘记风险、忽视异常。
  quote: 还有一种就是赢了还想赢。总幻想别人腰包里的钱都会被他给赢去。输了想翻本。总告诫自己，翻了本就说什么也不干了。但是万一真翻了本。又想去多赢一点。
- id: setting_the_trap
  label: 做局与入局
  source: 第三章 大圈套 及 第四章 杀老千
  summary: >-
    老千行骗的核心是「做局」——精心设计一个看似公平的赌局，诱使目标一步步陷入。做局的过程包括：选择目标（有经济实力、好赌）、建立信任（通过熟人介绍或长期放线）、制造假象（先让目标赢）、收网（一把清空）。目标的身份越是体面（官员、商人），越容易入局——因为他们相信自己的判断力。
  quote: 有一段日子总去钓凯子。钓凯子的日子就是算计，算计谁有钱？算计如何让凯子上钩。算计如何做局。说直白点就是骗。如何骗得没有露洞。所以整天抓心挠肝的。
- id: card_techniques
  label: 牌桌上的千术
  source: 第二至五章（各章实战描述）
  summary: >-
    麻将和纸牌的作弊手法包括：藏牌（将好牌藏在手边口袋里以备后续需要）、换牌（在摸牌瞬间用藏好的牌替换手中的牌）、洗牌控牌（在洗牌时将好牌安排到特定位置以便自己或同伙拿到）、信号传递（与同伙用暗号交流牌面信息）。这些手法需要长期练习以达到自然而然的熟练度。
  quote: 换牌:换牌的形式多种多样.可以换一张牌,也可以换很多牌,也可以当大家的面把整副扑克都换成另外一副一样的我编辑好了的牌.
- id: psychology_of_gambling
  label: 赌博的心理机制
  source: 全书综合
  summary: >-
    赌博成瘾的心理机制包括：间歇性强化（随机的不定期赢钱最让人上瘾——比每次赢更让人难以戒断）、沉没成本谬误（输了之后想翻本，越陷越深）、控制幻觉（赌徒相信自己有技巧或运气能左右结果、但实际上没有）、社会压力（在赌桌上不敢认怂、怕丢面子）。
  quote: >-
    几乎所有人都这样。拿一笔钱去赌场玩。玩了自己也不知道具体多少把牌。基本都输，很少有拿一大笔钱去就押一下，输赢都收手不玩的。要知道赌场每次的打水。就好像你用俩只碗来回的倒水一样。赌场的打水就好像你每倒一次洒一点出来。倒来倒去倒到最后。最后就是俩个空碗。就是这个道理。古人早说过：久赌神仙输。我想也是这个道理。
- id: addiction_cycle
  label: 赌瘾的恶性循环
  source: 第六章 欠赌债 至 第十二章 揭开大幕
  summary: >-
    赌瘾的发展路径：小赌怡情→加大赌注→输钱想翻本→借债赌博→债台高筑→变卖家产→家庭破裂→走上犯罪道路。在这个过程中，赌徒的理性判断逐步丧失，赌注越来越大、底线越来越低。最可悲的是，即使明知道被老千骗了，很多人仍然无法离开赌桌——因为输掉的钱太多、不赌就永远无法「翻本」。
  quote: 输钱的赌徒往往是可怕的。为了筹集赌本。什么事都能做的出来。老着脸皮去找亲戚朋友。编各种借口借的。哪怕才认识几天他都能老下脸皮去借，实在借不着就去骗，去偷，去抢。
- id: gambling_networks
  label: 赌场的人情与算计
  source: 第十三至十七章
  summary: >-
    地下赌场是一个微型社会，每个人都在算计。组织者抽取佣金（抽水）、放高利贷的提供赌资（放水）、老千操控结果、荷官暗中配合、打手维持秩序。看似热闹友好的氛围下，每个人都有自己的利益算计。所谓的「朋友」介绍你去赌局，往往是因为你被当成了「水鱼」。
  quote: >-
    赌博是最容易改变一个人的。俗话说：赌场无父子。很有道理地，无论多吗要好的朋友。一旦同时坐上了赌桌。那就成了竞争对手。那个时候你在对方的眼中不是朋友。而是要想办法去掏空他的口袋的一个人，对方也是。有了这样的心思。就必然使坏耍诈。于是在赌里绝对是什么人都可以出卖的。什么人都可以骗的。
- id: cheating_moral_dilemma
  label: 老千的道德困境
  source: 第十五章 骗局人生 及 全书
  summary: >-
    职业老千群体内部的道德评价与外界不同：他们鄙视偷盗和抢劫，认为自己的「技术」在灰色地带，甚至声称是帮那些贪心的赌徒「上课」。但随着时间推移，大多数老千都面临自我认同的危机——尤其是当他们看到受害者家破人亡的时候。很多老千最终选择退出，即使这意味着要面对来自赌场方面的威胁。
  quote: >-
    说说我千过的人吧.那些被我当凯子千过的人.我的心情现在是复杂的.让我赎罪我做不来,毕竟都成为了过去.让我去补偿我更做不到.可能说开了就不是补偿俩个字可以了结的,我所能做的只能是在这里假惺惺的说声对不起了.
- id: gambling_vs_skill
  label: 赌博与技术的界限
  source: 全书主题
  summary: >-
    真正的赌博应该是一种概率游戏，但中国地下赌场几乎没有真正的概率可言——只要存在人为操作的空间（发牌、洗牌、切牌），老千就有办法控制结果。作者的核心观点：永远不要和人打牌。任何你无法完全控制流程的赌局，你都是待宰的羔羊。
  quote: >-
    所有的赌徒都希望通过赌来赚钱。都期望一下赢了钱改变现在的生活。几乎每个人都是抱着这样的心态坐上赌桌的，偶尔那一把赢了，就会强烈的刺激到他。认为这个钱来的太容易了。但是他不知道，凡是有赌的地方就有老千的存在，所以说，赌根本不是什么公平的游戏。你最后只能是输得血本无归
